<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VEN · Founder Dinners demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* VEN member portal tokens (from platform.venexecs.com). Layout: portal shell (header + tab bar) under a dark demo strip; one centered column of cards. */
:root{
  --bg:#F4F1E9; --card:#FCFBF7; --ink:#252C2B; --ink-2:#555D5B; --line:#CBC8BD; --line-soft:#E2DED3;
  --steel:#486174; --steel-ink:#FFFFFF; --tab:#F1DFCD; --rust:#9A4A09; --chip:#E8ECEC;
  --good:#2F6B4F; --good-bg:#E3EFE7; --warn:#8A5A12; --warn-bg:#F6EBD6; --bad:#9B3B2E; --bad-bg:#F5E2DE;
  --demo:#252C2B; --demo-ink:#F4F1E9;
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto}
.demo{background:var(--demo);color:var(--demo-ink);font-size:13px;position:sticky;top:0;z-index:5}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:9px}
.demo b{font-weight:700;letter-spacing:.02em}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:rgba(244,241,233,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:inherit;padding:5px 11px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--demo-ink);color:var(--demo)}
.demo .note{opacity:.7;margin-left:auto}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:18px}
.logo{font-size:28px;font-weight:500;letter-spacing:-.02em;cursor:pointer;background:none;border:0;padding:0}
.who{display:flex;align-items:center;gap:12px;text-align:right;font-size:13px;line-height:1.3}.who b{display:block;font-size:15px}
.tabs{background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs .wrap{display:flex;gap:2px;padding-top:8px}
.tab{display:flex;align-items:center;gap:8px;padding:9px 14px;border:0;background:none;border-radius:8px 8px 0 0;font-size:15px;white-space:nowrap;color:var(--ink);border-bottom:3px solid transparent;cursor:pointer}
.tab:hover{background:color-mix(in srgb,var(--tab) 50%,transparent)}
.tab.on{background:var(--tab);border-bottom-color:var(--rust);font-weight:600}
.new{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--steel);color:var(--steel-ink);border-radius:999px;padding:1px 7px}
main{padding-block:28px 72px}
h1{font-size:34px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:700}
.lede{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px 22px}
.row{display:flex;gap:16px;align-items:flex-start}
.row>.grow{flex:1;min-width:0}
@media (max-width:620px){.row.wrapm{flex-wrap:wrap}}
.date{flex:0 0 auto;width:62px;text-align:center;background:var(--chip);border-radius:10px;padding:8px 0;line-height:1.1}
.date b{display:block;font-size:22px}.date span{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.ip{background:var(--tab);color:var(--rust);font-weight:600}
.desc{color:var(--ink-2);font-size:14px;margin:10px 0 0;max-width:68ch}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:6px}
.btn.sm{padding:6px 13px;font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.seats{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.seats i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--steel)}.seats i.f{background:var(--steel)}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.split>*{min-width:0}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.fgrid{grid-template-columns:1fr}}
textarea,select,input[type=text],input[type=email]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.policy{background:var(--bg);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.policy table{border-collapse:collapse;width:100%;margin-top:6px}
.policy td{padding:5px 0;border-top:1px solid var(--line-soft);vertical-align:top}.policy td:last-child{text-align:right;font-weight:600;padding-left:10px}
.price{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding-bottom:16px;position:relative}
.steps li::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;z-index:1}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:var(--card)}
.steps li.now .dot{border-color:var(--steel);color:var(--steel)}
.steps small{display:block;color:var(--ink-2);font-size:13px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.people{grid-template-columns:1fr}}
.person{display:flex;gap:12px;padding:14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg)}
.av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tab);color:var(--rust)}
.av.host{background:var(--steel);color:var(--steel-ink)}
.av.sm{flex-basis:32px;width:32px;height:32px;font-size:12px}
.av.lg{flex-basis:72px;width:72px;height:72px;font-size:24px}
.person p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.why{margin-top:6px;font-size:13.5px;color:var(--ink)}
.venue{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.venue{grid-template-columns:1fr}}
.map{min-height:150px;border-radius:12px;border:1px solid var(--line-soft);position:relative;background:
  linear-gradient(90deg,transparent 48%,var(--line-soft) 48%,var(--line-soft) 52%,transparent 52%),
  linear-gradient(0deg,transparent 38%,var(--line-soft) 38%,var(--line-soft) 42%,transparent 42%),
  linear-gradient(135deg,var(--chip),var(--bg))}
.map::after{content:"";position:absolute;left:calc(50% - 9px);top:calc(40% - 22px);width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--rust)}
.prompt{background:var(--steel);color:var(--steel-ink);border-radius:16px;padding:28px 24px;font-size:20px;font-weight:700;line-height:1.35;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.prompt small{font-size:12.5px;font-weight:600;opacity:.8}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:center;font-size:13.5px}
.pick input{accent-color:var(--steel)}
.pick label:has(input:checked){border-color:var(--steel);background:color-mix(in srgb,var(--steel) 10%,transparent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.mutebox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
.preview{background:#DCE3E6;border-radius:14px;padding:18px 22px;color:#252C2B}
.preview .seg{background:#FCFBF7}
.preview .seg button{color:#252C2B}
.pills{display:inline-flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.pills button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.pills button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink)}
.list{display:flex;flex-direction:column}
.list>.item{padding:18px 22px;border-top:1px solid var(--line-soft)}
.list>.item:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--ink-2)}
.tbl{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;min-width:600px}
.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.t td.num{font-variant-numeric:tabular-nums}
.t .nm{display:flex;align-items:center;gap:10px}
.tables2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.tables2{grid-template-columns:1fr}}
.tline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.tline:first-of-type{border-top:0}
.auto{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:baseline;font-size:14px}
@media (max-width:620px){.auto{grid-template-columns:1fr auto}.auto .w{grid-column:1/-1;margin-top:6px}}
.auto .w{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.auto .who2{font-size:12.5px;font-weight:700;white-space:nowrap}
.who2.a{color:var(--good)}.who2.m{color:var(--warn)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.bcard{padding:18px;display:flex;flex-direction:column;gap:6px}
.bcard .big{font-size:24px;font-weight:800}
.progress{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}.progress i{display:block;height:100%;background:var(--steel)}
.doc{max-width:780px}
.doc ul,.doc ol{padding-left:20px;margin:8px 0 0}
.doc li{margin:4px 0;max-width:66ch}
.callout{background:var(--tab);border-radius:12px;padding:14px 16px}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--tab);border-radius:14px;padding:16px 20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="demo g"><div class="wrap">
  <b>DEMO</b>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-v="member" aria-pressed="true">Member portal</button>
    <button type="button" data-v="ops" aria-pressed="false">Ops panel</button>
    <button type="button" data-v="concept" aria-pressed="false">Concept</button>
  </div>
  <div class="seg" role="group" aria-label="Dinner journey" id="jump">
    <button type="button" data-s="0">1 Browse</button><button type="button" data-s="1">2 Book</button>
    <button type="button" data-s="2">3 Booked</button><button type="button" data-s="3">4 48h before</button>
    <button type="button" data-s="4">5 The night</button><button type="button" data-s="5">6 After</button>
  </div>
  <span class="note">Example people and data · nothing is saved or charged</span>
</div></div>

<header class="top g"><div class="wrap">
  <button type="button" class="logo" data-t="dashboard" aria-label="VEN dashboard">VEN</button>
  <div class="who"><span><b>Maya Chen</b>maya@northwind.ai</span><span class="av sm">MC</span></div>
</div></header>
<nav class="tabs g" aria-label="Member portal" id="tabs"></nav>
<main class="g"><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- example data (all people and companies are invented) ---------- */
const ME = {n:"Maya Chen",i:"MC",co:"Northwind AI",title:"CEO",stage:2};
const EV = {id:"dinner-nov", title:"Dinner", day:"12", mon:"Nov",
  when:"Thursday, Nov 12 · 7:00 PM", area:"Seattle",
  seats:12, taken:9, closes:"Thu, Nov 5", reveal:"Tue, Nov 10", freeUntil:"Tue, Nov 10, 7:00 PM", price:75};
const FORMATS = [
  {k:"dinner",ic:"🍽",n:"Dinner",d:"Thursday, Nov 12",t:"7:00 PM",line:"Five other founders at your stage. Three hours, one table.",main:1},
  {k:"ceo",ic:"🍽",n:"CEO dinner",d:"Thursday, Dec 10",t:"7:00 PM",line:"Only CEOs. The table where you can say what you can't say to your team."},
  {k:"coffee",ic:"☕",n:"Coffee",d:"Friday, Nov 20",t:"8:00 AM",line:"One hour before work. The easy first one."},
  {k:"ops",ic:"🍽",n:"CFO & COO dinner",d:"Wednesday, Dec 16",t:"7:00 PM",line:"Finance and operations leaders from venture-backed companies."}
];
const SESSIONS = [
  {id:"s1",d:"29",m:"Oct",t:"AI for GTM: Building your prospecting workflow",when:"Thu, Oct 29 · 12:00–1:00 PM PDT",who:"Owen Marsh",tags:["Open","Expert"],cat:"Go-to-market",
   desc:"Most go-to-market teams have tried AI tools. Far fewer have AI woven into how they prospect, research accounts, follow up and keep the CRM clean. A working session with your own pipeline as the example."},
  {id:"s2",d:"03",m:"Nov",t:"SOC 2 for Startups: What to Do First, What It Costs, and What Auditors Look For",when:"Tue, Nov 3 · 11:00 AM–12:00 PM PST",who:"Dana Whitfield",tags:["Stage 1","Expert"],cat:"Security",
   desc:"SOC 2 is quickly becoming a requirement in enterprise sales. A larger customer asks for your report, and suddenly you need to understand controls, auditors, tooling and timelines."},
  {id:"s3",d:"04",m:"Nov",t:"Expanding into the US: Capital, Compliance and Competition",when:"Wed, Nov 4 · 5:30–6:30 AM PST",who:"Henrik Lund",tags:["Stage 2","Expert"],cat:"Legal",
   desc:"For founders based outside the US: entity setup, raising from US investors, and what changes in hiring and contracts once you sell here."},
  {id:"s4",d:"10",m:"Nov",t:"Board meetings and investor updates: what VCs actually read",when:"Tue, Nov 10 · 1:00–2:00 PM PST",who:"Rachel Ito",tags:["Stage 2","VC"],cat:"Fundraising",
   desc:"A partner at an early-stage fund walks through the investor updates she forwards and the ones she skims, and how to run a board meeting that helps you."}
];
const ADVISORS = [["Dana Whitfield","Ridgeway Audit Partners","Security & compliance","Seattle, WA"],["Owen Marsh","Pipeline Lab","Go-to-market","Austin, TX"],
  ["Henrik Lund","Lund & Carver LLP","Cross-border legal","London, UK"],["Rachel Ito","Northbeam Ventures","Fundraising","San Francisco, CA"],
  ["Tomás Ferreira","Ferreira Talent","Executive hiring","Seattle, WA"],["Grace Liu","Arbor CFO Partners","Finance & FP&A","Bellevue, WA"],
  ["Noah Bennett","Bennett IP Group","Patents & IP","Seattle, WA"],["Ifeoma Adeyemi","Clearwater Health Advisory","Selling to health systems","Chicago, IL"]];
const DIRECTORY = [["Jordan Reyes","Ledgerline","Fintech",2],["Priya Natarajan","Cartwell Health","Healthcare",2],["Sam Okafor","Brightpath Freight","Logistics",3],
  ["Elena Varga","Tessellate","B2B software",2],["Lena Park","Fieldnote","AI and machine learning",1],["Ravi Shah","Quanta Labs","Developer tools",2],
  ["Chris Doyle","Harborline","Marine tech",1],["Ana Ruiz","Moss & Field","Consumer",1],["Ben Hale","Cobalt Robotics","Robotics",2],["Mia Torres","Lumen Grid","Climate",1]];
const LIBRARY = [["Recording","How to find product-market fit","VEN team · Jul 30, 2025"],["Recording","Pricing your first enterprise contract","Owen Marsh · Sep 12, 2026"],
  ["Playbook","SOC 2 in 90 days: the checklist","Dana Whitfield · Oct 2, 2026"],["Recording","Your first VP of Sales: when and who","Tomás Ferreira · Aug 21, 2026"],
  ["Playbook","Investor update template","Rachel Ito · Sep 30, 2026"],["Recording","US entity setup for foreign founders","Henrik Lund · Jul 14, 2026"]];
const BENEFITS = [["Deel","HR/People","$5,000","in Deel credits"],["Databricks","Data & AI","$200K","in Databricks credits"],["Notion","Productivity","Free","6 months of Notion Business"],
  ["HubSpot","CRM","90%","off HubSpot in year 1"],["Pipeline Lab","Sales","3h","of free sales consulting"],["Arbor CFO Partners","Finance","Free","60-minute finance review"]];
const TABLE = [
  {n:"Jordan Reyes",i:"JR",r:"CEO, Ledgerline · Stage 2",why:"Closed his first Fortune 500 deal in July and went through SOC 2 Type 1 in 9 weeks."},
  {n:"Priya Natarajan",i:"PN",r:"CTO, Cartwell Health · Stage 2",why:"Same question as you: HIPAA and SOC 2 in one audit window."},
  {n:"Sam Okafor",i:"SO",r:"CEO, Brightpath Freight · Stage 3",why:"Hiring a first enterprise AE. You asked about the founder-led to AE handoff."},
  {n:"Elena Varga",i:"EV",r:"COO, Tessellate · Stage 2",why:"Built the security questionnaire process at her last company."},
  {n:"Ravi Shah",i:"RS",r:"CEO, Quanta Labs · Stage 2",why:"Raising a Series B in Q1. Asked how others pick between two term sheets."}];
const PROMPTS = [["Start with a round. Two minutes each: the one thing you're working through right now.","Everyone brought one when they booked"],
  ["Who at this table has already solved something you're stuck on?","Then talk about whatever you like"],
  ["Before dessert: one thing you'll do differently next week.","Optional"]];
const RSVPS = [["Maya Chen","Northwind AI",2,"6 of 6","Confirmed"],["Jordan Reyes","Ledgerline",2,"9 of 10","Confirmed"],["Priya Natarajan","Cartwell Health",2,"4 of 4","Confirmed"],
  ["Sam Okafor","Brightpath Freight",3,"5 of 7","Confirmed"],["Elena Varga","Tessellate",2,"3 of 3","Confirmed"],["Lena Park","Fieldnote",1,"2 of 2","Confirmed"],
  ["Ravi Shah","Quanta Labs",2,"7 of 8","Confirmed"],["Chris Doyle","Harborline",3,"3 of 6","Confirmed"],["Ana Ruiz","Moss & Field",1,"1 of 4","Waitlist only"],
  ["Ben Hale","Cobalt Robotics",2,"5 of 5","Waitlist"],["Mia Torres","Lumen Grid",1,"2 of 2","Waitlist"]];
const TABS = [["dashboard","Dashboard"],["profile","Profile"],["sessions","Sessions"],["inperson","In person",1],["library","Content library"],["advisors","Advisors"],["directory","Directory"],["benefits","Benefits"],["account","Account"]];

/* ---------- state ---------- */
const S = {v:"member", t:"inperson", s:0, sess:null, stab:"upcoming", reg:new Set(), booked:false, cancel:false, late:false, seated:false,
  picked:new Set(["Priya Natarajan","Sam Okafor"]), pi:0, prop:false, q:"Type 1 now or wait for Type 2? A customer wants the report by March.", diet:"No restrictions", libf:"All"};
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini = n => n.split(/\s+/).map(w=>w[0]).slice(0,2).join("");
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2000)}
const seatDots=(n,f)=>`<div class="seats" aria-label="${f} of ${n} seats taken">${Array.from({length:n},(_,i)=>`<i class="${i<f?"f":""}"></i>`).join("")}</div>`;
const taken=()=>EV.taken+(S.booked?1:0);

/* ---------- shared pieces ---------- */
function dinnerCard(btn){
  return `<article class="card pad"><div class="row wrapm"><div class="date" style="background:var(--tab)"><b>${EV.day}</b><span>${EV.mon}</span></div>
    <div class="grow"><h2>${esc(EV.title)}</h2>
      <div class="meta"><span>${EV.when}</span><span>${EV.area}</span></div>
      <p class="desc">You and five other founders at your stage, at a restaurant we book. We pick the table from what each of you is working through, so the person across from you has probably solved your problem, or is stuck on the same one. You find out where and with whom two days before.</p>

      <div class="mutebox"><b>Table 2</b> <span style="color:var(--ink-2)">· first sales hires, scaling the team</span>${["Sam Okafor","Chris Doyle","Ben Hale (from waitlist)","Mia Torres (from waitlist)","+ 2 seats open"].map(n=>`<div class="tline"><span>${n}</span></div>`).join("")}</div></div>
      <div class="actions"><button type="button" class="btn pri" data-toast="Tables locked. The reveal email goes out Tue, Nov 10, 9:00 AM">Approve tables</button></div></article>`:""}
    <article class="card pad stack"><h2>What runs on its own</h2><div class="auto">
      <span class="w">Monthly</span><span>Next month's dinner is created: same weekday, same venue, same seat count</span><span class="who2 a">Automatic</span>
      <span class="w">−4 weeks</span><span>Invite to Seattle members matched to stage, and to anyone who said “I'd come”</span><span class="who2 a">Automatic</span>
      <span class="w">−7 days</span><span>RSVPs close. Seating proposal from the questions and stages</span><span class="who2 a">Automatic</span>
      <span class="w">−7 days</span><span>Review and approve tables. Send the headcount to the restaurant</span><span class="who2 m">Ops · 15 min</span>
      <span class="w">−48 h</span><span>Reveal email: table, names, why matched, venue. “Still coming?” check</span><span class="who2 a">Automatic</span>
      <span class="w">−48 h to 0</span><span>A cancellation offers the seat to the waitlist. First to reply gets it</span><span class="who2 a">Automatic</span>
      <span class="w">Night of</span><span>Nobody from VEN needed. The table is booked under VEN, the round-start card is in the reveal email</span><span class="who2 a">Automatic</span>
      <span class="w">+1 day</span><span>“Who do you want to stay in touch with?” Mutual picks get an intro email</span><span class="who2 a">Automatic</span>
      <span class="w">+1 day</span><span>No-shows recorded on reliability</span><span class="who2 a">Automatic</span></div>
      <p class="desc" style="margin-top:4px"><b>Ops time per dinner: about 15 minutes</b>, to check the tables and send the headcount. The rest is the machinery we already run for Zoom sessions, plus a venue.</p></article></div>`;
}
function concept(){
  return `<div class="doc stack"><div><span class="label">Concept</span><h1>Founder Dinners</h1><p class="lede">Members keep asking for in-person time. This brings it back with the process we already run for Zoom sessions, plus a venue, and about 30 minutes of ops per dinner.</p></div>
    <div class="callout"><b>In one line.</b> One fixed dinner night per city per month, like Timeleft: no topic, no host. Founders book a seat, we put six at a table by what they're working through, they start with one quick round, and they show up because the seat is paid.</div>
    <section class="card pad stack"><h2>The outcome</h2><p style="margin:0">Every attendee leaves with at least one founder they'll follow up with. That is what keeps people in a community. We measure it with mutual picks the next morning, a second conversation within 30 days, and how many book again.</p></section>
    <section class="card pad stack"><h2>What we take from Timeleft</h2><ul>
      <li><b>Fixed dates, no scheduling.</b> Timeleft runs the same night every week per city. Picking the date is how you say you're free. We do it monthly.</li>
      <li><b>Matching after the cutoff.</b> Tables are built only from people still booked when RSVPs close.</li>
      <li><b>Reveal late.</b> Names and venue come shortly before. By then people plan around it.</li>
      <li><b>Pay to hold the seat.</b> Timeleft uses a cancellation ladder and a no-show fee. Ours is a paid set menu, non-refundable inside 48 hours.</li>
      <li><b>After the night.</b> Mutual picks become intros, which we already do by email.</li></ul></section>
    <section class="card pad stack"><h2>What we do differently, because we are small</h2>
      <p style="margin:0">Timeleft survives last-minute cancellations with volume: dozens of tables a night, so two half-empty ones get merged. We won't have that, so the format has to survive cancellations on its own.</p><ul>
      <li><b>One restaurant, two tables next to each other.</b> If three drop out, we merge into one table on the spot and it's still a good evening.</li>
      <li><b>No host, but one ritual.</b> Everyone writes down what they're working through when they book. At the table, one round: two minutes each. That replaces a facilitator, makes sure everyone talks, and shows who to follow up with.</li>
      <li><b>Tables by stage and what you're working through.</b> Later also by role: CEO, CTO, CFO/COO dinners, which fits VEN serving the whole leadership team.</li>
      <li><b>Paid seat.</b> Membership alone doesn't make people show up; our Zoom sessions show that. A paid dinner does.</li>
      <li><b>Waitlist and reliability.</b> Cancellations go to the waitlist automatically. Repeat no-shows book from the waitlist.</li>
      <li><b>Never cancel on the night.</b> Under 6 confirmed seven days out, it becomes one table. Under 4, we move it and say so a week ahead.</li></ul></section>
    <section class="card pad stack"><h2>Money per dinner</h2><div class="tbl"><table class="t"><thead><tr><th>Item</th><th>Amount</th><th>Notes</th></tr></thead><tbody>
      <tr><td>Set menu paid by founders</td><td class="num">12 × $75 = $900</td><td>Food, one drink, tax and tip</td></tr>
      <tr><td>Restaurant minimum</td><td class="num">$750–$1,000</td><td>Private room, same night every month</td></tr>
      <tr><td>Sponsor (later, optional)</td><td class="num">$0–$1,500</td><td>An advisor firm could cover dinner for a seat at the table</td></tr>
      <tr><td>Ops time</td><td class="num">~15 min</td><td>Check the tables, send the headcount</td></tr></tbody></table></div></section>
    <section class="card pad stack"><h2>Who does what</h2><ul>
      <li><b>Platform:</b> event page, booking with payment, waitlist, reveal and follow-up emails. Mostly the session system with a venue and a charge.</li>
      <li><b>Cortex:</b> seating proposal from each founder's question, stage and open challenges. Reliability from session attendance.</li>
      <li><b>Ops:</b> one standing restaurant per city, approve tables once a month.</li>
      <li><b>Advisors (optional, later):</b> a hosted “dinner with an expert” as a premium format, if members ask for it.</li>
      <li><b>City host (later):</b> a founder member who owns the restaurant relationship in a new city.</li></ul></section>
    <section class="card pad stack"><h2>Pilot</h2><ol>
      <li><b>November, Seattle.</b> One dinner night, 12 seats, two tables. Seating by hand from Cortex. Booking through a payment link. Someone from VEN can sit in to watch, not to run it.</li>
      <li><b>Measure:</b> booked vs. showed up, mutual picks, intros that led to a second conversation, would-you-come-again.</li>
      <li><b>December–January:</b> if 85%+ show up and members ask for more, build the event page, waitlist and emails into the platform.</li>
      <li><b>Spring:</b> a second city once 10 founders there say “I'd come”, with a city host.</li></ol></section>
    <section class="card pad stack"><h2>Decisions we need</h2><ul>
      <li>Paid set menu ($75), or everyone pays their own bill plus a refundable deposit?</li><li>Members only, or one seat per table for a prospect?</li>
      <li>Tables by stage first, or by role (CEO, CTO, CFO/COO) from the start?</li><li>Thursday dinner, or a breakfast format for founders with families?</li></ul></section></div>`;
}

/* ---------- render + events ---------- */
const PAGES={dashboard,profile,sessions,inperson,library,advisors,directory,benefits,account};
function render(){
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===S.v)));
  document.querySelectorAll("[data-s]").forEach(b=>b.setAttribute("aria-pressed",String(S.v==="member"&&S.t==="inperson"&&+b.dataset.s===S.s)));
  const portal=S.v==="member";
  $("#tabs").innerHTML=`<div class="wrap">${TABS.map(([k,l,n])=>`<button type="button" class="tab ${portal&&S.t===k?"on":""}" data-t="${k}">${l}${n?` <span class="new">New</span>`:""}</button>`).join("")}</div>`;
  $("#app").innerHTML = S.v==="ops"?ops():S.v==="concept"?concept():PAGES[S.t]();
}
function go(t){S.v="member";S.t=t;S.sess=null;render();scrollTo(0,0)}
document.addEventListener("input",e=>{if(e.target.id==="q")S.q=e.target.value;if(e.target.id==="diet")S.diet=e.target.value});
document.addEventListener("change",e=>{const p=e.target.dataset&&e.target.dataset.pick;if(p){e.target.checked?S.picked.add(p):S.picked.delete(p);render()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.v){S.v=d.v;render();scrollTo(0,0);return}
  if(d.t){go(d.t);return}
  if(d.s){S.v="member";S.t="inperson";S.s=+d.s;S.late=false;S.cancel=false;if(S.s>=2)S.booked=true;render();scrollTo(0,0);return}
  if(d.go){S.s=+d.go;render();scrollTo(0,0);return}
  if(d.sess){S.sess=d.sess;render();scrollTo(0,0);return}
  if("back" in d){S.sess=null;render();return}
  if(d.stab){S.stab=d.stab;render();return}
  if(d.lib){S.libf=d.lib;render();return}
  if(d.reg){const on=S.reg.has(d.reg);on?S.reg.delete(d.reg):S.reg.add(d.reg);render();toast(on?"Registration cancelled":"Registered. The Zoom link is in your email");return}
  if(d.toast){toast(d.toast);return}
  if("book" in d){S.booked=true;S.s=2;render();scrollTo(0,0);toast(`Paid $${EV.price}. Your seat is booked`);return}
  if("cancel" in d){S.cancel=true;render();return}
  if("cancelNo" in d){S.cancel=false;render();return}
  if("cancelYes" in d){S.cancel=false;S.booked=false;S.s=0;render();toast(`Cancelled. $${EV.price} refunded`);return}
  if("confirm" in d){S.seated=true;S.late=false;render();toast("Confirmed. See you Thursday");return}
  if("late" in d){S.late=true;render();return}
  if("lateNo" in d){S.late=false;render();return}
  if("lateYes" in d){S.late=false;S.booked=false;S.s=0;render();toast("Seat released to the waitlist");return}
  if("prompt" in d){S.pi=(S.pi+1)%PROMPTS.length;render();return}
  if("send" in d){toast(S.picked.size?"Sent. We'll intro you when it's mutual":"Pick at least one person");return}
  if("seat" in d){S.prop=true;render();return}
});
render();
</script>
</body>
</html>
