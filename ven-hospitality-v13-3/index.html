e><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-role-ceo v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"h-role-arrival c-role-arrival\"><div class=\"v-wrap\"><div class=\"h-role-arrival-copy c-role-intro\"><p class=\"v-eyebrow\">Founders &amp; CEOs · For venture-backed leaders</p><h1>The board sees the milestone. You see the trade-offs.</h1><p class=\"v-lead\">Capital, people and delivery compete for attention. Compare how other CEOs have made these choices.</p><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=ceo\">Can we help? <span aria-hidden=\"true\">↗</span></a></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p><p class=\"v-note\"><a href=\"membership.html#privacy\">Participation and recording access →</a></p></div><figure class=\"c-banner-photo\"><img src=\"[[VEN_ASSET:ven-hero-peers-d6cd5f633aed0dce.webp]]\" alt=\"Leaders in conversation around a table\" width=\"2240\" height=\"960\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"c-role-recognition\"><div class=\"h-recognition-copy\"><p class=\"v-eyebrow\">On your desk</p><h2>Questions you may be weighing.</h2><ul class=\"v-questions\"><li>Which commitments matter most to the next milestone?</li><li>Where would clearer ownership remove a constraint?</li><li>What should we stop if the growth plan changes?</li></ul></div></div></div></section><section class=\"v-section v-section--mist c-role-example\" id=\"role-example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · Founders &amp; CEOs</p><h2>More growth. The same runway.</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>The milestone needs growth, but capital and leadership time are finite. Not every commitment can move at once.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>A CEO who has sequenced similar trade-offs. Test what your capital and team can carry.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Decide which commitment to protect, postpone or stop.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:a2ebf63be3c5cd69913e.webp]]\" alt=\"Court Lorenzini\" width=\"2000\" height=\"1334\" class=\"\" loading=\"lazy\" style=\"object-position:45% 28%\"></figure><div><p class=\"v-eyebrow\">From our operational advisors</p><h3>Court Lorenzini</h3><p>Founding CEO, DocuSign</p><p class=\"c-role-proof-context\">Experience: company building and leadership trade-offs.</p><a class=\"v-text-link\" href=\"experts.html#court\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What needs to move before the next milestone?</h2><p>Share the company commitment you’re weighing. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=ceo\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Founders & CEOs | Venture Executive Network"},"clean/role-sales.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Sales &amp; revenue | Venture Executive Network</title><meta name=\"description\" content=\"Deals are taking longer to close. Compare where sales leaders found delays before adding headcount. For leaders at companies with at least $1M in venture funding.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-role-sales v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"h-role-arrival c-role-arrival\"><div class=\"v-wrap\"><div class=\"h-role-arrival-copy c-role-intro\"><p class=\"v-eyebrow\">Sales &amp; revenue · For venture-backed leaders</p><h1>Build revenue the company can plan around.</h1><p class=\"v-lead\">Deals are taking longer to close. Compare where sales leaders found delays before adding headcount.</p><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=sales\">Can we help? <span aria-hidden=\"true\">↗</span></a></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p><p class=\"v-note\"><a href=\"membership.html#privacy\">Participation and recording access →</a></p></div><figure class=\"c-banner-photo\"><img src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"c-role-recognition\"><div class=\"h-recognition-copy\"><p class=\"v-eyebrow\">On your desk</p><h2>Questions you may be weighing.</h2><ul class=\"v-questions\"><li>Add sellers, or improve conversion first?</li><li>Which forecast assumptions need stronger deal evidence?</li><li>Is the enterprise deal worth the delivery commitment?</li></ul></div></div></div></section><section class=\"v-section v-section--mist c-role-example\" id=\"role-example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · Sales &amp; revenue</p><h2>Before you add another seller.</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>The pipeline grows, but deals lose momentum. More sellers could add cost before you find the constraint.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>A sales leader who has worked through similar deal delays. Compare qualification, stages and handoffs.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Decide whether to fix the process, firm up buyer commitments or add capacity before the next hire.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:a3b0e72d4f30c8164865.webp]]\" alt=\"Collin Stewart\" width=\"1200\" height=\"1200\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\"></figure><div><p class=\"v-eyebrow\">From our operational advisors</p><h3>Collin Stewart</h3><p>Founder &amp; CEO, Predictable Revenue</p><p class=\"c-role-proof-context\">Experience: sales process and team development.</p><a class=\"v-text-link\" href=\"experts.html#collin\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Where is revenue getting stuck?</h2><p>Share where deals or revenue are getting stuck. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=sales\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Sales & revenue | Venture Executive Network"},"clean/role-marketing.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Marketing | Venture Executive Network</title><meta n </p><a class=\"v-text-link\" href=\"experts.html#collin\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What needs to change in your growth approach?</h2><p>Share the channel or campaign you’re reassessing. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=marketing\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":" ton v-button--primary\" href=\"apply.html?intent=individual&amp;role=finance\">Can we help? <span aria-hidden=\"true\">↗</span></a></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p><p class=\"v-note\"><a href=\"membership.html#privacy\">Participation and recording access →</a></p></div><figure class=\"c-banner-photo\"><img src=\"[[VEN_ASSET:ven-partner-one-to-one-4f4f666f1a58bc4a.webp]]\" alt=\"A Partner and a leader in conversation by a window\" width=\"1536\" height=\"1024\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"c-role-recognition\"><div class=\"h-recognition-copy\"><p class=\"v-eyebrow\">On your desk</p><h2>Questions you may be weighing.</h2><ul class=\"v-questions\"><li>Which spending protects the next milestone?</li><li>Where can we extend runway without stalling delivery?</li><li>What return would justify the next AI investment?</li></ul></div></div></div></section><section class=\"v-section v-section--mist c-role-example\" id=\"role-example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · Finance</p><h2>Before the hiring plan becomes a cash commitment.</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>The hiring plan assumes growth that hasn’t arrived. The next spending call affects runway and delivery.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>A finance leader to pressure-test your hiring and revenue scenarios. Find the assumptions that move cash and delivery.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Explain what to fund, defer or cut, and how that affects runway and delivery.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:74818710371e103b7e10.webp]]\" alt=\" "v-eyebrow\">Product &amp; technology · For venture-backed leaders</p><h1>Balance customer commitments with a reliable product.</h1><p class=\"v-lead\">Compare roadmap priorities, reliability and delivery costs with experienced product and engineering leaders.</p><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=product\">Can we help? <span aria-hidden=\"true\">↗</span></a></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p><p class=\"v-note\"><a href=\"membership.html#privacy\">Participation and recording access →</a></p></div><figure class=\"c-banner-photo\"><img src=\"[[VEN_ASSET:ven-partner-one-to-one-4f4f666f1a58bc4a.webp]]\" alt=\"A Partner and a leader in conversation by a window\" width=\"1536\" height=\"1024\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"c-role-recognition\"><div class=\"h-recognition-copy\"><p class=\"v-eyebrow\">On your desk</p><h2>Questions you may be weighing.</h2><ul class=\"v-questions\"><li>Ship the customer feature, or protect reliability first?</li><li>Which requests belong on the roadmap?</li><li>AI usage is rising. How do we keep inference costs within budget?</li></ul></div></div></div></section><section class=\"v-section v-section--mist c-role-example\" id=\"role-example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · Product &amp; technology</p><h2>A customer commitment changes more than the roadmap.</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>A major customer wants a feature. Weigh effort, reliability and what it displaces before you promise anything.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>A product or engineering leader who has made a similar trade-off. Test the commitment before you make it.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Choose the option and take a clear rationale back to the customer and your team.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:29e29213c277b5ec7c8f.webp]]\" alt=\"Jordan Tigani\" width=\"760\" height=\"760\" class=\"\" loading=\"lazy\" style=\"object-position:50% 0%\"></figure><div><p class=\"v-eyebrow\">From our operational advisors</p><h3>Jordan Tigani</h3><p>Founder &amp; CEO, MotherDuck</p><p class=\"c-role-proof-context\">Experience: product, data and technical decisions.</p><a class=\"v-text-link\" href=\"experts.html#jordan\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What decision is shaping your roadmap?</h2><p>Share the delivery commitment or technical risk you’re weighing. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=product\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html \"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"h-role-arrival c-role-arrival\"><div class=\"v-wrap\"><div class=\"h-role-arrival-copy c-role-intro\"><p class=\"v-eyebrow\">Operations · For venture-backed leaders</p><h1>Keep delivery reliable across a growing company.</h1><p class=\"v-lead\">Work through capacity, ownership and delivery constraints with experienced operators.</p><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=operations\">Can we help? <span aria-hidden=\"true\">↗</span></a></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p><p class=\"v-note\"><a href=\"membership.html#privacy\">Participation and recording access →</a></p></div><figure class=\"c-banner-photo\"><img src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"c-role-recognition\"><div class=\"h-recognition-copy\"><p class=\"v-eyebrow\">On your desk</p><h2>Questions you may be weighing.</h2><ul class=\"v-questions\"><li>Is the bottleneck capacity, ownership or a handoff?</li><li>Change the tools, or improve the process first?</li><li>Which approvals can team leads own so delivery stops waiting?</li></ul></div></div></div></section><section class=\"v-section v-section--mist c-role-example\" id=\"role-example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · Operations</p><h2>More enterprise volume. Can delivery keep up?</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>Enterprise demand rises while delivery misses targets, and teams compete for capacity. Test capacity, margin and ownership before hiring.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>An operations leader who has managed growing demand. Compare staffing, process and service-level trade-offs.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Agree who owns delivery, what service level the team can support and when to hire.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:db19d278a020cf2b6ef2.webp]]\" alt=\"Karl Siebrecht\" width=\"300\" height=\"450\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\"></figure><div><p class=\"v-eyebrow\">From our operational advisors</p><h3>Karl Siebrecht</h3><p>Co-founder &amp; CEO, Flexe</p><p class=\"c-role-proof-context\">Experience: logistics and operating scale.</p><a class=\"v-text-link\" href=\"experts.html#karl\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Where does progress slow down?</h2><p>Share where delivery is slowing down. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=operations\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture E example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · People leadership</p><h2>A leadership hire starts with the work.</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>Growth puts more work on the leadership team. Identify which capability is missing before opening a search.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>A leader who has made executive hires. Separate a capability gap from an overloaded role.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Define the role’s ownership and expectations before the search opens. Give the hiring team a clear brief.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:0b0ad82428bc25a04cce.webp]]\" alt=\"Thach “Tak” Nguyen\" width=\"1000\" height=\"1001\" class=\"\" loading=\"lazy\" style=\"object-position:50% 5%\"></figure><div><p class=\"v-eyebrow\">From our operational advisors</p><h3>Thach “Tak” Nguyen</h3><p>Founder &amp; Managing Partner, Plenty Search</p><p class=\"c-role-proof-context\">Experience: executive hiring and leadership capability.</p><a class=\"v-text-link\" href=\"experts.html#tak\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Which leadership gap needs attention?</h2><p>Share the hiring or retention question in front of you. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=people\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"People leadership | Venture Executive Network"},"clean/role-other.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Another leadership role | Venture Executive Network</title><meta name=\"description\" content=\"Bring the work you own, whatever the title. Your VEN Partner helps arrange connections with people who have relevant experience. For leaders at companies with at least $1M in venture funding.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-role-other v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"h-role-arrival c-role-arrival\"><div class=\"v-wrap\"><div class=\"h-role-arrival-copy c-role-intro\"><p class=\"v-eyebrow\">Another leadership role · For venture-backed leaders</p><h1>Bring outside experience to work across teams.</h1><p class=\"v-lead\">Bring the work you own, whatever the title. Your VEN Partner helps arrange connections with people who have relevant experience.</p><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=other\">Can we help? <span aria-hidden=\"true\">↗</span></a></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p><p class=\"v-note\"><a href=\"membership.html#privacy\">Participation and recording access →</a></p></div><figure class=\"c-banner-photo\"><img src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"c-role-recognition\"><div class=\"h-recognition-copy\"><p class=\"v-eyebrow\">On your desk</p><h2>Questions you may be weighing.</h2><ul class=\"v-questions\"><li>How much custom work can we promise this customer?</li><li>Which team needs to act before we can deliver?</li><li>Do we need outside expertise or a different handoff?</li></ul></div></div></div></section><section class=\"v-section v-section--mist c-role-example\" id=\"role-example\"><div class=\"v-wrap\"><div class=\"h-case-head\"><p class=\"v-eyebrow\">Illustrative scenario · Another leadership role</p><h2>Your title is not the whole job.</h2></div><div class=\"v-decision-path c-support-example\"><div><p class=\"v-eyebrow\">What’s at stake</p><p>A customer commitment spans several teams. You own part of the call; cost and capacity sit elsewhere.</p></div><div><p class=\"v-eyebrow\">Relevant experience</p><p>An operator who has made a similar customer commitment. Map cost, ownership and dependencies across teams.</p></div><div><p class=\"v-eyebrow\">What to take back</p><p>Agree what the company can promise, who owns it and what delivery takes, before committing.</p></div></div><p class=\"v-note c-role-judgment\">The decision stays yours.</p><div class=\"c-role-proof\"><figure><img src=\"[[VEN_ASSET:6ffd1392203412712e2a.webp]]\" alt=\"Rich Barton\" width=\"671\" height=\"680\" class=\"\" loading=\"lazy\" style=\"object-position:50% 10%\"></figure><div><p class=\"v-eyebrow\">Part of our wider network of operational advisors</p><h3>Rich Barton</h3><p>Co-founder, Zillow &amp; Glassdoor · Founder, Expedia</p><p class=\"c-role-proof-context\">Experience: coordinating company priorities and growth.</p><a class=\"v-text-link\" href=\"experts.html#rich\">Meet the advisors <span aria-hidden=\"true\">→</span></a></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What does your role need right now?</h2><p>Share one challenge from your current work. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=other\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Another leadership role | Venture Executive Network"},"clean/case-study.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Before the next sales hire · Decision example | Venture Executive Network</title><meta name=\"description\" content=\"Explore how a VEN Partner could help a sales leader draw on relevant operating experience before a hiring decision.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-case-study v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"h-case-arrival\"><div class=\"v-wrap\"><a class=\"v-text-link h-case-back\" href=\"membership.html\">How it works <span aria-hidden=\"true\">←</span></a><div class=\"h-case-arrival-grid\"><div><p class=\"h-case-label\">Example scenario</p><h1>Before the next<br>sales hire.</h1><p class=\"v-lead\">Enterprise deals stall after the demo. Is the fix another seller, or something else?</p><p class=\"h-case-context\">Example context: a Series A B2B company moving into enterprise sales.</p></div><figure class=\"v12-case-arrival-image\"><img src=\"[[VEN_ASSET:ven-still-life-notebook-bcf666e15c171b75.webp]]\" alt=\"A notebook and coffee on a walnut table after a working conversation\" width=\"1536\" height=\"1024\" loading=\"lazy\"></figure></div></div></section><section class=\"v-section v-section--white\" id=\"the-decision\"><div class=\"v-wrap\"><ol class=\"h-case-sequence\"><li><span class=\"h-step-number\" aria-hidden=\"true\">01</span><h2>The challenge</h2><p>Enterprise growth on the current runway. The sales leader is weighing a hire without knowing why buyers stop after the demo.</p></li>\n        <li><span class=\"h-step-number\" aria-hidden=\"true\">02</span><h2>The input</h2><p>A focused 1:1 with an experienced sales leader surfaces the gap: no one owns the buyer’s security review. The member’s VEN Partner helps arrange the conversation.</p></li>\n        <li><span class=\"h-step-number\" aria-hidden=\"true\">03</span><h2>The leader’s decision</h2><p>The leader tests a shared buyer plan and names an owner for technical review. Hiring stays an option once capacity is clearer.</p></li>\n        <li><span class=\"h-step-number\" aria-hidden=\"true\">04</span><h2>The follow-through</h2><p>The VEN Partner follows up as needs change. The leader takes the new context into the next hiring and budget discussion.</p></li></ol></div></section><section class=\"v-section v-section--mist\" id=\"company-value\"><div class=\"v-wrap\"><div class=\"h-case-carry\"><div><p class=\"v-eyebrow\">The individual decision serves the company</p><h2>How this decision could affect the team.</h2></div><div><p>Sales and product could agree who owns security review. Finance could re-check the hiring budget against that gap.</p><p class=\"h-personal-last\">The hiring and budget conversations that follow start from where the deals stalled.</p><a class=\"v-text-link\" href=\"team.html#connected-decisions\">See how individual decisions connect <span aria-hidden=\"true\">→</span></a></div></div></div></section><div class=\"h-case-boundary v-wrap\"></div><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What decision are you working through?</h2><p>Bring your role and the decision in front of you. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=sales\">Can we help? <span aria-hidden=\"true\">↗</span></a><a class=\"v-text-link\" href=\"role-sales.html\">Sales &amp; revenue support <span aria-hidden=\"true\">→</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Before the next sales hire · Decision example | Venture Executive Network"},"clean/experts.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><titl t/\">Professional background <span aria-hidden=\"true\">→</span></a></div></article><article class=\"c-expert\" id=\"tak\"><figure><img src=\"[[VEN_ASSET:0b0ad82428bc25a04cce.webp]]\" alt=\"Thach “Tak” Nguyen\" width=\"1000\" height=\"1001\" class=\"\" loading=\"lazy\" style=\"object-position:50% 5%\"></figure><div><p class=\"c-person-topic\">Executive hiring and leadership capability</p><h2>Thach “Tak” Nguyen</h2><p class=\"c-person-title\">Founder &amp; Managing Partner, Plenty Search</p><a class=\"v-text-link\" href=\"https://plentysearch.com/about\">Professional background <span aria-hidden=\"true\">→</span></a></div></article><article class=\"c-expert\" id=\"karl\"><figure><img src=\"[[VEN_ASSET:db19d278a020cf2b6ef2.webp]]\" alt=\"Karl Siebrecht\" width=\"300\" height=\"450\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\"></figure><div><p class=\"c-person-topic\">Logistics and operating scale</p><h2>Karl Siebrecht</h2><p class=\"c-person-title\">Co-founder &amp; CEO, Flexe</p><a class=\"v-text-link\" href=\"https://flexe.com/company/about/\">Professional background <span aria-hidden=\"true\">→</span></a></div></article><article class=\"c-expert\" id=\"adine\"><figure><img src=\"[[VEN_ASSET:ab20b83c2ed6bf16511f.webp]]\" alt=\"Adine Mitrani\" width=\"400\" height=\"420\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\"></figure><div><p class=\"c-person-topic\">Technology transactions and intellectual property</p><h2>Adine Mitrani</h2><p class=\"c-person-title\">Associate, Fenwick</p><a class=\"v-text-link\" href=\"https://www.fenwick.com/people/adine-mitrani\">Professional background <span aria-hidden=\"true\">→</span></a></div></article><article class=\"c-expert\" id=\"rich\"><figure><img src=\"[[VEN_ASSET:6ffd1392203412712e2a.webp]]\" alt=\"Rich Barton\" width=\"671\" height=\"680\" class=\"\" loading=\"lazy\" style=\"object-position:50% 10%\"></figure><div><p class=\"c-person-topic\">Company building and scale</p><h2>Rich Barton</h2 ss]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"photo-preview.css\">[[VEN_STYLE:photo-preview.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v11 v12 v-page-member-experience c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"v-page-head\"><div class=\"v-wrap\"><div class=\"v-page-head-copy\"><p class=\"v-eyebrow\">FounderNexus member experience</p><h1>What members<br>bring back.</h1><p class=\"v-lead\">FounderNexus members, in their own words. VEN is built on FounderNexus for venture-backed leadership teams.</p></div></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><article class=\"c-member-story\" id=\"gayathri\"><div><p class=\"v-eyebrow\">Gayathri Venkataraman · FounderNexus member</p><h2>Clarity before a course correction.</h2><p>Gayathri describes testing her thinking with other people before deciding whether to continue or adjust.</p><details class=\"c-transcript\"><summary>Read the transcript</summary><p>There were so many times that I have actually doubted what I have been doing. Whether you are going to continue that path or you're going to course correct and take a different path, you need to have certain clarity on why this is working, why this is not working. Create a framework of whatever you typically would make your decision and like run it by people. And then you will get that clarity, okay, you know what? Maybe I'm jumping into this conclusion too early or maybe I have been sitting on it for too late. Doesn't matter, but at least you can actually talk with people and get that thing resolved as soon as possible.</p></details></div><figure><video class=\"c-member-video\" controls playsinline preload=\"none\" poster=\"[[VEN_ASSET:b79d4bed15e25fbafd03.jpg]]\" aria-label=\"Member experience: Gayathri Venkataraman\"><source src=\"[[VEN_ASSET:bfb09463781b99c9e23a.mp4]]\" type=\"video/mp4\"><track kind=\"captions\" src=\"[[VEN_ASSET:c2ca6b10c178573363bc.vtt]]\" srclang=\"en\" label=\"English\" default><p>Your browser cannot play this video.</p></video></figure></article><article class=\"c-member-story\" id=\"ken\"><div><p class=\"v-eyebrow\">Ken Aragon · FounderNexus member</p><h2>Reconsidering the order of priorities.</h2><p>Ken describes how conversations helped him put product-market fit ahead of fundraising in his own plan.</p><details class=\"c-transcript\"><summary>Read the transcript</summary><p>But as a prior to joining FounderNexus, I had this idea in my mind that you have to go raise money first and then you go build your product. And that's not the way it should be. Through the conversations I had with Court and the other members of FounderNexus, it became really clear to me that my priorities as a founder needed to be in finding product market fit. First.</p></details></div><figure><video class=\"c-member-video\" controls playsinline preload=\"none\" poster=\"[[VEN_ASSET:672f93e5976a5cc2ae15.jpg]]\" aria-label=\"Member experience: Ken Aragon\"><source src=\"[[VEN_ASSET:5db783474a8a8671b3dd.mp4]]\" type=\"video/mp4\"><track kind=\"captions\" src=\"[[VEN_ASSET:6dc3529e3f4c7316bde8.vtt]]\" srclang=\"en\" label=\"English\" default><p>Your browser cannot play this video.</p></video></figure></article></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What decision are you weighing?</h2><p>Share what you need a second perspective on. No commitment. Eligible applications receive a personal reply within
