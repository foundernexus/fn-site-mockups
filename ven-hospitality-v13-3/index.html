N_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-challenges v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Where to start\u003c/p>\u003ch1>What are your top two challenges this month?\u003c/h1>\u003cp class=\"v-lead\">Pick the example closest to yours. In VEN, you set the agenda.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--blue v-working-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-role-explorer\" data-role-explorer>\u003cdiv class=\"v-role-explorer-head\">\u003cdiv>\u003cp class=\"v-eyebrow\">By role\u003c/p>\u003ch2>Familiar calls, worked through.\u003c/h2>\u003cp>How a Partner and peers work through a few familiar decisions.\u003c/p>\u003c/div>\u003cdiv class=\"v-role-select\">\u003clabel for=\"role-example-select\">See a role example\u003c/label>\u003cselect disabled id=\"role-example-select\" aria-controls=\"role-example\">\u003coption value=\"ceo\">Founders &amp; CEOs\u003c/option>\u003coption value=\"sales\">Sales &amp; revenue\u003c/option>\u003coption value=\"marketing\" selected>Marketing\u003c/option>\u003coption value=\"finance\">Finance\u003c/option>\u003coption value=\"product\">Product &amp; technology\u003c/option>\u003coption value=\"operations\">Operations\u003c/option>\u003coption value=\"people\">People leadership\u003c/option>\u003coption value=\"other\">Another leadership role\u003c/option>\u003c/select>\u003cnoscript>\u003cp class=\"v-note\">Interactive examples need JavaScript. All roles are available on the By role page.\u003c/p>\u003c/noscript>\u003cp class=\"v-note\">Your responsibilities can span more than one role.\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"role-example\" class=\"v-role-example\">\u003cdiv class=\"v-example-challenge\">\u003cp class=\"v-note\">Example · Marketing\u003c/p>\u003ch3 data-role-challenge>Does the promising channel deserve more budget?\u003c/h3>\u003c/div>\u003cdiv class=\"v-example-perspective\">\u003ch4>Experience your Partner seeks\u003c/h4>\u003cp data-role-perspective>Marketing operators who have judged channel traction against qualified pipeline.\u003c/p>\u003c/div>\u003cdiv class=\"v-example-action\">\u003ch4>Your possible next step\u003c/h4>\u003cp data-role-next>Agree what pipeline evidence and handoff checks would support more spend.\u003c/p>\u003c/div>\u003cp class=\"v-note\">You own the decision.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-text-link v-role-detail-link\" href=\"role-marketing.html\">See the Marketing page \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cp class=\"v-screen-reader\" role=\"status\" aria-live=\"polite\" data-role-status>\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>You can start with your role.\u003c/h2>\u003cp>Share your role and one decision. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/  page lists access and registration.\u003c/p>\u003c/div>\u003cfigure class=\"v-page-head-image\">\u003cimg class=\"ven-photo--daylight-session\" src=\"[[VEN_ASSET:159e854e8133a261e586.jpg]]\" alt=\"Participants in a FounderNexus speaker session\" width=\"1800\" height=\"1352\" fetchpriority=\"high\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white v-activity-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Coming up · October 2026\u003c/p>\u003ch2>Upcoming sessions.\u003c/h2>\u003cp class=\"v-lead\">All times Pacific Daylight Time (PDT).\u003c/p>\u003c/div>\u003cdiv class=\"v-filters\" role=\"group\" aria-label=\"Filter sessions\">\u003cbutton type=\"button\" disabled data-topic-filter=\"all\" aria-pressed=\"true\" aria-controls=\"event-list\">All sessions\u003c/button>\u003cbutton type=\"button\" disabled data-topic-filter=\"growth\" aria-pressed=\"false\" aria-controls=\"event-list\">Growth &amp; sales\u003c/button>\u003cbutton type=\"button\" disabled data-topic-filter=\"deals\" aria-pressed=\"false\" aria-controls=\"event-list\">Company decisions\u003c/button>\u003cbutton type=\"button\" disabled data-topic-filter=\"ai\" aria-pressed=\"false\" aria-controls=\"event-list\">Product &amp; AI\u003c/button>\u003c/div>\u003cdiv id=\"event-list\" class=\"v-event-list\">\u003carticle class=\"v-event\" data-topic=\"growth\">\u003cdiv class=\"v-event-date\">\u003cstrong>\u003ctime datetime=\"2026-10-08\">October 08\u003c/time>\u003c/strong>\u003cp>1–2 PM PDT\u003c/p>\u003c/div>\u003cdiv class=\"v-event-copy\">\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/event/turning-conferences-into-customers-founder-led-selling-before-during-and-after-the-show\">Turning Conferences into Customers: Founder-Led Selling Before, During and After the Show. \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>Plan which events to attend, how to arrange meetings and how to turn follow-up into useful customer conversations.\u003c/p>\u003c/div>\u003cdiv class=\"v-event-meta\">\u003cp>Josh Lillie\u003c/p>\u003cp>Members and invited guests\u003c/p>\u003cp>Live on Zoom\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/event/turning-conferences-into-customers-founder-led-selling-before-during-and-after-the-show\">Session details \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-event\" data-topic=\"growth\">\u003cdiv class=\"v-event-date\">\u003cstrong>\u003ctime datetime=\"2026-10-13\">October 13\u003c/time>\u003c/strong>\u003cp>10:30–11:30 AM PDT\u003c/p>\u003c/div>\u003cdiv class=\"v-event-copy\">\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/event/peer-roundtable-customer-acquisition-today\">Peer Roundtable: Customer Acquisition Today \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>Compare channels, pipeline and early-customer experience with founders working through acquisition after raising.\u003c/p>\u003c/div>\u003cdiv class=\"v-event-meta\">\u003cp>Peer roundtable\u003c/p>\u003cp>Members only\u003c/p>\u003cp>Live on Zoom\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/event/peer-roundtable-customer-acquisition-today\">Session details \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-event\" data-topic=\"deals\">\u003cdiv class=\"v-event-date\">\u003cstrong>\u003ctime datetime=\"2026-10-13\">October 13\u003c/time>\u003c/strong>\u003cp>12–1 PM PDT\u003c/p>\u003c/div>\u003cdiv class=\"v-event-copy\">\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/event/sell-merge-or-partner-weighing-your-deal-options-with-an-m-a-attorney\">Sell, Merge or Partner? Weighing Your Deal Options with an M&amp;A Attorney \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>Compare deal structures, preparation and the commitments that can affect control and the work after a transaction.\u003c/p>\u003c/div>\u003cdiv class=\"v-event-meta\">\u003cp>Zach Haveman\u003c/p>\u003cp>Members only\u003c/p>\u003cp>Live on Zoom\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/event/sell-merge-or-partner-weighing-your-deal-options-with-an-m-a-attorney\">Session details \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-event\" data-topic=\"ai\">\u003cdiv class=\"v-event-date\">\u003cstrong>\u003ctime datetime=\"2026-10-21\">October 21\u003c/time>\u003c/strong>\u003cp>12–1 PM PDT\u003c/p>\u003c/div>\u003cdiv class=\"v-event-copy\">\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/event/why-isn-t-ai-making-your-engineering-process-10x-faster\">Why Isn’t AI Making Your Engineering Process 10x Faster? \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>Examine the bottlenecks beyond coding and what an end-to-end AI-assisted development process could change.\u003c/p>\u003c/div>\u003cdiv class=\"v-event-meta\">\u003cp>Prakash Sundaresan\u003c/p>\u003cp>Members and invited guests\u003c/p>\u003cp>Live on Zoom\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/event/why-isn-t-ai-making-your-engineering-process-10x-faster\">Session details \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c/div>\u003cp id=\"event-filter-status\" class=\"v-note\" role=\"status\">4 sessions shown.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Between sessions, your Partner keeps working.\u003c/h2>\u003cp>Work on your top two challenges carries on after the session ends. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Events and working sessions | Venture Executive Network"},"clean/blog.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=
