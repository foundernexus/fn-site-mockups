<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e9"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Venture Executive Network"><title>Venture Executive Network</title></head><body><script type="application/json" id="ven-bundle">{"revision":"Venture Executive Network v15.3","pages":{"clean/index.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Execute at venture speed and scale | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"A global operational community for venture-backed leadership teams: small rooms matched to your stage, peers and operational advisors, and a dedicated person on your top two challenges.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality mai-study mai-home\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\" class=\"study-root\">\n\u003csection class=\"study-hero\" data-theme=\"sand\" data-bg-fade=\"ivory\" aria-labelledby=\"hero-title\">\n \u003cfigure class=\"s-hero-media\" aria-hidden=\"true\">\u003cimg src=\"[[VEN_ASSET:ven-hero-lounge-4d1b87e28f66e627.webp]]\" alt=\"\" width=\"1536\" height=\"864\" fetchpriority=\"high\">\u003c/figure>\n \u003cdiv class=\"study-hero-copy\">\n  \u003cp class=\"study-label\" data-reveal>A global operational community for venture-backed leadership teams\u003c/p>\n  \u003ch1 id=\"hero-title\" data-reveal>Venture money raises the bar. Every week.\u003c/h1>\n  \u003cp class=\"study-hero-lead\" data-reveal>Execute at venture speed and scale with peers and operational advisors who’ve faced similar calls.\u003c/p>\n  \u003cdiv class=\"study-hero-actions\" data-reveal>\u003ca class=\"study-cta\" href=\"apply.html?intent=individual\">\u003cspan>Can we help?\u003c/span>\u003cspan class=\"study-cta-arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"study-link\" href=\"membership.html\">How it works \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\n  \u003cp class=\"study-hero-fit\" data-reveal>$1M+ in venture funding · Worldwide · Confidential\u003c/p>\n \u003c/div>\n \u003ca class=\"study-scroll\" href=\"#roles\" aria-label=\"Continue to the decisions by role\">\u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/a>\n\u003c/section>\n\n\u003cdiv class=\"study-nav-wrap\">\u003cnav class=\"study-section-nav\" aria-label=\"Page sections\">\u003ca href=\"#roles\" aria-current=\"true\">Roles\u003c/a>\u003ca href=\"#support\">Support\u003c/a>\u003ca href=\"#example\">Example\u003c/a>\u003ca href=\"#membership\">Participation\u003c/a>\u003c/nav>\u003c/div>\n\n\u003csection class=\"study-section study-role-section\" id=\"roles\" data-theme=\"sage\" data-bg-fade=\"limestone\" aria-labelledby=\"roles-title\">\n \u003cdiv class=\"study-centered\">\n  \u003cp class=\"study-label\" data-reveal>By role\u003c/p>\n  \u003ch2 id=\"roles-title\" data-reveal>Which call is on\u003cbr> your desk this month?\u003c/h2>\n  \u003cp class=\"study-section-lead\" data-reveal>Functional leaders rarely have a peer group of their own. Pick your role to see the decisions VEN is built for.\u003c/p>\n \u003c/div>\n \u003cdiv class=\"study-role-grid\" data-reveal>\n  \u003ca href=\"role-ceo.html\">\u003cspan class=\"study-label\">Founders &amp; CEOs\u003c/span>\u003cspan class=\"study-role-question\">Which commitments matter most to the next milestone?\u003c/span>\u003cspan class=\"study-role-action\">See the decisions \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span>\u003c/a>\n  \u003ca href=\"role-finance.html\">\u003cspan class=\"study-label\">Finance\u003c/span>\u003cspan class=\"study-role-question\">Which spending protects the next milestone?\u003c/span>\u003cspan class=\"study-role-action\">See the decisions \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span>\u003c/a>\n  \u003ca href=\"role-product.html\">\u003cspan class=\"study-label\">Product &amp; technology\u003c/span>\u003cspan class=\"study-role-question\">Ship the customer feature, or protect reliability first?\u003c/span>\u003cspan class=\"study-role-action\">See the decisions \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span>\u003c/a>\n \u003c/div>\n \u003cdiv class=\"s-role-more\" data-reveal>\u003cspan class=\"study-label\">Also\u003c/span>\u003ca href=\"role-sales.html\">Sales &amp; revenue\u003c/a>\u003ca href=\"role-marketing.html\">Marketing\u003c/a>\u003ca href=\"role-operations.html\">Operations\u003c/a>\u003ca href=\"role-people.html\">People leadership\u003c/a>\u003ca href=\"role-other.html\">Another leadership role\u003c/a>\u003ca class=\"s-role-all\" href=\"roles.html\">All roles \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"study-section study-support\" id=\"support\" data-theme=\"sand\" data-bg-fade=\"sage\" aria-labelledby=\"support-title\">\n \u003cdiv class=\"study-centered\">\n  \u003cp class=\"study-label\" data-reveal>How VEN supports you\u003c/p>\n  \u003ch2 id=\"support-title\" data-reveal>A Partner beside you.\u003cbr> Peers around the table.\u003c/h2>\n  \u003cp class=\"study-section-lead\" data-reveal>Small rooms matched to your stage and topic, and one person keeping your challenges moving.\u003c/p>\n \u003c/div>\n \u003cfigure class=\"study-wide-photo\" data-reveal>\u003cimg src=\"[[VEN_ASSET:ven-peers-table-ivory-8359e856bd62a9d1.webp]]\" alt=\"Leaders in conversation around a walnut table\" width=\"1536\" height=\"864\" loading=\"lazy\">\u003c/figure>\n \u003cdiv class=\"s-pair\">\n  \u003cdiv class=\"s-pair-col\" id=\"ven-partner-support\" data-reveal>\n   \u003cp class=\"study-label\">Your VEN Partner\u003c/p>\n   \u003ch3>In your corner, on your work.\u003c/h3>\n   \u003cp>A dedicated person who helps you name your top two challenges each month, brings in the peers and operational advisors who’ve faced them, and follows up at your pace.\u003c/p>\n   \u003cp class=\"s-quiet\">Works alongside your board, coach or peer network.\u003c/p>\n   \u003ca class=\"study-link\" href=\"membership.html#ven-partner\">Meet a VEN Partner \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\n  \u003c/div>\n  \u003cdiv class=\"s-pair-col\" id=\"peer-learning\" data-reveal>\n   \u003cp class=\"study-label\">Your peers\u003c/p>\n   \u003ch3>Learn from what others have tried.\u003c/h3>\n   \u003cp>Leaders from other companies and industries share what worked, what didn’t and what they would change.\u003c/p>\n   \u003cp class=\"s-quiet\">Peer sessions are open to every member and always matched to your stage.\u003c/p>\n   \u003ca class=\"study-link\" href=\"membership.html#formats\">How sessions work \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\n  \u003c/div>\n \u003c/div>\n \u003cp class=\"study-foundation\" data-reveal>Built on FounderNexus. For you and your leadership team: each colleague applies on their own. \u003ca href=\"team.html\">For your team \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection class=\"study-split study-section\" id=\"example\" data-theme=\"rose\" data-bg-fade=\"blush\" aria-labelledby=\"example-title\">\n \u003cdiv class=\"study-split-copy\" data-reveal>\n  \u003cp class=\"study-label\">Illustrative scenario · Sales &amp; revenue\u003c/p>\n  \u003ch2 id=\"example-title\">Before the next sales hire.\u003c/h2>\n  \u003cp>Find where deals stall before you add headcount.\u003c/p>\n  \u003ca class=\"study-link s-split-link\" href=\"case-study.html\">Follow the decision \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\n \u003c/div>\n \u003cfigure class=\"study-decision-image\" data-reveal>\n  \u003cdiv class=\"study-note\" aria-label=\"Illustration of a decision note, not a member result\">\n   \u003cdiv class=\"study-note-top\">\u003cspan>The work in front of you\u003c/span>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/div>\n   \u003cp class=\"study-note-title\">More people,\u003cbr>or a different problem?\u003c/p>\n   \u003cdiv class=\"study-note-rule\">\u003c/div>\n   \u003cdiv class=\"study-note-row\">\u003cspan class=\"study-note-number\">01\u003c/span>\u003cdiv>\u003cp class=\"study-note-label\">The challenge\u003c/p>\u003cp>Enterprise deals stall after the demo.\u003c/p>\u003c/div>\u003c/div>\n   \u003cdiv class=\"study-note-row\">\u003cspan class=\"study-note-number\">02\u003c/span>\u003cdiv>\u003cp class=\"study-note-label\">Work it through\u003c/p>\u003cp>Find the gap in security review.\u003c/p>\u003c/div>\u003c/div>\n   \u003cdiv class=\"study-note-row\">\u003cspan class=\"study-note-number\">03\u003c/span>\u003cdiv>\u003cp class=\"study-note-label\">Your next step\u003c/p>\u003cp>Name an owner before adding headcount.\u003c/p>\u003c/div>\u003c/div>\n   \u003cdiv class=\"study-note-bottom\">\u003cspan>Illustrative scenario\u003c/span>\u003cspan aria-hidden=\"true\">VEN\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cfigcaption>An example of the work. The leader owns the decision.\u003c/figcaption>\n \u003c/figure>\n\u003c/section>\n\n\u003csection class=\"study-section s-proof\" id=\"experience\" data-theme=\"rose\" data-bg-fade=\"mist\" aria-labelledby=\"proof-title\">\n \u003cdiv class=\"study-centered\">\n  \u003cp class=\"study-label\" data-reveal>The community\u003c/p>\n  \u003ch2 id=\"proof-title\" data-reveal>People who’ve done the work.\u003c/h2>\n  \u003cp class=\"study-section-lead\" data-reveal>Operational advisors bring expertise in specific areas. They’re added to rooms by stage, topic and expertise.\u003c/p>\n \u003c/div>\n \u003cdiv class=\"s-proof-grid\">\n  \u003cdiv data-reveal>\n   \u003cdiv class=\"study-advisor-image\">\n    \u003ca href=\"experts.html#court\">\u003cimg src=\"[[VEN_ASSET:a2ebf63be3c5cd69913e.webp]]\" alt=\"Court Lorenzini\" width=\"2000\" height=\"1334\" loading=\"lazy\">\u003cspan>Court Lorenzini\u003csmall>Founding CEO, DocuSign\u003c/small>\u003c/span>\u003c/a>\n    \u003ca href=\"experts.html#jordan\">\u003cimg src=\"[[VEN_ASSET:29e29213c277b5ec7c8f.webp]]\" alt=\"Jordan Tigani\" width=\"760\" height=\"760\" loading=\"lazy\">\u003cspan>Jordan Tigani\u003csmall>Founder &amp; CEO, MotherDuck\u003c/small>\u003c/span>\u003c/a>\n    \u003ca href=\"experts.html#shareen\">\u003cimg src=\"[[VEN_ASSET:74818710371e103b7e10.webp]]\" alt=\"Shareen Corlett\" width=\"402\" height=\"399\" loading=\"lazy\">\u003cspan>Shareen Corlett\u003csmall>CPA · Principal, Clark Nuber\u003c/small>\u003c/span>\u003c/a>\n    \u003ca href=\"experts.html#tak\">\u003cimg src=\"[[VEN_ASSET:0b0ad82428bc25a04cce.webp]]\" alt=\"Thach “Tak” Nguyen\" width=\"800\" height=\"800\" loading=\"lazy\">\u003cspan>Thach “Tak” Nguyen\u003csmall>Founder, Plenty Search\u003c/small>\u003c/span>\u003c/a>\n   \u003c/div>\n   \u003ca class=\"study-link s-under\" href=\"experts.html\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\n  \u003c/div>\n  \u003cdiv data-reveal>\n   \u003cfigure class=\"study-video\">\u003cvideo controls playsinline preload=\"none\" poster=\"[[VEN_ASSET:b79d4bed15e25fbafd03.jpg]]\" aria-label=\"Member experience: Gayathri Venkataraman\">\u003csource src=\"[[VEN_ASSET:bfb09463781b99c9e23a.mp4]]\" type=\"video/mp4\">\u003ctrack kind=\"captions\" src=\"[[VEN_ASSET:c2ca6b10c178573363bc.vtt]]\" srclang=\"en\" label=\"English\" default>\u003cp>Your browser cannot play this video.\u003c/p>\u003c/video>\n   \u003cfigcaption>Gayathri Venkataraman, FounderNexus member, on deciding when to stay the course and when to adjust.\u003c/figcaption>\u003c/figure>\n   \u003ca class=\"study-link s-under\" href=\"member-experience.html\">Hear from FounderNexus members \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\n  \u003c/div>\n \u003c/div>\n \n\u003c/section>\n\n\u003csection class=\"study-section study-membership\" id=\"membership\" data-theme=\"sand\" data-bg-fade=\"limestone\" aria-labelledby=\"membership-title\">\n \u003cdiv class=\"study-centered\">\n  \u003cp class=\"study-label\" data-reveal>Participation\u003c/p>\n  \u003ch2 id=\"membership-title\" data-reveal>A few hours a month.\u003c/h2>\n  \u003cp class=\"study-section-lead\" data-reveal>For leadership teams at venture-backed companies that have raised at least $1M in venture funding. Worldwide.\u003c/p>\n \u003c/div>\n \u003cdl class=\"study-facts\" data-reveal>\u003cdiv>\u003cdt>Time\u003c/dt>\u003cdd>A few hours a month, depending on your needs.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Partner sync\u003c/dt>\u003cdd>Monthly, with peer sessions and touch bases as needed.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Response\u003c/dt>\u003cdd>A person replies within 2 business days.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Pricing\u003c/dt>\u003cdd>Shared in the fit conversation, before you decide.\u003c/dd>\u003c/div>\u003c/dl>\n \u003cp class=\"study-privacy\" data-reveal>What you share is for you only. Group sessions are recorded for members and never public. \u003ca href=\"membership.html#participation\">Privacy, recordings and trial\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection class=\"study-section study-final\" id=\"next-step\" data-theme=\"sand\" data-bg-fade=\"ivory\" aria-labelledby=\"final-title\">\n \u003cdiv class=\"study-centered\">\n  \u003cp class=\"study-label\" data-reveal>Next step\u003c/p>\n  \u003ch2 id=\"final-title\" data-reveal>Have an immediate challenge\u003cbr> we can help with?\u003c/h2>\n  \u003cp class=\"study-section-lead\" data-reveal>Tell us what it is. No commitment; a person replies within 2 business days.\u003c/p>\n  \u003cdiv class=\"study-hero-actions\" data-reveal>\u003ca class=\"study-cta\" href=\"apply.html?intent=individual\">\u003cspan>Can we help?\u003c/span>\u003cspan class=\"study-cta-arrow\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n  \u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\n \u003c/div>\n\u003c/section>\n\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","study/site.js"],"title":"Execute at venture speed and scale | Venture Executive Network"},"clean/membership.html":{"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\"/>\u003cmeta content=\"width=device-width,initial-scale=1\" name=\"viewport\"/>\u003cmeta content=\"#f4f1e9\" name=\"theme-color\"/>\u003ctitle>How it works | Venture Executive Network\u003c/title>\u003cmeta content=\"Personal VEN Partner attention, preparation and follow-up for your top two monthly challenges. Live sessions, introductions and 1:1 conversations.\" name=\"description\"/>\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"photo-preview.css\">[[VEN_STYLE:photo-preview.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"engagement-labels.css\">[[VEN_STYLE:engagement-labels.css]]\u003c/style>\u003cstyle data-source=\"engagement-controls.css\">[[VEN_STYLE:engagement-controls.css]]\u003c/style>\u003cstyle data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"partner-support.css\">[[VEN_STYLE:partner-support.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"advisor-carousel.css\">[[VEN_STYLE:advisor-carousel.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v23.css\">[[VEN_STYLE:hierarchy-v23.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-membership v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca aria-label=\"VEN, Venture Executive Network home\" class=\"v-brand\" href=\"index.html\">\u003cspan aria-hidden=\"true\" class=\"v-brand-name v-brand-wordmark\">VEN\u003c/span>\u003c/a>\u003cbutton aria-controls=\"v-primary-nav\" aria-expanded=\"false\" class=\"v-menu-toggle\" type=\"button\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav aria-label=\"Main navigation\" class=\"v-nav\" id=\"v-primary-nav\">\u003cdiv class=\"study-nav-main\">\u003ca aria-current=\"page\" href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv aria-hidden=\"true\" class=\"study-atmosphere\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head c-membership-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">How it works · For venture-backed leadership teams\u003c/p>\u003ch1>Your toughest challenges.\u003cbr/>A Partner beside&nbsp;you.\u003c/h1>\u003cp class=\"v-lead\">Each month, name the two that matter most. Your Partner guides you to peers and advisors who’ve faced them.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-text-link v14-partner-link\" href=\"#ven-partner\">Meet a VEN Partner \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"v-wrap s-mem-glance\" id=\"fit\">\u003cdl class=\"s-fit-facts s-fit-facts--3\" id=\"participation\">\u003cdiv>\u003cdt>Who\u003c/dt>\u003cdd>Leadership teams at venture-backed companies, from the CEO to functional leaders\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Venture funding\u003c/dt>\u003cdd>At least $1M\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Location\u003c/dt>\u003cdd>Worldwide\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Participation\u003c/dt>\u003cdd>Individually or with colleagues, each with their own Partner\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Trial\u003c/dt>\u003cdd>Two free sessions for each eligible newcomer\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Time\u003c/dt>\u003cdd>A few hours a month, depending on your needs\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Partner sync\u003c/dt>\u003cdd>Monthly, with peer sessions and touch bases as needed\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Response\u003c/dt>\u003cdd>A person replies within 2 business days\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Pricing\u003c/dt>\u003cdd>Shared in the fit conversation, before you decide\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"s-fit-grid s-fit-grid--privacy\" id=\"privacy\">\u003cdiv class=\"s-confidential s-confidential--row\">\u003cdiv class=\"s-conf-head\">\u003cp class=\"v-eyebrow\">Privacy and recordings\u003c/p>\u003ch3>What stays private, and what is recorded.\u003c/h3>\u003c/div>\u003cp>\u003cstrong>Your information.\u003c/strong> For you only. Never shared with other members, colleagues, your CEO or investors.\u003c/p>\u003cp>\u003cstrong>Partner calls.\u003c/strong> Recorded for internal use only.\u003c/p>\u003cp>\u003cstrong>Group sessions.\u003c/strong> Recorded. Members watch recordings from their own stage and earlier. Never public.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"v-wrap\">\u003cfigure class=\"c-banner-photo\">\u003cimg alt=\"A Partner and a leader in conversation by a window\" class=\"\" fetchpriority=\"high\" height=\"1024\" src=\"[[VEN_ASSET:ven-partner-one-to-one-4f4f666f1a58bc4a.webp]]\" style=\"object-position:50% 20%\" width=\"1536\"/>\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white c-how c-membership-work\" id=\"how-it-works\">\u003cdiv class=\"v-wrap\">\n\u003cdiv class=\"c-section-heading\">\u003cdiv>\u003cp class=\"v-eyebrow\">Working with your Partner\u003c/p>\u003ch2>You set the agenda.\u003c/h2>\u003c/div>\u003c/div>\n\u003col class=\"c-care\">\u003cli>\u003cspan aria-hidden=\"true\">01\u003c/span>\u003cdiv>\u003ch3>Name your top two.\u003c/h3>\u003cp>Bring what you’re facing, what you’ve tried and your constraints. Agree where to start.\u003c/p>\u003c/div>\u003c/li>\n\u003cli>\u003cspan aria-hidden=\"true\">02\u003c/span>\u003cdiv>\u003ch3>Bring in the right support.\u003c/h3>\u003cp>Work through the sticking point together, then bring in a specialist, peer session, focused 1:1 or resource. Introductions are briefed on both sides.\u003c/p>\u003c/div>\u003c/li>\n\u003cli>\u003cspan aria-hidden=\"true\">03\u003c/span>\u003cdiv>\u003ch3>Review and adjust.\u003c/h3>\u003cp>Meet your Partner monthly, more often when needed. Keep what helped; change what didn’t.\u003c/p>\u003c/div>\u003c/li>\u003c/ol>\n\u003cp class=\"v14-difference\">Your Partner stays involved alongside your board, coach or peer network, not instead of them.\u003c/p>\u003cp class=\"s-mem-example\">\u003ca class=\"v-text-link\" href=\"case-study.html\">See a decision example \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/p>\n\u003csection aria-labelledby=\"partner-spotlight-title\" class=\"v15-partner-spotlight\" id=\"ven-partner\">\u003ch3 id=\"partner-spotlight-title\">Meet a VEN Partner\u003c/h3>\u003carticle class=\"v15-partner-profile v15-partner-profile--portrait s-partner-right\" data-partner-profile=\"karin-klemencic\">\u003cdiv>\u003ch4>Karin Klemencic\u003c/h4>\u003cp class=\"v15-partner-context\">One of several VEN Partners.\u003c/p>\u003cp class=\"v15-partner-bio\">15+ years in strategic operations, including Chief of Staff at Boehringer Ingelheim. Background in finding where work is stuck and building the systems to fix it.\u003c/p>\u003ca class=\"v-text-link\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003cfigure class=\"v28-partner-portrait\">\u003cimg alt=\"Karin Klemencic\" height=\"480\" loading=\"lazy\" src=\"[[VEN_ASSET:ven-partner-karin-klemencic-d640fcc2d0547fba.webp]]\" width=\"480\"/>\u003c/figure>\u003c/article>\u003c/section>\n\u003c/div>\u003c/section>\u003csection aria-labelledby=\"formats-title\" class=\"v-section v-section--white c-how\" id=\"formats\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v25-formats-head\">\u003cp class=\"v-eyebrow\">Ways to engage\u003c/p>\u003ch2 id=\"formats-title\">Learn from what others have tried.\u003c/h2>\u003cp>Matched to your stage. Leaders from other industries share what they tried and what they’d change.\u003c/p>\u003c/div>\u003cdiv class=\"v12-engagement\" data-engagement-gallery=\"\">\u003cdiv class=\"v12-engagement-layout\">\u003cdiv class=\"v12-mode-panels\">\u003cdiv aria-labelledby=\"mode-tab-introductions\" class=\"v12-mode-panel\" id=\"mode-panel-introductions\" role=\"tabpanel\" tabindex=\"0\">\u003cfigure>\u003cimg alt=\"A notebook and coffee on a walnut table after a working conversation\" class=\"\" height=\"1024\" loading=\"lazy\" src=\"[[VEN_ASSET:ven-still-life-notebook-bcf666e15c171b75.webp]]\" style=\"object-position:50% 20%\" width=\"1536\"/>\u003c/figure>\u003cdiv class=\"v12-mode-description\">\u003ch3>Useful context, before you meet.\u003c/h3>\u003cp>Your Partner briefs both sides first: your question, and why their experience fits it.\u003c/p>\u003c/div>\u003c/div>\u003cdiv aria-labelledby=\"mode-tab-peers\" class=\"v12-mode-panel\" hidden=\"\" id=\"mode-panel-peers\" role=\"tabpanel\" tabindex=\"0\">\u003cfigure>\u003cimg alt=\"Leaders comparing notes around a table\" class=\"\" height=\"1024\" loading=\"lazy\" src=\"[[VEN_ASSET:ven-peers-session-6419815648de133c.webp]]\" style=\"object-position:50% 40%\" width=\"1536\"/>\u003c/figure>\u003cdiv class=\"v12-mode-description\">\u003ch3>A room that understands the pressure.\u003c/h3>\u003cp>Hear how leaders at other companies handled similar pressure, and what they’d change.\u003c/p>\u003c/div>\u003c/div>\u003cdiv aria-labelledby=\"mode-tab-experts\" class=\"v12-mode-panel\" hidden=\"\" id=\"mode-panel-experts\" role=\"tabpanel\" tabindex=\"0\">\u003cfigure>\u003cimg alt=\"Gururaj Pandurangi and participants at a FounderNexus session\" class=\"ven-photo--daylight-session\" height=\"1670\" loading=\"lazy\" src=\"[[VEN_ASSET:38d3dce2765789b90ad6.jpg]]\" style=\"object-position:50% 20%\" width=\"2224\"/>\u003c/figure>\u003cdiv class=\"v12-mode-description\">\u003ch3>Experience for the question at hand.\u003c/h3>\u003cp>Test a decision with operational advisors who bring expertise in specific areas, added by stage and topic.\u003c/p>\u003c/div>\u003c/div>\u003cdiv aria-labelledby=\"mode-tab-one-to-one\" class=\"v12-mode-panel\" hidden=\"\" id=\"mode-panel-one-to-one\" role=\"tabpanel\" tabindex=\"0\">\u003cfigure>\u003cimg alt=\"Two people working together at a FounderNexus gathering\" class=\"ven-photo--conversation\" height=\"2391\" loading=\"lazy\" src=\"[[VEN_ASSET:333d78cc6fb1e80f666f.jpg]]\" style=\"object-position:50% 40%\" width=\"1800\"/>\u003c/figure>\u003cdiv class=\"v12-mode-description\">\u003ch3>Time for your specific question.\u003c/h3>\u003cp>Work through the detail with one peer or expert.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"v12-mode-controls\">\u003cp class=\"v12-mode-prompt\" id=\"mode-choice-prompt\">Select a way to engage\u003c/p>\u003cdiv aria-describedby=\"mode-choice-prompt\" aria-label=\"How members engage\" aria-orientation=\"vertical\" role=\"tablist\">\u003cbutton aria-controls=\"mode-panel-introductions\" aria-selected=\"true\" data-mode=\"introductions\" id=\"mode-tab-introductions\" role=\"tab\" tabindex=\"0\" type=\"button\">\u003cspan>Prepared introductions\u003c/span>\u003cspan aria-hidden=\"true\" class=\"v12-mode-arrow\">\u003cspan class=\"v12-mode-open\">→\u003c/span>\u003cspan class=\"v12-mode-check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton aria-controls=\"mode-panel-peers\" aria-selected=\"false\" data-mode=\"peers\" id=\"mode-tab-peers\" role=\"tab\" tabindex=\"-1\" type=\"button\">\u003cspan>Peer sessions\u003c/span>\u003cspan aria-hidden=\"true\" class=\"v12-mode-arrow\">\u003cspan class=\"v12-mode-open\">→\u003c/span>\u003cspan class=\"v12-mode-check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton aria-controls=\"mode-panel-experts\" aria-selected=\"false\" data-mode=\"experts\" id=\"mode-tab-experts\" role=\"tab\" tabindex=\"-1\" type=\"button\">\u003cspan>Experts &amp; advisors\u003c/span>\u003cspan aria-hidden=\"true\" class=\"v12-mode-arrow\">\u003cspan class=\"v12-mode-open\">→\u003c/span>\u003cspan class=\"v12-mode-check\">✓\u003c/span>\u003c/span>\u003c/button>\u003cbutton aria-controls=\"mode-panel-one-to-one\" aria-selected=\"false\" data-mode=\"one-to-one\" id=\"mode-tab-one-to-one\" role=\"tab\" tabindex=\"-1\" type=\"button\">\u003cspan>1:1 conversations\u003c/span>\u003cspan aria-hidden=\"true\" class=\"v12-mode-arrow\">\u003cspan class=\"v12-mode-open\">→\u003c/span>\u003cspan class=\"v12-mode-check\">✓\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection aria-labelledby=\"questions-title\" class=\"v-section v-section--white c-how s-mem-questions\" id=\"questions\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"s-q-grid\">\u003cdiv class=\"s-q-head\">\u003cp class=\"v-eyebrow\">Practical questions\u003c/p>\u003ch2 id=\"questions-title\">Before you decide.\u003c/h2>\u003cp>Sessions, the free trial, who you’ll meet and what happens after.\u003c/p>\u003c/div>\u003cdiv class=\"v-faq\">\u003cdetails>\u003csummary>What is a session?\u003c/summary>\u003cp>Usually a 60-minute focused discussion on one topic, with stage-aligned peers and an expert. It can also be a 1:1 with an expert on your own topic.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What is the trial, and is it free?\u003c/summary>\u003cp>Yes, it’s free: two sessions, with timing agreed individually. Each eligible newcomer gets one, including colleagues who join later.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Who will I meet in sessions?\u003c/summary>\u003cp>Leaders at your company stage who are interested in the topic and qualified to be in the room. You’re never matched with anyone outside your stage.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>How is my Partner chosen?\u003c/summary>\u003cp>By company stage. Partners aren’t specialists in your industry or function; they’re expert Partners who work like a chief of staff on your challenges and bring in the specialists you need.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Why peers from other industries?\u003c/summary>\u003cp>It’s natural to think your situation is unique to your industry. Peers at your stage in other industries have often faced similar problems, and they bring approaches you haven’t seen.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What happens after the trial?\u003c/summary>\u003cp>If it fits, you choose monthly or annual membership. Pricing and terms come in the fit conversation, before you decide.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Can I start without my whole team?\u003c/summary>\u003cp>Yes. Start on your own; colleagues can join later with their own challenges and Partner.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What if we haven’t raised $1M yet?\u003c/summary>\u003cp>Apply anyway. We’ll keep your details and reassess once you’ve raised. VEN is for companies that have raised at least $1M in venture funding.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Who pays?\u003c/summary>\u003cp>You decide: personally or through your company. Each leader holds their own membership; there is no team or group billing. Membership may qualify as a business expense; check with your tax advisor.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Fit goes both ways\u003c/p>\u003ch2>Have an immediate challenge we can help with?\u003c/h2>\u003cp>Tell us what it is. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca aria-label=\"VEN, Venture Executive Network home\" class=\"v-brand\" href=\"index.html\">\u003cspan aria-hidden=\"true\" class=\"v-brand-name v-brand-wordmark\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr/>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav aria-label=\"Footer\" class=\"s-footer-nav\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"How it works | Venture Executive Network"},"clean/roles.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Support by leadership role | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Different roles contribute to the company plan in different ways. Find relevant experience for the decisions and commitments in yours.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-roles v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\" aria-current=\"page\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">By role · For venture-backed leaders\u003c/p>\u003ch1>Start with the role you hold.\u003c/h1>\u003cp class=\"v-lead\">Each role page shows the decisions VEN is built for. If you cover several, start with the most urgent.\u003c/p>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide. What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003ca class=\"v-text-link v12-team-crosslink\" href=\"team.html\">Introducing colleagues? \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white v-role-directory-opening\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-directory-layout\">\u003cfigure class=\"h-directory-photo v11-role-directory-photo\">\u003cimg src=\"[[VEN_ASSET:ven-roles-plan-45040714e74ef5ee.webp]]\" alt=\"Two leaders working through a plan at a walnut table\" width=\"960\" height=\"1280\" loading=\"lazy\">\u003c/figure>\u003cdiv>\u003cnav class=\"v-role-directory\" aria-label=\"Explore support by role\">\u003ca class=\"v-role-entry\" href=\"role-ceo.html\">\u003cdiv>\u003ch3>Founders &amp; CEOs\u003c/h3>\u003cp>Which commitments to fund, staff or stop before the next milestone.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-sales.html\">\u003cdiv>\u003ch3>Sales &amp; revenue\u003c/h3>\u003cp>Sales capacity, conversion and a forecast you can explain.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-marketing.html\">\u003cdiv>\u003ch3>Marketing\u003c/h3>\u003cp>Positioning, channel investment and demand that reaches sales.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-finance.html\">\u003cdiv>\u003ch3>Finance\u003c/h3>\u003cp>Runway, hiring and spend, and what the plan costs to reach.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-product.html\">\u003cdiv>\u003ch3>Product &amp; technology\u003c/h3>\u003cp>Customer commitments, product reliability and the roadmap.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-operations.html\">\u003cdiv>\u003ch3>Operations\u003c/h3>\u003cp>Who owns what, and whether delivery holds as volume grows.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-people.html\">\u003cdiv>\u003ch3>People leadership\u003c/h3>\u003cp>Which leaders to hire, how ownership shifts and who you keep.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-role-entry\" href=\"role-other.html\">\u003cdiv>\u003ch3>Another leadership role\u003c/h3>\u003cp>Customer success, strategy, specialist functions and combined responsibilities.\u003c/p>\u003c/div>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/nav>\u003cp class=\"v-note\">These roles are starting points. Your responsibilities may span more than one.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Bring your own challenges.\u003c/h2>\u003cp>Your title is a starting point. Bring your top two. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Support by leadership role | Venture Executive Network"},"clean/team.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>For your company | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Each leader contributes through their own decisions. VEN supports the people making those calls with relevant experience, while the company plan gives their work a shared purpose.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"photo-finish.css\">[[VEN_STYLE:photo-finish.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"team-connections.css\">[[VEN_STYLE:team-connections.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-team v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\" aria-current=\"page\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head v-page-head--photo\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">For CEOs exploring support for their team\u003c/p>\u003ch1>Help your leaders with the decisions they own.\u003c/h1>\u003cp class=\"v-lead\">Your plan rests on calls your finance, product and sales leaders make. Introduce them without joining.\u003c/p>\u003ca class=\"v-text-link\" href=\"team.html#introduce\">Introduce a leader \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003ca class=\"v-text-link v12-team-personal-link\" href=\"role-ceo.html\">Support for your own role \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003cfigure class=\"v-page-head-image\">\u003cimg class=\"ven-photo--speaker-frame\" src=\"[[VEN_ASSET:ven-peers-session-6419815648de133c.webp]]\" alt=\"Leaders comparing notes around a table\" width=\"1536\" height=\"1024\" fetchpriority=\"high\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist v-working-section\" id=\"connected-decisions\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">How it connects\u003c/p>\u003ch2>Every leader’s call lands on one plan.\u003c/h2>\u003cp class=\"v-lead\">Each leader works their own challenge. The calls still land on the same plan.\u003c/p>\u003c/div>\u003cdiv class=\"v-contribution-path\">\u003cp class=\"v-connection-label\">Individual decisions\u003c/p>\u003cdiv class=\"v-team-flow\">\u003carticle>\u003ch3>Sales &amp; revenue\u003c/h3>\u003cp>Choose where conversion or capacity needs attention before committing more headcount.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Marketing\u003c/h3>\u003cp>Decide which demand and pipeline evidence would justify the next budget commitment.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Finance\u003c/h3>\u003cp>Compare revenue assumptions and cash needs before protecting or changing an investment.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Product &amp; technology\u003c/h3>\u003cp>Weigh customer commitments against reliability and the delivery capacity already planned.\u003c/p>\u003c/article>\u003carticle>\u003ch3>Operations\u003c/h3>\u003cp>Clarify ownership and capacity for growing volume before adding roles or tools.\u003c/p>\u003c/article>\u003carticle>\u003ch3>People leadership\u003c/h3>\u003cp>Define the capability the next stage needs before opening a leadership role.\u003c/p>\u003c/article>\u003c/div>\u003cdiv class=\"v-company-objective\">\u003cp class=\"v-eyebrow\">A shared company goal\u003c/p>\u003ch3>Grow enterprise revenue within the current runway.\u003c/h3>\u003cp>Examples only. Your roles and goal will differ.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"v-company-concept-link\">\u003ca class=\"v-text-link\" href=\"equation.html\">See how one decision carries forward \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-columns\">\u003cdiv>\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">One member at a time\u003c/p>\u003ch2>Each leader gets their own Partner.\u003c/h2>\u003c/div>\u003cp>Their own challenges, their own trial, their own membership. What they share stays with them, including from you.\u003c/p>\u003cp>Each eligible newcomer gets a free two-session trial, including colleagues who join later.\u003c/p>\u003c/div>\u003caside class=\"v-column-aside\">\u003cp class=\"v-eyebrow\">Before bringing others in\u003c/p>\u003ch3>Start with the decision,\u003cbr>not the org chart.\u003c/h3>\u003cp>Name the leader, the call they own and the company goal it affects.\u003c/p>\u003cp>Each leader holds their own membership. There is no team or group billing.\u003c/p>\u003c/aside>\u003c/div>\u003cdiv class=\"v-faq\">\u003cdetails>\u003csummary>Who pays when a colleague joins?\u003c/summary>\u003cp>Each colleague holds their own membership and decides how to pay, personally or through the company. There is no team plan. Terms come in the fit conversation.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Do we have to enroll the whole team?\u003c/summary>\u003cp>No. Leaders start individually or together, each with their own two-session trial.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Do colleagues need to bring the same challenges?\u003c/summary>\u003cp>No. Each member brings their own top two. They can still serve the same company plan.\u003c/p>\u003c/details>\u003c/div>\u003cdetails class=\"v-faq v-sponsor\" id=\"introduce\">\u003csummary>A note to introduce a colleague\u003c/summary>\u003cdiv id=\"sponsor-note\" class=\"v-reading\">\u003cp>I’d like to introduce [leader or role] to VEN. Their decisions on [challenge one] and [challenge two] affect [company priority].\u003c/p>\u003cp>Could they apply? VEN reviews each application before any conversation.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003cbutton class=\"v-button v-button--secondary\" type=\"button\" disabled id=\"copy-sponsor\">Copy conversation starter\u003c/button>\u003cbutton class=\"v-button v-button--secondary\" type=\"button\" disabled id=\"print-overview\">Print this overview\u003c/button>\u003c/div>\u003cp id=\"copy-status\" class=\"v-note\" role=\"status\">\u003c/p>\u003c/details>\u003c/div>\u003c/section>\u003csection class=\"c-evidence-links v-section--white\">\u003cdiv class=\"v-wrap\">\u003cp>Meet the advisors and hear from FounderNexus members.\u003c/p>\u003cdiv>\u003ca class=\"v-text-link\" href=\"experts.html\">Our operational advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003ca class=\"v-text-link\" href=\"member-experience.html\">Member experience \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Who should go first?\u003c/h2>\u003cp>Start with yourself, or introduce the leader whose decision can’t wait. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-text-link\" href=\"team.html#introduce\">Introduce a colleague \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"For your company | Venture Executive Network"},"clean/story.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Our story | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Why VEN extends personal support from FounderNexus to founders, CEOs and senior leaders across venture-backed leadership teams.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"photo-preview.css\">[[VEN_STYLE:photo-preview.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"photo-finish.css\">[[VEN_STYLE:photo-finish.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"community-marks.css\">[[VEN_STYLE:community-marks.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-story v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\" aria-current=\"page\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head v11-story-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Our story\u003c/p>\u003ch1>Built for the person\u003cbr>making the call.\u003c/h1>\u003cp class=\"v-lead\">The company has a milestone. You have the decision. VEN puts a Partner and a room of peers behind you.\u003c/p>\u003c/div>\u003cfigure class=\"v11-story-community\">\u003cimg src=\"[[VEN_ASSET:a56689193fabe974f5b8.jpg]]\" alt=\"FounderNexus community members together after a session\" width=\"2163\" height=\"1453\" class=\"v13-photo-community ven-photo--community s-story-photo\" fetchpriority=\"high\">\u003cfigcaption class=\"s-story-caption\">FounderNexus members after a session.\u003c/figcaption>\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white v11-story-roots\" id=\"story-roots\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-history h10-history\">\u003carticle class=\"v-history-entry\">\u003cp class=\"v-eyebrow\">Built on FounderNexus\u003c/p>\u003ch3>Experience is worth sharing.\u003c/h3>\u003cdiv>\u003cp>Court Lorenzini, founding CEO of DocuSign, helped start FounderNexus: founders sharing the experience behind their decisions.\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"v-history-entry\">\u003cp class=\"v-eyebrow\">The next chapter\u003c/p>\u003ch3>It came from the members.\u003c/h3>\u003cdiv>\u003cp>Members asked for the same support for their leadership teams. VEN extends it to the whole leadership team.\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-story-purpose\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Why we’re here\u003c/p>\u003ch2>Why VEN starts with the individual.\u003c/h2>\u003c/div>\u003cp>Companies don’t make calls; people do. Your Partner learns your role and constraints, then stays with you as priorities change.\u003c/p>\u003cp class=\"v-mission\">\u003cstrong>Our mission\u003c/strong>\u003cbr>Help leadership teams of venture-backed companies execute toward their milestones through better-informed decisions and the experience of people who have made them.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"c-evidence-links v-section--white\">\u003cdiv class=\"v-wrap\">\u003cp>Meet the advisors and hear from FounderNexus members.\u003c/p>\u003cdiv>\u003ca class=\"v-text-link\" href=\"experts.html\">Our operational advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003ca class=\"v-text-link\" href=\"member-experience.html\">Member experience \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v25-marks\">\u003cdiv class=\"v-wrap c-community-marks\">\u003cp class=\"v-note\">Companies represented in the FounderNexus community\u003c/p>\u003cdiv class=\"h-company-marks\">\u003cimg src=\"[[VEN_ASSET:b66906af458d1ad51489.svg]]\" alt=\"ConversionMagic\" loading=\"lazy\">\u003cimg src=\"[[VEN_ASSET:c03e61bf4e5b8705e433.webp]]\" alt=\"Identient\" loading=\"lazy\" width=\"250\" height=\"62\">\u003cimg src=\"[[VEN_ASSET:28803e3ad69e4363b196.svg]]\" alt=\"Payscore\" loading=\"lazy\">\u003cimg src=\"[[VEN_ASSET:3532bf31ccd1067fa87b.png]]\" alt=\"ARY Engineering\" loading=\"lazy\" width=\"2234\" height=\"892\">\u003cimg src=\"[[VEN_ASSET:a9e658535753692394e2.svg]]\" alt=\"SDF Labs\" loading=\"lazy\" width=\"688\" height=\"200\">\u003cimg src=\"[[VEN_ASSET:1946d5e9ab0fa9c05e80.png]]\" alt=\"Wild Zebra\" loading=\"lazy\" width=\"260\" height=\"43\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Good company, for the work ahead.\u003c/h2>\u003cp>It starts with a short application about your role and the decision in front of you. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-text-link\" href=\"membership.html\">How it works \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Our story | Venture Executive Network"},"clean/equation.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>The Success Equation | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Outside experience may confirm your plan or suggest an adjustment. Your next choice can affect the time, capital and options available for the work after it.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-equation v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Decision approach · For venture-backed leaders\u003c/p>\u003ch1>One decision can change the options that follow.\u003c/h1>\u003cp class=\"v-lead\">Hearing how others made a similar call can confirm your plan or change it. The decision stays yours.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist v-working-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">One decision, then the next\u003c/p>\u003ch2>How one choice carries forward.\u003c/h2>\u003c/div>\u003cdiv class=\"v-equation\" aria-label=\"A decision concept, not a measured equation\">\u003cspan class=\"v-equation-term\">Relevant input\u003c/span>\u003cspan class=\"v-equation-symbol\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"v-equation-term\">Your choice\u003c/span>\u003cspan class=\"v-equation-symbol\" aria-hidden=\"true\">→\u003c/span>\u003cspan class=\"v-equation-term\">Next options\u003c/span>\u003c/div>\u003cp>A hiring, spending or customer decision changes what you can do next. Test the assumptions before you act.\u003c/p>\u003cp>What you hear either backs the plan or gives you a reason to change it.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\" id=\"decision-examples\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Decisions in practice\u003c/p>\u003ch2>Confirm the plan or choose an adjustment.\u003c/h2>\u003c/div>\u003cdiv class=\"v-role-select\">\u003clabel for=\"equation-example-select\">See a decision example\u003c/label>\u003cselect disabled id=\"equation-example-select\" aria-controls=\"equation-example\">\u003coption value=\"sales\">Sales capacity\u003c/option>\u003coption value=\"marketing\">Marketing spend\u003c/option>\u003coption value=\"people\">Role design\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"equation-example\" class=\"v-role-example\">\u003cdiv class=\"v-example-challenge\">\u003cp class=\"v-eyebrow\">Example\u003c/p>\u003ch3 data-equation-challenge>Add sellers, or improve conversion first?\u003c/h3>\u003c/div>\u003cdiv class=\"v-example-perspective\">\u003ch4>Experience to draw on\u003c/h4>\u003cp data-equation-partner>Sales leaders who have separated a capacity problem from a conversion problem.\u003c/p>\u003c/div>\u003cdiv class=\"v-example-action\">\u003ch4>Your possible choice\u003c/h4>\u003cp data-equation-next data-equation-choice>Decide whether the next dollar goes to sellers or to conversion.\u003c/p>\u003c/div>\u003cdiv class=\"v-equation-options\" data-equation-options>\u003carticle>\u003ch4>Confirm the hiring plan\u003c/h4>\u003cp>Write the hiring brief with the capacity gap named.\u003c/p>\u003c/article>\u003carticle>\u003ch4>Adjust the investment\u003c/h4>\u003cp>Fix conversion before committing more headcount.\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"v-note v-equation-carry\" data-equation-carry>The next hiring and budget decisions start from what you found.\u003c/p>\u003c/div>\u003cp class=\"v-note\">Illustrative decisions, not measured member results.\u003c/p>\u003cp class=\"v-screen-reader\" role=\"status\" aria-live=\"polite\" data-equation-status>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"v-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-columns\">\u003cdiv>\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Perspective and judgment\u003c/p>\u003ch2>Experience informs the call. You make it.\u003c/h2>\u003c/div>\u003cp>Your Partner brings in advisors, peers and specialists. You decide, because you know what they don’t.\u003c/p>\u003cp>Sometimes you keep the plan. Sometimes you change a commitment.\u003c/p>\u003c/div>\u003caside class=\"v-monthly-focus\">\u003cstrong>2\u003c/strong>\u003cp>challenges per member, each month\u003c/p>\u003ca class=\"v-text-link\" href=\"membership.html\">How it works \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/aside>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What are your top two challenges?\u003c/h2>\u003cp>Bring the two in front of you. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"The Success Equation | Venture Executive Network"},"clean/challenges.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Your top challenges | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"A familiar example can help you find a starting point. Your own challenges and context shape the support.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VE
