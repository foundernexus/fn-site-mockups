ction>\u003csection class=\"v-section v-section--mist v-activity-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-blog-feature\">\u003cfigure class=\"v-editorial-image\">\u003cimg class=\"ven-photo--workshop\" src=\"[[VEN_ASSET:fe5be00aafe94cdfcaff.webp]]\" alt=\"Participants at a FounderNexus working session\" width=\"1600\" height=\"1200\" loading=\"lazy\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">Featured\u003c/p>\u003ch2>What Actually Changes at the Series A Operating Layer\u003c/h2>\u003cp>How the ways a company works need to evolve as its next stage puts new demands on the team.\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/series-a-operating-layer\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-article-list\">\u003carticle class=\"v-article\">\u003cdiv>\u003cp class=\"v-eyebrow\">People &amp; leadership\u003c/p>\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/blog/first-senior-hire-seed\">Your First Senior Hire at Seed: The Decisions That Actually Matter \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>The questions behind a senior hire: what the company needs to become and which responsibilities need an owner. July 7, 2026\u003c/p>\u003c/div>\u003cdiv>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/first-senior-hire-seed\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-article\">\u003cdiv>\u003cp class=\"v-eyebrow\">Community notes\u003c/p>\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/blog/where-to-find-foundernexus-during-sf-tech-week-2026\">Where to Find FounderNexus During SF Tech Week 2026 \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>Five sessions across the first three days of SF Tech Week, with Court Lorenzini joining each conversation. September 22, 2026\u003c/p>\u003c/div>\u003cdiv>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/where-to-find-foundernexus-during-sf-tech-week-2026\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-article\">\u003cdiv>\u003cp class=\"v-eyebrow\">Fundraising\u003c/p>\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/blog/qualify-investors-by-check-size-before-you-pitch\">How to Qualify Investors by Check Size Before You Pitch \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>Why an investor’s usual check size matters alongside sector fit when building a fundraising list. September 21, 2026\u003c/p>\u003c/div>\u003cdiv>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/qualify-investors-by-check-size-before-you-pitch\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-article\">\u003cdiv>\u003cp class=\"v-eyebrow\">Fundraising\u003c/p>\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/blog/why-every-seed-round-needs-a-lead-investor-first\">Why Every Seed Round Needs a Lead Investor First \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>A look at fundraising sequence and the role of the first professional investor willing to lead. August 17, 2026\u003c/p>\u003c/div>\u003cdiv>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/why-every-seed-round-needs-a-lead-investor-first\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-article\">\u003cdiv>\u003cp class=\"v-eyebrow\">Peer perspective\u003c/p>\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/blog/how-founders-use-a-peer-room\">How Founders Actually Use a Peer Room \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>What makes a peer conversation useful for a specific decision, beyond simply talking it through. July 8, 2026\u003c/p>\u003c/div>\u003cdiv>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/how-founders-use-a-peer-room\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"v-article\">\u003cdiv>\u003cp class=\"v-eyebrow\">Peer perspective\u003c/p>\u003ch3>\u003ca class=\"v-title-link\" href=\"https://www.foundernexus.com/blog/what-a-good-founder-room-looks-like\">What a Good Founder Room Actually Looks Like \u003cspan aria-hidden=\"true\">\u003c/span>\u003c/a>\u003c/h3>\u003cp>A practical way to judge the relevance and usefulness of a peer conversation.\u003c/p>\u003c/div>\u003cdiv>\u003ca class=\"v-text-link\" href=\"https://www.foundernexus.com/blog/what-a-good-founder-room-looks-like\">Read on FounderNexus \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Bring the question to your own work.\u003c/h2>\u003cp>Bring your role, stage and top two challenges. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Blog | Venture Executive Network"},"clean/advisors.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>For advisors | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Explore connections with venture-backed leaders who fit your ideal client profile. Help with the decisions you understand best.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-advisors v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head v-page-head--photo\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Partner with VEN · For advisors\u003c/p>\u003ch1>You’ve made these calls before.\u003cbr>Help someone making them now.\u003c/h1>\u003cp class=\"v-lead\">Meet venture-backed leaders who fit the clients you serve best, on the decisions you know best.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=advisor\">Start an advisor conversation \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cfigure class=\"v-page-head-image\">\u003cimg src=\"[[VEN_ASSET:ven-still-life-notebook-bcf666e15c171b75.webp]]\" alt=\"A notebook and coffee on a walnut table after a working conversation\" width=\"1536\" height=\"1024\" fetchpriority=\"high\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Built on FounderNexus\u003c/p>\u003ch2>Who you would work with.\u003c/h2>\u003c/div>\u003cdiv class=\"v-reading\">\u003cp>Leadership teams at venture-backed companies, built on the FounderNexus founder community.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist v-working-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Fit first\u003c/p>\u003ch2>Start with the leaders you serve best.\u003c/h2>\u003cp class=\"v-lead\">Tell us the roles, stages and decisions you know best. You work alongside the member’s Partner, not instead of them.\u003c/p>\u003c/div>\u003cdl class=\"v-fit-facts\">\u003cdiv>\u003cdt>Venture funding\u003c/dt>\u003cdd>At least $1M\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Leaders\u003c/dt>\u003cdd>CEOs and senior leaders across functions\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Location\u003c/dt>\u003cdd>Worldwide\u003c/dd>\u003c/div>\u003c/dl>\u003c/div>\u003c/section>\u003csection class=\"v-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Proposed starting points\u003c/p>\u003ch2>Work around a real decision.\u003c/h2>\u003c/div>\u003cdiv class=\"v-participation\">\u003cdiv class=\"v-participation-item\">\u003ch3>Talk through a decision\u003c/h3>\u003cp>Compare options on a challenge you know.\u003c/p>\u003c/div>\u003cdiv class=\"v-participation-item\">\u003ch3>Share an approach\u003c/h3>\u003cp>Offer a practical framework or worked example.\u003c/p>\u003c/div>\u003cdiv class=\"v-participation-item\">\u003ch3>Explore a topic session\u003c/h3>\u003cp>Focus on a question members have in common.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note\">Scope, availability and expectations are agreed before any introduction.\u003c/p>\u003cdiv class=\"v-faq\">\u003cdetails>\u003csummary>Who could I help?\u003c/summary>\u003cp>Founders, CEOs and functional leaders across venture-backed leadership teams.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Do I need to be part of a firm?\u003c/summary>\u003cp>Independent advisors, operators and specialists. What counts is having made these decisions.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What would participation involve?\u003c/summary>\u003cp>We agree scope, format and availability first. An inquiry commits you to nothing, and advising is separate from membership.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Where could your experience help?\u003c/h2>\u003cp>Tell us who you serve best and the decisions you help them make. A sentence or two is enough; we reply within 24 hours.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=advisor\">Start an advisor conversation \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"For advisors | Venture Executive Network"},"clean/venture-partners.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Partner as a venture firm | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Explore another route to relevant operating experience for the leaders turning your portfolio companies’ plans into progress.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-venture-partners v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head v-page-head--photo\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Partner with VEN · For venture firms\u003c/p>\u003ch1>Back the leaders,\u003cbr>not only the CEO.\u003c/h1>\u003cp class=\"v-lead\">Give the finance, product and sales leaders in your portfolio a Partner and a room of peers.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=vc\">Start a venture firm conversation \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003cfigure class=\"v-page-head-image\">\u003cimg src=\"[[VEN_ASSET:ven-hero-peers-d6cd5f633aed0dce.webp]]\" alt=\"Leaders in conversation around a table\" width=\"2240\" height=\"960\" fetchpriority=\"high\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Beyond the founder\u003c/p>\u003ch2>Alongside your platform team, not instead of it.\u003c/h2>\u003c/div>\u003cdiv class=\"v-reading\">\u003cp>Your fund keeps its relationships. VEN adds peers, operators and experts on each member’s top two challenges.\u003c/p>\u003cp>Each leader decides on membership for themselves. An introduction gives your firm no access to their discussions.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist v-working-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">Proposed starting points\u003c/p>\u003ch2>Ways to work together.\u003c/h2>\u003c/div>\u003cdiv class=\"v-participation\">\u003cdiv class=\"v-participation-item\">\u003ch3>Introduce interested leaders\u003c/h3>\u003cp>Introduce portfolio leaders to VEN. We discuss fit with each of them directly.\u003c/p>\u003c/div>\u003cdiv class=\"v-participation-item\">\u003ch3>Explore a topic session\u003c/h3>\u003cp>Bring an operating question your portfolio keeps hitting. We agree who should be in the room and who from your network can speak to it.\u003c/p>\u003c/div>\u003cdiv class=\"v-participation-item\">\u003ch3>Connect operating experience\u003c/h3>\u003cp>Put forward an operator or specialist who wants to contribute.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note\">Scope, responsibilities and terms are agreed up front.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"v-section\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-section-heading\">\u003cp class=\"v-eyebrow\">A practical first conversation\u003c/p>\u003ch2>Start with your portfolio’s work.\u003c/h2>\u003c/div>\u003cdiv class=\"v-faq\">\u003cdetails>\u003csummary>What should we bring to the conversation?\u003c/summary>\u003cp>The roles, stages and challenges where outside experience would help. No sensitive company details needed.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>Does an introduction commit a leader?\u003c/summary>\u003cp>No. Each leader decides individually, each with their own two-session trial.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>What arrangements need to be agreed?\u003c/summary>\u003cp>Formats, availability, referral arrangements and commercial terms. Members’ discussions and inputs remain private.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What are your portfolio leaders working through?\u003c/h2>\u003cp>Tell us which leaders and which decisions. We reply within 24 hours with where to start.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=vc\">Start a venture firm conversation \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Partner as a venture firm | Venture Executive Network"},"clean/apply.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Apply | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Apply to VEN: tell us the challenge. For leadership teams at companies that have raised at least $1M in venture funding.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-apply v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Apply · For venture-backed leadership teams\u003c/p>\u003ch1>Tell us about the challenge.\u003c/h1>\u003cp class=\"v-lead\">VEN is for leadership teams at companies that have raised at least $1M in venture funding.\u003c/p>\u003cp class=\"v-note\">Not there yet? Apply anyway. We’ll keep your details and reassess when you’ve raised.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-columns\">\u003csection class=\"v-form\">\u003cp class=\"v-demo-notice v-demo-flag\" role=\"note\">\u003cstrong>Demo only.\u003c/strong> Review the flow; no details will be sent.\u003c/p>\u003cp class=\"v-apply-how\">Every application is reviewed by a person. If your company is at the $1M bar, you’ll hear from us within 2 business days. No commitment.\u003c/p>\u003cform id=\"membership-form\" data-inquiry-form hidden>\u003cp class=\"v-note\">Required unless marked optional.\u003c/p>\u003cdiv class=\"v-fields-two\">\u003cdiv class=\"v-field\">\u003clabel for=\"name\">Your name\u003c/label>\u003cinput id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required maxlength=\"160\">\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"email\">Work email\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"160\">\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"company\">Company\u003c/label>\u003cinput id=\"company\" name=\"company\" type=\"text\" autocomplete=\"organization\" required maxlength=\"160\">\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"role\">Your role\u003c/label>\u003cselect id=\"role\" name=\"role\" required>\u003coption value=\"\">Choose your role\u003c/option>\u003coption>Founders &amp; CEOs\u003c/option>\u003coption>Sales &amp; revenue\u003c/option>\u003coption>Marketing\u003c/option>\u003coption>Finance\u003c/option>\u003coption>Product &amp; technology\u003c/option>\u003coption>Operations\u003c/option>\u003coption>People leadership\u003c/option>\u003coption>Another leadership role\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003cdiv class=\"v-field\" data-website-field hidden>\u003clabel for=\"website\">Company website\u003c/label>\u003cinput id=\"website\" name=\"website\" type=\"text\" inputmode=\"url\" autocomplete=\"url\" maxlength=\"200\" placeholder=\"company.com\">\u003csmall>Needed because the email address isn’t a company domain.\u003c/small>\u003c/div>\u003cfieldset class=\"v-intent v-funding\">\u003clegend>Has your company raised at least $1M in venture funding?\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"funding\" value=\"Yes\" required> Yes\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"funding\" value=\"Not yet\"> Not yet\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"funding\" value=\"Not sure\"> Not sure\u003c/label>\u003c/fieldset>\u003cp class=\"v-inline-note\" data-funding-note=\"Not yet\" hidden>Thanks for being upfront. VEN is for companies that have raised at least $1M in venture funding. Send this anyway; we’ll keep it on file and reassess once you’ve raised.\u003c/p>\u003cp class=\"v-inline-note\" data-funding-note=\"Not sure\" hidden>That’s fine. We’ll check.\u003c/p>\u003cdiv class=\"v-field\" data-stage-field hidden>\u003clabel for=\"stage\">Latest round \u003cspan>(optional)\u003c/span>\u003c/label>\u003cselect id=\"stage\" name=\"stage\">\u003coption value=\"\">Choose a round\u003c/option>\u003coption>Pre-seed / Seed\u003c/option>\u003coption>Series A\u003c/option>\u003coption>Series B / C\u003c/option>\u003coption>Series D+\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"priority\">What challenge can we help with?\u003c/label>\u003ctextarea id=\"priority\" name=\"priority\" required maxlength=\"500\" rows=\"3\" aria-describedby=\"priority-hint\">\u003c/textarea>\u003csmall id=\"priority-hint\">A few lines is enough.\u003c/small>\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"referrer\">Referred by a colleague? \u003cspan>(optional)\u003c/span>\u003c/label>\u003cinput id=\"referrer\" name=\"referrer\" type=\"text\" maxlength=\"160\" placeholder=\"Their name\">\u003c/div>\u003clabel class=\"v-check\">\u003cinput type=\"checkbox\" name=\"updates\" value=\"Yes\"> Email me occasional VEN updates. \u003cspan>You’ll confirm by email; unsubscribe any time.\u003c/span>\u003c/label>\u003cp class=\"v-assure\">Read only by the VEN team. Never shared with other members, your company or investors.\u003c/p>\u003cbutton class=\"v-button v-button--primary\" type=\"submit\">Review my application \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003c/form>\u003csection id=\"request-review\" class=\"v-form-review\" hidden aria-labelledby=\"review-title\">\u003cp class=\"v-eyebrow\">Your application\u003c/p>\u003ch2 id=\"review-title\" tabindex=\"-1\">Check the details, then send.\u003c/h2>\u003cdl id=\"request-summary\" class=\"v-form-summary\">\u003c/dl>\u003cp class=\"v-demo-notice v-demo-flag\" data-send-note>\u003cstrong>Demo only.\u003c/strong> Check the details above; nothing will be sent.\u003c/p>\u003cdiv class=\"v-actions\" data-send-actions>\u003cbutton class=\"v-button v-button--primary\" type=\"button\" data-send-inquiry>Send for review\u003c/button>\u003cbutton class=\"v-button v-button--secondary\" type=\"button\" data-edit-request>Edit details\u003c/button>\u003cbutton class=\"v-button v-button--secondary\" type=\"button\" data-clear-request>Clear entries\u003c/button>\u003c/div>\u003cdiv class=\"v28-sent\" data-inquiry-sent hidden tabindex=\"-1\" role=\"status\">\u003cp class=\"v-eyebrow\">Demo · Nothing was sent\u003c/p>\u003ch3 data-sent-title>Thanks. Every application is reviewed by a person.\u003c/h3>\u003cp data-sent-body>You’ll hear from us within 2 business days.\u003c/p>\u003cp class=\"v-note\">On the live site this goes to VEN. Edit or clear your details to run the demo again.\u003c/p>\u003c/div>\u003c/section>\u003cnoscript>\u003cp>This application needs JavaScript. You can still read how VEN works and explore the rest of the site.\u003c/p>\u003ca class=\"v-text-link\" href=\"membership.html\">How it works \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/noscript>\u003c/section>\u003caside class=\"v-inquiry-aside\">\u003cp class=\"v-eyebrow\">What happens next\u003c/p>\u003ch2>A short review, then a conversation if it fits.\u003c/h2>\u003col class=\"v-process\">\u003cli>\u003cstrong>You apply\u003c/strong>\u003cp>Six short questions. Your details go to VEN from this page.\u003c/p>\u003c/li>\u003cli>\u003cstrong>A person reviews it\u003c/strong>\u003cp>Within 2 business days for companies at the bar. If something is unclear, we ask one question.\u003c/p>\u003c/li>\u003cli>\u003cstrong>A conversation, if it fits\u003c/strong>\u003cp>With a VEN Partner, the dedicated person who’d work with you: your challenge, your company, and terms before you decide. For eligible companies, the first two sessions are a free trial.\u003c/p>\u003c/li>\u003c/ol>\u003cdiv class=\"v-inquiry-next\">\u003ch3>Not there yet?\u003c/h3>\u003cp>Apply anyway. We keep your details, and you can apply again with the same email once you’ve raised. Nobody books a call before the review.\u003c/p>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003c/aside>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","clarity/application.js","clarity/inquiry-send.js","study/site.js"],"title":"Apply | Venture Executive Network"},"clean/partner-inquiry.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Explore a partnership | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Tell us who you work with and which decisions you help them make.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-partner-inquiry v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Partner with VEN\u003c/p>\u003ch1>Where could your experience help?\u003c/h1>\u003cp class=\"v-lead\">Tell us who you work with and which decisions you help them make.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-columns\">\u003csection class=\"v-form\">\u003cp class=\"v-demo-notice v-demo-flag\" role=\"note\">\u003cstrong>Demo only.\u003c/strong> Review the flow; no details will be sent.\u003c/p>\u003cform id=\"partner-form\" data-inquiry-form hidden>\u003cfieldset class=\"v-intent\">\u003clegend>I’m exploring a partnership as\u003c/legend>\u003clabel>\u003cinput type=\"radio\" name=\"type\" value=\"advisor\" checked> An advisor\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"type\" value=\"vc\"> A venture firm\u003c/label>\u003c/fieldset>\u003cp class=\"v-note\">Required unless marked optional.\u003c/p>\u003cdiv class=\"v-fields-two\">\u003cdiv class=\"v-field\">\u003clabel for=\"name\">Your name\u003c/label>\u003cinput id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required maxlength=\"160\">\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"email\">Work email\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"160\">\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"company\">Company or firm\u003c/label>\u003cinput id=\"company\" name=\"company\" type=\"text\" autocomplete=\"organization\" required maxlength=\"160\">\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"role\">Your role\u003c/label>\u003cinput id=\"role\" name=\"role\" type=\"text\" autocomplete=\"organization-title\" required maxlength=\"160\">\u003c/div>\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"focus\" data-partner-focus-label>Who do you serve best?\u003c/label>\u003ctextarea id=\"focus\" name=\"focus\" required maxlength=\"1200\" aria-describedby=\"focus-hint\">\u003c/textarea>\u003csmall id=\"focus-hint\">The roles, stages and decisions you know first-hand. Please leave sensitive details out.\u003c/small>\u003c/div>\u003cdiv class=\"v-field\">\u003clabel for=\"interest\">What would you like to offer or ask? \u003cspan>(optional)\u003c/span>\u003c/label>\u003ctextarea id=\"interest\" name=\"interest\" maxlength=\"1200\">\u003c/textarea>\u003c/div>\u003cbutton class=\"v-button v-button--primary\" type=\"submit\">Review my details \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003c/form>\u003csection id=\"partner-review\" class=\"v-form-review\" hidden aria-labelledby=\"review-title\">\u003cp class=\"v-eyebrow\">Your conversation starter\u003c/p>\u003ch2 id=\"review-title\" tabindex=\"-1\">A little context. A place to begin.\u003c/h2>\u003cdl id=\"partner-summary\" class=\"v-form-summary\">\u003c/dl>\u003cp class=\"v-demo-notice v-demo-flag\" data-send-note>\u003cstrong>Demo only.\u003c/strong> Check the details above; nothing will be sent.\u003c/p>\u003cdiv class=\"v-actions\" data-send-actions>\u003cbutton class=\"v-button v-button--primary\" type=\"button\" data-send-inquiry>Preview confirmation\u003c/button>\u003cbutton class=\"v-button v-button--secondary\" type=\"button\" data-edit-request>Edit details\u003c/button>\u003cbutton class=\"v-button v-button--secondary\" type=\"button\" data-clear-request>Clear entries\u003c/button>\u003c/div>\u003cdiv class=\"v28-sent\" data-inquiry-sent hidden tabindex=\"-1\" role=\"status\">\u003cp class=\"v-eyebrow\">Demo\u003c/p>\u003ch3>Demo complete. Nothing was sent.\u003c/h3>\u003cp>Edit or clear your details to run it again.\u003c/p>\u003c/div>\u003c/section>\u003cnoscript>\u003cp>The interactive inquiry needs JavaScript. You can still explore the advisor and venture-firm pages.\u003c/p>\u003c/noscript>\u003c/section>\u003caside class=\"v-inquiry-aside\">\u003cp class=\"v-eyebrow\">Where to start\u003c/p>\u003ch2>Relevance first.\u003c/h2>\u003cp>We’ll discuss the decisions you’ve made and who they could help. Terms come before any introduction.\u003c/p>\u003cp class=\"v-note\">An inquiry does not commit you to a format or schedule.\u003c/p>\u003cdiv class=\"v-inquiry-next\">\u003ch3>On the live site.\u003c/h3>\u003col class=\"v-process v24-next\">\u003cli>\u003cstrong>You send\u003c/strong>\u003cp>Your details go to VEN from this page. Nothing to email.\u003c/p>\u003c/li>\u003cli>\u003cstrong>Within 24 hours\u003c/strong>\u003cp>VEN replies to inquiries and questions.\u003c/p>\u003c/li>\u003cli>\u003cstrong>A partnership conversation\u003c/strong>\u003cp>Roles, stages and formats where your experience fits; scope and terms before any introduction.\u003c/p>\u003c/li>\u003c/ol>\u003c/div>\u003ca class=\"v-text-link\" href=\"advisors.html\">For advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003ca class=\"v-text-link\" href=\"venture-partners.html\">For venture firms \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/aside>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","clarity/inquiry-send.js","study/site.js"],"title":"Explore a partnership | Venture Executive Network"},"clean/role-ceo.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Founders &amp; CEOs | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Personal operational support for venture-backed CEOs: weigh capital, leadership capacity and delivery priorities with relevant expertise and resources.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-ceo v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Founders &amp; CEOs · For venture-backed leaders\u003c/p>\u003ch1>The board sees the milestone. You see the tradeoffs.\u003c/h1>\u003cp class=\"v-lead\">Capital, people and delivery can’t all move at once. Work out the order with your Partner, in confidence.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=ceo\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with your team, board or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-hero-peers-d6cd5f633aed0dce.webp]]\" alt=\"Leaders in conversation around a table\" width=\"2240\" height=\"960\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Which commitments matter most to the next milestone?\u003c/li>\u003cli>Where would clearer ownership remove a constraint?\u003c/li>\u003cli>What should we stop if the growth plan changes?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Founders &amp; CEOs\u003c/p>\u003ch2>More growth. The same runway.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>The milestone needs growth, but capital and leadership time are finite. Not every commitment can move at once.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>A CEO who has sequenced similar trade-offs. Test what your capital and team can carry.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Decide which commitment to protect, postpone or stop.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:a2ebf63be3c5cd69913e.webp]]\" alt=\"Court Lorenzini\" width=\"2000\" height=\"1334\" class=\"\" loading=\"lazy\" style=\"object-position:45% 28%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Court Lorenzini\u003c/h3>\u003cp>Founding CEO, DocuSign\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: company building and leadership trade-offs.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#court\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What needs to move before the next milestone?\u003c/h2>\u003cp>Bring the call you carry as CEO. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=ceo\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Founders & CEOs | Venture Executive Network"},"clean/role-sales.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Sales &amp; revenue | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Support for venture-backed sales and revenue leaders: sales capacity, conversion, forecast assumptions and buyer handoffs.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-sales v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Sales &amp; revenue · For venture-backed leaders\u003c/p>\u003ch1>Build revenue the company can plan around.\u003c/h1>\u003cp class=\"v-lead\">Targets rise while deal cycles shift. Work through the pipeline with your Partner.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=sales\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Add sellers, or improve conversion first?\u003c/li>\u003cli>Which forecast assumptions need stronger deal evidence?\u003c/li>\u003cli>Is the enterprise deal worth the delivery commitment?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Sales &amp; revenue\u003c/p>\u003ch2>Before you add another seller.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>The pipeline grows, but deals lose momentum. More sellers could add cost before you find the constraint.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>A sales operator, briefed on your question. Go through qualification, stages and handoffs to find where deals stall.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Decide whether to fix the process, firm up buyer commitments or add capacity before the next hire.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:a3b0e72d4f30c8164865.webp]]\" alt=\"Collin Stewart\" width=\"1200\" height=\"1200\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Collin Stewart\u003c/h3>\u003cp>Founder &amp; CEO, Predictable Revenue\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: sales process and team development.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#collin\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Where is revenue getting stuck?\u003c/h2>\u003cp>Bring the revenue call that needs a second view. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=sales\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class
