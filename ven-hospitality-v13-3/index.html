dy-facts--three{grid-template-columns:1fr;gap:26px}\n}\n","spacing-v1512.css":"/* v15.12: shared spacing rules, applied after the preserved styles. */\nbody.mai-study {\n  --ven-space-opening-compact: 64px;\n  --ven-space-process: 80px;\n}\n\n/* Give the message and photograph room together; retain the approved treatments. */\n@media (min-width: 761px) {\n  body.mai-home .study-hero {\n    padding-top: 160px !important;\n    min-height: clamp(960px, 100svh, 1040px) !important;\n  }\n  body.mai-home .hero-kicker { margin-bottom: 20px !important; }\n  body.mai-home .study-hero-lead { margin-top: 28px !important; }\n  body.mai-home .study-hero .study-hero-actions { margin-top: 32px !important; }\n  body.mai-home .s-hero-media img { padding-top: 360px !important; }\n}\n\n/* A consistent floor for compact openings; retain larger standard openings. */\nbody.mai-interior.v-page-roles main > .v-page-head,\nbody.mai-interior main > .h-role-arrival,\nbody.mai-interior main > .h-case-arrival,\nbody.mai-interior main > .v11-story-head {\n  padding-top: var(--ven-space-opening-compact) !important;\n}\nbody.mai-interior.v-page-membership #how-it-works {\n  padding-top: var(--ven-space-process) !important;\n}\nbody.mai-interior.v-page-team .v-faq { margin-top: 32px; }\n\n@media (max-width: 760px) {\n  body.mai-study {\n    --ven-space-opening-compact: 52px;\n    --ven-space-process: 48px;\n  }\n  body.mai-interior main > .v11-story-head { padding-top: 48px !important; }\n  body.mai-interior.v-page-team .v-faq { margin-top: 28px; }\n}\n","team-v1513.css":"/* Three real decisions converge on the example company goal. */\n@media (min-width: 901px) {\n  body.v-page-team #connected-decisions .v-team-flow {\n    grid-template-columns: repeat(3, minmax(0, 1fr));\n    gap: 24px;\n  }\n  body.v-page-team #connected-decisions .v-team-flow::before {\n    left: calc((100% - 48px) / 6);\n    right: calc((100% - 48px) / 6);\n  }\n  body.v-page-team #connected-decisions .v-team-flow article {\n    padding: 24px;\n  }\n  body.v-page-team #connected-decisions .v-team-flow h3 {\n    font-size: 20px;\n    min-height: 0;\n  }\n}\n","team-v1514.css":"/* Six functions form one group beneath a shared company plan. */\nbody.v-page-team #connected-decisions .v-team-flow {\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 24px;\n  padding: 0 0 64px;\n  border: 0;\n}\nbody.v-page-team #connected-decisions .v-team-flow article {\n  padding: 24px;\n}\nbody.v-page-team #connected-decisions .v-team-flow h3 {\n  min-height: 0;\n  font-size: 20px;\n}\nbody.v-page-team #connected-decisions .v-team-flow article::before {\n  display: none;\n}\nbody.v-page-team #connected-decisions .v-team-flow::before {\n  left: 0;\n  right: 0;\n  bottom: 24px;\n  width: auto;\n  height: 16px;\n  border: 1px solid var(--connection-ink);\n  border-top: 0;\n}\nbody.v-page-team #connected-decisions .v-team-flow::after {\n  display: none;\n}\nbody.v-page-team #connected-decisions .v-company-objective::before {\n  top: -24px;\n  height: 24px;\n}\nbody.v-page-team #connected-decisions .v-company-objective::after {\n  top: -28px;\n  background: var(--steel);\n}\nbody.v-page-team #connected-decisions .v-company-objective .v-eyebrow {\n  color: var(--steel);\n}\n@media (min-width: 761px) and (max-width: 1100px) {\n  body.v-page-team #connected-decisions .v-team-flow {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 20px;\n  }\n}\n@media (max-width: 760px) {\n  body.v-page-team #connected-decisions .v-team-flow {\n    grid-template-columns: 1fr;\n    gap: 14px;\n    padding-bottom: 48px;\n  }\n  body.v-page-team #connected-decisions .v-team-flow article {\n    padding: 20px 24px;\n  }\n  body.v-page-team #connected-decisions .v-team-flow h3 {\n    font-size: 18px;\n  }\n}\n"},"scripts":{"pathways/examples.js":"window.VEN_EXAMPLES={\"roles\":[{\"key\":\"ceo\",\"file\":\"role-ceo.html\",\"label\":\"Founders & CEOs\",\"short\":\"Founders & CEOs\",\"title\":\"The board sees the milestone. You see the trade-offs.\",\"lead\":\"Capital, people and delivery compete for attention. Compare how other CEOs have made these choices.\",\"directoryContext\":\"Which commitments to fund, staff or stop before the next milestone.\",\"challengeQuestions\":[\"Which commitments matter most to the next milestone?\",\"Where would clearer ownership remove a constraint?\",\"What should we stop if the growth plan changes?\"],\"insight\":{\"title\":\"The milestone depends on the sequence.\",\"body\":\"Hiring, product commitments and capital decisions affect one another. Review the assumptions together before committing to each in isolation.\"},\"benefits\":[{\"title\":\"Test the operating plan\",\"body\":\"Compare how other leaders sequenced capital, people and delivery under time constraints.\"},{\"title\":\"Make room for leadership\",\"body\":\"Examine where a key hire or clearer ownership could support the plan.\"}],\"workedExample\":{\"label\":\"Example · Founders & CEOs\",\"challenge\":\"Keep the growth plan, or change the sequence?\",\"choices\":[\"Keep the sequence\",\"Adjust it\"],\"partner\":\"Founders and CEOs who have balanced growth targets, leadership capacity and capital at a comparable stage.\",\"next\":\"Set the conditions that would keep the plan intact or change the order of commitments.\",\"nextTitle\":\"Test the sequence\"},\"optionalProof\":[],\"supportCta\":\"See the Founders & CEOs page\"},{\"key\":\"sales\",\"file\":\"role-sales.html\",\"label\":\"Sales & revenue\",\"short\":\"Sales & revenue\",\"title\":\"Build revenue the company can plan around.\",\"lead\":\"Deals are taking longer to close. Compare where sales leaders found delays before adding headcount.\",\"directoryContext\":\"Sales capacity, conversion and a forecast you can explain.\",\"challengeQuestions\":[\"Add sellers, or improve conversion first?\",\"Which forecast assumptions need stronger deal evidence?\",\"Is the enterprise deal worth the delivery commitment?\"],\"insight\":{\"title\":\"Adding sellers does not automatically add sales.\",\"body\":\"Look at where qualified deals wait, how sellers spend time and what moves a buyer forward before choosing where to add capacity.\"},\"benefits\":[{\"title\":\"Choose where to add capacity\",\"body\":\"Compare conversion, sales cycles and staffing choices with leaders at a similar stage.\"},{\"title\":\"Explain the forecast\",\"body\":\"Examine deal evidence and ownership behind the commitments the company is planning around.\"}],\"workedExample\":{\"label\":\"Example · Sales & revenue\",\"challenge\":\"Add sellers, or improve conversion first?\",\"choices\":[\"Add capacity\",\"Improve conversion\"],\"partner\":\"Sales leaders who have diagnosed conversion, capacity and sales-cycle constraints at a comparable stage.\",\"next\":\"Trace where qualified deals stall, then decide whether staffing or the process needs to change.\",\"nextTitle\":\"Find the constraint\"},\"optionalProof\":[],\"supportCta\":\"See the Sales & revenue page\"},{\"key\":\"marketing\",\"file\":\"role-marketing.html\",\"label\":\"Marketing\",\"short\":\"Marketing\",\"title\":\"Connect growth spend to qualified demand.\",\"lead\":\"Compare how other growth leaders decide which channels deserve budget and which to stop.\",\"directoryContext\":\"Positioning, channel investment and demand that reaches sales.\",\"challengeQuestions\":[\"Which channels bring qualified buyers, and which should we stop funding?\",\"Where does demand lose quality before reaching sales?\",\"Does the message fit the buyer we need now?\"],\"insight\":{\"title\":\"The channel and the handoff both matter.\",\"body\":\"Follow a qualified buyer through the journey. Targeting, qualification or sales ownership may need attention alongside the campaign.\"},\"benefits\":[{\"title\":\"Know what earns more spend\",\"body\":\"Compare channel traction with pipeline quality before changing the investment.\"},{\"title\":\"Connect demand to the buying decision\",\"body\":\"Explore positioning and handoffs with operators who have worked through similar changes.\"}],\"workedExample\":{\"label\":\"Example · Marketing\",\"challenge\":\"Does the promising channel deserve more budget?\",\"choices\":[\"Increase spend\",\"Validate first\"],\"partner\":\"Marketing operators who have judged channel traction against qualified pipeline.\",\"next\":\"Agree what pipeline evidence and handoff checks would support more spend.\",\"nextTitle\":\"Define the evidence\"},\"optionalProof\":[],\"supportCta\":\"See the Marketing page\"},{\"key\":\"finance\",\"file\":\"role-finance.html\",\"label\":\"Finance\",\"short\":\"Finance\",\"title\":\"Protect runway without losing the milestone.\",\"lead\":\"Compare hiring and revenue assumptions with experienced finance leaders before committing the budget.\",\"directoryContext\":\"Runway, hiring and spend, and what the plan costs to reach.\",\"challengeQuestions\":[\"Which spending protects the next milestone?\",\"Where can we extend runway without stalling delivery?\",\"What return would justify the next AI investment?\"],\"insight\":{\"title\":\"Link each budget commitment to the milestone.\",\"body\":\"Equal cuts can affect delivery unequally. Examine each commitment against the milestone it supports and the cash it requires.\"},\"benefits\":[{\"title\":\"See the operating effect of a cash choice\",\"body\":\"Compare how finance leaders balanced runway with the commitments needed to deliver.\"},{\"title\":\"Make the assumptions visible\",\"body\":\"Examine scenarios behind hiring and spending so leaders can see what would change the plan.\"}],\"workedExample\":{\"label\":\"Example · Finance\",\"challenge\":\"Which commitments do we protect if the plan changes?\",\"choices\":[\"Keep the allocation\",\"Change it\"],\"partner\":\"Finance leaders who have balanced runway with investment in an operating milestone.\",\"next\":\"Compare cash and delivery effects before confirming or changing the allocation.\",\"nextTitle\":\"Compare the operating effect\"},\"optionalProof\":[],\"supportCta\":\"See the Finance page\"},{\"key\":\"product\",\"file\":\"role-product.html\",\"label\":\"Product & technology\",\"short\":\"Product & technology\",\"title\":\"Balance customer commitments with a reliable product.\",\"lead\":\"Compare roadmap priorities, reliability and delivery costs with experienced product and engineering leaders.\",\"directoryContext\":\"Customer commitments, product reliability and the roadmap.\",\"challengeQuestions\":[\"Ship the customer feature, or protect reliability first?\",\"Which requests belong on the roadmap?\",\"AI usage is rising. How do we keep inference costs within budget?\"],\"insight\":{\"title\":\"A customer commitment has a second cost.\",\"body\":\"Maintenance, support and deferred work belong in the decision alongside the feature’s value.\"},\"benefits\":[{\"title\":\"Weigh the work beyond the launch\",\"body\":\"Compare customer value with delivery, support and the work already planned.\"},{\"title\":\"Make the commitment clear across functions\",\"body\":\"Draw on experience explaining product and technical risks to commercial and finance leaders.\"}],\"workedExample\":{\"label\":\"Example · Product & technology\",\"challenge\":\"Ship the customer feature, or protect reliability first?\",\"choices\":[\"Ship the feature\",\"Protect reliability\"],\"partner\":\"Product and technology leaders who have weighed customer commitments against platform constraints.\",\"next\":\"Compare delivery, support and reliability costs before making the customer commitment.\",\"nextTitle\":\"Examine the commitment\"},\"optionalProof\":[],\"supportCta\":\"See the Product & technology page\"},{\"key\":\"operations\",\"file\":\"role-operations.html\",\"label\":\"Operations\",\"short\":\"Operations\",\"title\":\"Keep delivery reliable across a growing company.\",\"lead\":\"Work through capacity, ownership and delivery constraints with experienced operators.\",\"directoryContext\":\"Who owns what, and whether delivery holds as volume grows.\",\"challengeQuestions\":[\"Is the bottleneck capacity, ownership or a handoff?\",\"Change the tools, or improve the process first?\",\"Which approvals can team leads own so delivery stops waiting?\"],\"insight\":{\"title\":\"A new tool can preserve an old bottleneck.\",\"body\":\"Trace where work waits and who can move it forward before choosing a system or process change.\"},\"benefits\":[{\"title\":\"Understand the delay before adding capacity\",\"body\":\"Compare process and staffing choices with operators who have managed growing volume.\"},{\"title\":\"Put ownership where the work happens\",\"body\":\"Explore how others clarified decisions when informal coordination stopped being enough.\"}],\"workedExample\":{\"label\":\"Example · Operations\",\"challenge\":\"More customer commitments. Who owns delivery?\",\"choices\":[\"Keep the process\",\"Change it\"],\"partner\":\"Operators who have coordinated ownership and capacity across growing teams.\",\"next\":\"Clarify what the company can commit to, what to sequence and who owns delivery.\",\"nextTitle\":\"Clarify the commitment\"},\"optionalProof\":[],\"supportCta\":\"See the Operations page\"},{\"key\":\"people\",\"file\":\"role-people.html\",\"label\":\"People leadership\",\"short\":\"People\",\"title\":\"Build the leadership your growth plan needs.\",\"lead\":\"Compare hiring, role changes and retention with experienced people leaders.\",\"directoryContext\":\"Which leaders to hire, how ownership shifts and who you keep.\",\"challengeQuestions\":[\"Make a hire, or change how the work is owned?\",\"Which leadership capability does the next stage need?\",\"How do we retain strong people as responsibilities change?\"],\"insight\":{\"title\":\"An overloaded role can look like a hiring gap.\",\"body\":\"Separate a missing capability from work that has accumulated in the wrong place before deciding how to fill the gap.\"},\"benefits\":[{\"title\":\"Define the capability before the position\",\"body\":\"Compare role design and hiring choices with people leaders at a similar stage.\"},{\"title\":\"Help the existing team through change\",\"body\":\"Draw on experience with expectations, compensation and retention as responsibilities evolve.\"}],\"workedExample\":{\"label\":\"Example · People leadership\",\"challenge\":\"Make a hire, or change how the work is owned?\",\"choices\":[\"Make the hire\",\"Change ownership\"],\"partner\":\"People leaders who have navigated hiring and changing responsibilities through growth.\",\"next\":\"Clarify the capability gap and existing workload before choosing a hire or a change in ownership.\",\"nextTitle\":\"Clarify the capability\"},\"optionalProof\":[],\"supportCta\":\"See the People leadership page\"},{\"key\":\"other\",\"file\":\"role-other.html\",\"label\":\"Another leadership role\",\"short\":\"Another role\",\"title\":\"Bring outside experience to work across teams.\",\"lead\":\"Bring the work you own, whatever the title. Your VEN Partner helps arrange connections with people who have relevant experience.\",\"directoryContext\":\"Customer success, strategy, specialist functions and combined responsibilities.\",\"challengeQuestions\":[\"How much custom work can we promise this customer?\",\"Which team needs to act before we can deliver?\",\"Do we need outside expertise or a different handoff?\"],\"insight\":{\"title\":\"One customer’s exception can become everyone’s process.\",\"body\":\"Consider delivery cost and customer expectations together when deciding whether a commitment can be repeated.\"},\"benefits\":[{\"title\":\"Find experience for the responsibility\",\"body\":\"Your Partner starts with your work and seeks relevant operating experience.\"},{\"title\":\"Connect the functions in the question\",\"body\":\"Examine customer, delivery and company priorities before making a commitment.\"}],\"workedExample\":{\"label\":\"Example · Customer success\",\"challenge\":\"How much custom work can we commit to this customer?\",\"choices\":[\"Custom work\",\"Standard scope\"],\"partner\":\"Customer success and operations leaders who have balanced custom work with repeatable delivery.\",\"next\":\"Make delivery cost and customer expectations explicit before deciding what to offer.\",\"nextTitle\":\"Scope the commitment\"},\"optionalProof\":[],\"supportCta\":\"See support for your role\"}],\"equation\":[{\"key\":\"sales\",\"label\":\"Sales capacity\",\"challenge\":\"Add sellers, or improve conversion first?\",\"partner\":\"Sales leaders who have separated a capacity problem from a conversion problem.\",\"choice\":\"Decide whether the next dollar goes to sellers or to conversion.\",\"next\":\"Decide whether the next dollar goes to sellers or to conversion.\",\"nextOptions\":[{\"title\":\"Confirm the hiring plan\",\"body\":\"Write the hiring brief with the capacity gap named.\"},{\"title\":\"Adjust the investment\",\"body\":\"Fix conversion before committing more headcount.\"}],\"carryForward\":\"The next hiring and budget decisions start from what you found.\"},{\"key\":\"marketing\",\"label\":\"Marketing spend\",\"challenge\":\"Does this channel deserve a larger budget?\",\"partner\":\"Marketing operators who have compared channel activity with qualified pipeline.\",\"choice\":\"Decide what evidence would justify more spend.\",\"next\":\"Decide what evidence would justify more spend.\",\"nextOptions\":[{\"title\":\"Confirm the investment\",\"body\":\"If the pipeline evidence holds up, keep the current growth budget.\"},{\"title\":\"Adjust the approach\",\"body\":\"Test the weak point before a larger budget commitment.\"}],\"carryForward\":\"The next spend decision starts from that evidence.\"},{\"key\":\"people\",\"label\":\"Role design\",\"challenge\":\"Make a hire, or change how the work is owned?\",\"partner\":\"People leaders who have separated a capability gap from an overloaded role.\",\"choice\":\"Decide whether the gap needs a hire or different ownership.\",\"next\":\"Decide whether the gap needs a hire or different ownership.\",\"nextOptions\":[{\"title\":\"Confirm the hire\",\"body\":\"Write the role and hiring brief around the capability gap.\"},{\"title\":\"Adjust the responsibilities\",\"body\":\"Move ownership or expectations where the current team can cover the work.\"}],\"carryForward\":\"Hiring and ownership decisions shape the next workload.\"}]};\n","pathways/editorial.js":"(() => {\n  'use strict';\n  document.documentElement.classList.add('js');\n  const q = (s, root = document) => root.querySelector(s);\n  const all = (s, root = document) => [...root.querySelectorAll(s)];\n  const params = new URLSearchParams(window.__VEN_PAGE_QUERY__ || window.__VEN_PAGE_QUERY__);\n\n  const toggle = q('.v-menu-toggle');\n  const nav = q('#v-primary-nav');\n  const closeMenu = (focus = false) => {\n    if (!toggle || !nav) return;\n    toggle.setAttribute('aria-expanded', 'false');\n    nav.classList.remove('is-open');\n    const mark = q('span', toggle);\n    if (mark) mark.textContent = '＋';\n    if (focus) toggle.focus();\n  };\n  if (toggle && nav) {\n    toggle.addEventListener('click', () => {\n      const open = toggle.getAttribute('aria-expanded') !== 'true';\n      toggle.setAttribute('aria-expanded', String(open));\n      nav.classList.toggle('is-open', open);\n      const mark = q('span', toggle);\n      if (mark) mark.textContent = open ? '−' : '＋';\n    });\n    document.addEventListener('keydown', e => {\n      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') closeMenu(true);\n    });\n    document.addEventListener('click', e => {\n      if (!nav.contains(e.target) && !toggle.contains(e.target)) closeMenu();\n    });\n    nav.addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });\n    matchMedia('(min-width:1121px)').addEventListener('change', e => { if (e.matches) closeMenu(); });\n  }\n\n  const data = window.VEN_EXAMPLES || {roles: [], equation: []};\n  const roleSelect = q('#role-example-select');\n  if (roleSelect) {\n    roleSelect.disabled = false;\n    const showRole = (announce = false) => {\n      const role = data.roles.find(r => r.key === roleSelect.value);\n      if (!role) return;\n      q('[data-role-challenge]').textContent = role.workedExample.challenge;\n      q('[data-role-perspective]').textContent = role.workedExample.partner;\n      q('[data-role-next]').textContent = role.workedExample.next;\n      q('.v-example-challenge .v-note').textContent = 'Example · ' + role.label;\n      const link = q('.v-role-detail-link');\n      const rolePath = 'role-' + role.key + '.html';\n      const routePrefix = (window.__VEN_FULL_ROUTE__ || '').replace(/[^/]*$/, '');\n      link.href = window.__VEN_ROOT_URL__ && routePrefix\n        ? window.__VEN_ROOT_URL__ + '#/' + routePrefix + rolePath\n        : rolePath;\n      link.textContent = role.supportCta + ' →';\n      if (announce) q('[data-role-status]').textContent = role.label + ' example shown.';\n    };\n    if (data.roles.some(r => r.key === params.get('role'))) roleSelect.value = params.get('role');\n    showRole();\n    roleSelect.addEventListener('change', () => showRole(true));\n  }\n  const equationSelect = q('#equation-example-select');\n  const showEquation = (announce = false) => {\n    if (!equationSelect) return;\n    const x = data.equation.find(item => item.key === equationSelect.value);\n    if (!x) return;\n    for (const [attr, key] of [['challenge','challenge'],['partner','partner'],['carry','carryForward']]) {\n      const element = q('[data-equation-' + attr + ']');\n      if (element) element.textContent = x[key];\n    }\n    const choice = q('[data-equation-next]');\n    if (choice) choice.textContent = x.choice || x.next;\n    const options = q('[data-equation-options]');\n    if (options) {\n      options.replaceChildren();\n      for (const option of x.nextOptions || []) {\n        const article = document.createElement('article');\n        const title = document.createElement('h4');\n        const body = document.createElement('p');\n        title.textContent = option.title;\n        body.textContent = option.body;\n        article.append(title, body);\n        options.append(article);\n      }\n    }\n    const status = q('[data-equation-status]');\n    if (status && announce) status.textContent = x.label + ' decision example shown.';\n  };\n  if (equationSelect) {\n    equationSelect.disabled = false;\n    showEquation();\n    equationSelect.addEventListener('change', () => showEquation(true));\n  }\n\n  const form = q('[data-inquiry-form]');\n  if (form) {\n    const partner = form.id === 'partner-form';\n    const review = q(partner ? '#partner-review' : '#request-review');\n    const summary = q(partner ? '#partner-summary' : '#request-summary');\n    const focusLabel = q('[data-partner-focus-label]');\n    const updateType = () => {\n      if (focusLabel) focusLabel.textContent = form.elements.type.value === 'vc' ? 'Where could your portfolio leaders use perspective?' : 'Where is your experience most relevant?';\n    };\n    if (partner && ['advisor', 'vc'].includes(params.get('type'))) {\n      form.elements.type.value = params.get('type');\n    } else if (!partner) {\n      if (form.elements.intent && ['individual', 'team'].includes(params.get('intent'))) form.elements.intent.value = params.get('intent');\n      const role = data.roles.find(r => r.key === params.get('role'));\n      if (role) form.elements.role.value = role.label;\n    }\n    form.addEventListener('change', updateType);\n    updateType();\n    const names = {intent:'Exploring for',type:'Partnership',name:'Name',email:'Email',company:partner?'Company or firm':'Company',role:'Role',stage:'Latest round',priority:'Challenge',funding:'Company has raised $1M+ in venture funding',website:'Company website',referrer:'Referred by',updates:'Email updates',focus:'Relevant audience and decisions',interest:'What to explore'};\n    const values = {individual:'Myself',team:'My colleagues',advisor:'Advisor',vc:'Venture firm'};\n    form.addEventListener('submit', e => {\n      e.preventDefault();\n      if (!form.reportValidity()) return;\n      summary.replaceChildren();\n      for (const [key, raw] of new FormData(form)) {\n        const value = String(raw).trim();\n        if (!value) continue;\n        const dt = document.createElement('dt');\n        const dd = document.createElement('dd');\n        dt.textContent = names[key] || key;\n        dd.textContent = (key === 'intent' || key === 'type') ? values[value] || value : value;\n        summary.append(dt, dd);\n      }\n      form.hidden = true;\n      review.hidden = false;\n      q('#review-title').focus();\n    });\n    q('[data-edit-request]').addEventListener('click', () => {\n      review.hidden = true;\n      form.hidden = false;\n      q('#name').focus();\n    });\n    q('[data-clear-request]').addEventListener('click', () => {\n      const clearedIntent = !partner && form.elements.intent ? form.elements.intent.value : null;\n      form.reset();\n      if (clearedIntent) form.elements.intent.value = clearedIntent;\n      updateType();\n      summary.replaceChildren();\n      review.hidden = true;\n      form.hidden = false;\n      q('#name').focus();\n    });\n    form.hidden = false;\n  }\n\n  const copy = q('#copy-sponsor');\n  if (copy) copy.disabled = false;\n  if (copy) copy.addEventListener('click', async () => {\n    const note = q('#sponsor-note');\n    try {\n      if (!navigator.clipboard) throw new Error('clipboard unavailable');\n      await navigator.clipboard.writeText(note.innerText);\n      q('#copy-status').textContent = 'Conversation starter copied.';\n    } catch (_) {\n      const range = document.createRange();\n      range.selectNodeContents(note);\n      const selection = window.getSelection();\n      selection.removeAllRanges();\n      selection.addRange(range);\n      q('#c
