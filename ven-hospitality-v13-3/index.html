participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-marketing v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Marketing · For venture-backed leaders\u003c/p>\u003ch1>Connect growth spend to qualified demand.\u003c/h1>\u003cp class=\"v-lead\">A busy channel can hide a weak pipeline. Your Partner helps you test which ones bring buyers.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=marketing\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Does this channel deserve more budget?\u003c/li>\u003cli>Where does demand lose quality before reaching sales?\u003c/li>\u003cli>Does the message fit the buyer we need now?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Marketing\u003c/p>\u003ch2>Before you put more budget behind it.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>Leads are up, but few become real sales conversations. The gap could be audience, message, qualification or handoff.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>A marketing operator, briefed on your question. Pick what to test before adding budget.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Run the test, then give sales and leadership a clear reason for the next budget move.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:a3b0e72d4f30c8164865.webp]]\" alt=\"Collin Stewart\" width=\"1200\" height=\"1200\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Collin Stewart\u003c/h3>\u003cp>Founder &amp; CEO, Predictable Revenue\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: qualification and sales handoffs.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#collin\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What needs to change in your growth approach?\u003c/h2>\u003cp>Bring the marketing call that needs a second view. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=marketing\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Marketing | Venture Executive Network"},"clean/role-finance.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Finance | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Support for venture-backed finance leaders: runway, budgeting, investment choices and assumptions behind the company plan.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-finance v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Finance · For venture-backed leaders\u003c/p>\u003ch1>Protect runway without losing the milestone.\u003c/h1>\u003cp class=\"v-lead\">Work through hiring and revenue assumptions with your Partner before committing the budget.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=finance\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-partner-one-to-one-4f4f666f1a58bc4a.webp]]\" alt=\"A Partner and a leader in conversation by a window\" width=\"1536\" height=\"1024\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Which spending protects the next milestone?\u003c/li>\u003cli>Where can we extend runway without stalling delivery?\u003c/li>\u003cli>Which growth assumption makes the budget fragile?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Finance\u003c/p>\u003ch2>Before the hiring plan becomes a cash commitment.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>The hiring plan assumes growth that hasn’t arrived. The next spending call affects runway and delivery.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>A finance leader to pressure-test your hiring and revenue scenarios. Find the assumptions that move cash and delivery.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Take leadership a spending recommendation with its runway and delivery consequences clear.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:74818710371e103b7e10.webp]]\" alt=\"Shareen Corlett\" width=\"402\" height=\"399\" class=\"\" loading=\"lazy\" style=\"object-position:50% 12%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Shareen Corlett\u003c/h3>\u003cp>CPA · Principal, Clark Nuber\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: accounting processes and budgeting.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#shareen\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Which assumption needs a closer look?\u003c/h2>\u003cp>Bring the assumption you’re least sure of. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=finance\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Finance | Venture Executive Network"},"clean/role-product.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Product &amp; technology | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Personal support for venture-backed product and technology leaders: customer commitments, prioritization, reliability and build-or-buy decisions.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style> an>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Product &amp; technology · For venture-backed leaders\u003c/p>\u003ch1>Balance customer commitments with a reliable product.\u003c/h1>\u003cp class=\"v-lead\">Every customer promise moves the roadmap. Your Partner helps you see what each promise displaces.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=product\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-partner-one-to-one-4f4f666f1a58bc4a.webp]]\" alt=\"A Partner and a leader in conversation by a window\" width=\"1536\" height=\"1024\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Ship the customer feature, or protect reliability first?\u003c/li>\u003cli>Which requests belong on the roadmap?\u003c/li>\u003cli>Build this capability, or buy it?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Product &amp; technology\u003c/p>\u003ch2>A customer commitment changes more than the roadmap.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>A major customer wants a feature. Weigh effort, reliability and what it displaces before you promise anything.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>A product or engineering leader who has made a similar trade-off. Test the commitment before you make it.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Choose the option and take a clear rationale back to the customer and your team.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:29e29213c277b5ec7c8f.webp]]\" alt=\"Jordan Tigani\" width=\"760\" height=\"760\" class=\"\" loading=\"lazy\" style=\"object-position:50% 0%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Jordan Tigani\u003c/h3>\u003cp>Founder &amp; CEO, MotherDuck\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: product, data and technical decisions.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#jordan\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What decision is shaping your roadmap?\u003c/h2>\u003cp>Bring the product or technology call you own. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=product\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-operations v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Operations · For venture-backed leaders\u003c/p>\u003ch1>Keep delivery reliable across a growing company.\u003c/h1>\u003cp class=\"v-lead\">Work through capacity, ownership and delivery constraints with your Partner.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=operations\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Is the bottleneck capacity, ownership or a handoff?\u003c/li>\u003cli>Change the tools, or improve the process first?\u003c/li>\u003cli>Which decisions should move closer to the work?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Operations\u003c/p>\u003ch2>More enterprise volume. Can delivery keep up?\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>Enterprise demand rises while delivery misses targets, and teams compete for capacity. Test capacity, margin and ownership before hiring.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>An operator, briefed on your question. Compare staffing, process and service-level trade-offs.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Take leadership a capacity plan with owners, service targets and hiring triggers.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:db19d278a020cf2b6ef2.webp]]\" alt=\"Karl Siebrecht\" width=\"300\" height=\"450\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Karl Siebrecht\u003c/h3>\u003cp>Co-founder &amp; CEO, Flexe\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: logistics and operating scale.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#karl\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>Where does progress slow down?\u003c/h2>\u003cp>Bring the operating constraint in front of you. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=operations\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Operations | Venture Executive Network"},"clean/role-people.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>People leadership | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Personal support for venture-backed people leaders: leadership capability, hiring, changing responsibilities and retention.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-people v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">People leadership · For venture-backed leaders\u003c/p>\u003ch1>Build the capabilities the next stage needs.\u003c/h1>\u003cp class=\"v-lead\">Growth changes the roles you need. Work through each hire with your Partner.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=people\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>Make a hire, or change how the work is owned?\u003c/li>\u003cli>Which leadership capability does the next stage need?\u003c/li>\u003cli>How do we retain strong people as responsibilities change?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · People leadership\u003c/p>\u003ch2>A leadership hire starts with the work.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>The next stage needs more leadership capacity. A new title won’t tell you which capability is missing.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>A leader who has made executive hires. Separate a capability gap from an overloaded role.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Define the role’s ownership and expectations before the search opens. Give the hiring team a clear brief.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:0b0ad82428bc25a04cce.webp]]\" alt=\"Thach “Tak” Nguyen\" width=\"1000\" height=\"1001\" class=\"\" loading=\"lazy\" style=\"object-position:50% 5%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">From our operational advisors\u003c/p>\u003ch3>Thach “Tak” Nguyen\u003c/h3>\u003cp>Founder &amp; Managing Partner, Plenty Search\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: executive hiring and leadership capability.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#tak\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What capability does the next stage need?\u003c/h2>\u003cp>Bring the people decision that can’t wait. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=people\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"People leadership | Venture Executive Network"},"clean/role-other.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Another leadership role | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Support for venture-backed leaders in customer success, strategy, specialist functions and combined roles, shaped around the work they own.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-role-other v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-role-arrival c-role-arrival\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-role-arrival-copy c-role-intro\">\u003cp class=\"v-eyebrow\">Another leadership role · For venture-backed leaders\u003c/p>\u003ch1>Bring outside experience to work across teams.\u003c/h1>\u003cp class=\"v-lead\">Your Partner learns the work you own, whatever the title, and works through it with you.\u003c/p>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=other\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003cp class=\"v-note\">$1M+ in venture funding · Worldwide\u003c/p>\u003cp class=\"v-note\">What you share is for you only, never shared with colleagues, your CEO or investors.\u003c/p>\u003c/div>\u003cfigure class=\"c-banner-photo\">\u003cimg src=\"[[VEN_ASSET:ven-leaders-window-review-5e1c0afe62e2c1d2.webp]]\" alt=\"Two leaders reviewing a page by a window\" width=\"1536\" height=\"864\" class=\"\" fetchpriority=\"high\" style=\"object-position:50% 20%\">\u003c/figure>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"c-role-recognition\">\u003cdiv class=\"h-recognition-copy\">\u003cp class=\"v-eyebrow\">On your desk\u003c/p>\u003ch2>Questions you may be weighing.\u003c/h2>\u003cul class=\"v-questions\">\u003cli>How much bespoke work can we commit to a customer?\u003c/li>\u003cli>Which cross-functional constraint threatens the milestone?\u003c/li>\u003cli>Do we need outside expertise or a different handoff?\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist c-role-example\" id=\"role-example\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-head\">\u003cp class=\"v-eyebrow\">Illustrative scenario · Another leadership role\u003c/p>\u003ch2>Your title is not the whole job.\u003c/h2>\u003c/div>\u003cdiv class=\"v-decision-path c-support-example\">\u003cdiv>\u003cp class=\"v-eyebrow\">What’s at stake\u003c/p>\u003cp>A customer commitment spans several teams. You own part of the call; cost and capacity sit elsewhere.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">Who your Partner brings in\u003c/p>\u003cp>An operator who has made a similar customer commitment. Map cost, ownership and dependencies across teams.\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"v-eyebrow\">What to take back\u003c/p>\u003cp>Agree what the company can promise, who owns it and what delivery takes, before committing.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"v-note c-role-judgment\">The decision stays yours.\u003c/p>\u003cdiv class=\"c-role-proof\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:6ffd1392203412712e2a.webp]]\" alt=\"Rich Barton\" width=\"671\" height=\"680\" class=\"\" loading=\"lazy\" style=\"object-position:50% 10%\">\u003c/figure>\u003cdiv>\u003cp class=\"v-eyebrow\">Part of our wider network of operational advisors\u003c/p>\u003ch3>Rich Barton\u003c/h3>\u003cp>Co-founder, Zillow &amp; Glassdoor · Founder, Expedia\u003c/p>\u003cp class=\"c-role-proof-context\">Experience: coordinating company priorities and growth.\u003c/p>\u003ca class=\"v-text-link\" href=\"experts.html#rich\">Meet the advisors \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What does your role need right now?\u003c/h2>\u003cp>Bring the work you own, whatever the title. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=other\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Another leadership role | Venture Executive Network"},"clean/case-study.html":{"html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"theme-color\" content=\"#f4f1e9\">\u003ctitle>Before the next sales hire · Decision example | Venture Executive Network\u003c/title>\u003cmeta name=\"description\" content=\"Explore how a VEN Partner could help a sales leader draw on relevant operating experience before a hiring decision.\">\u003cstyle data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]\u003c/style>\u003cstyle data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]\u003c/style>\u003cstyle data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]\u003c/style>\u003cstyle data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]\u003c/style>\u003cstyle data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]\u003c/style>\u003cstyle data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]\u003c/style>\u003cstyle data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]\u003c/style>\u003cstyle data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]\u003c/style>\u003cstyle data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]\u003c/style>\u003cstyle data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]\u003c/style>\u003cstyle data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]\u003c/style>\u003cstyle data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]\u003c/style>\u003cstyle data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]\u003c/style>\u003cstyle data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]\u003c/style>\u003cstyle data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]\u003c/style>\u003c/head>\u003cbody class=\"hospitality v10 v-page-case-study v11 v12 c126 mai-study mai-interior\">\u003ca class=\"v-skip\" href=\"#main\">Skip to content\u003c/a>\u003cheader class=\"v-header\">\u003cdiv class=\"v-wrap v-header-inner\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cbutton class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu \u003cspan aria-hidden=\"true\">＋\u003c/span>\u003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"h-case-arrival\">\u003cdiv class=\"v-wrap\">\u003ca class=\"v-text-link h-case-back\" href=\"membership.html\">How it works \u003cspan aria-hidden=\"true\">←\u003c/span>\u003c/a>\u003cdiv class=\"h-case-arrival-grid\">\u003cdiv>\u003cp class=\"h-case-label\">Example scenario\u003c/p>\u003ch1>Before the next\u003cbr>sales hire.\u003c/h1>\u003cp class=\"v-lead\">Enterprise deals stall after the demo. Is the fix another seller, or something else?\u003c/p>\u003cp class=\"h-case-context\">Example context: a Series A B2B company moving into enterprise sales.\u003c/p>\u003c/div>\u003cfigure class=\"v12-case-arrival-image\">\u003cimg src=\"[[VEN_ASSET:ven-still-life-notebook-bcf666e15c171b75.webp]]\" alt=\"A notebook and coffee on a walnut table after a working conversation\" width=\"1536\" height=\"1024\" loading=\"lazy\">\u003c/figure>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\" id=\"the-decision\">\u003cdiv class=\"v-wrap\">\u003col class=\"h-case-sequence\">\u003cli>\u003cspan class=\"h-step-number\" aria-hidden=\"true\">01\u003c/span>\u003ch2>The challenge\u003c/h2>\u003cp>Enterprise growth on the current runway. The sales leader is weighing a hire without knowing why buyers stop after the demo.\u003c/p>\u003c/li>\n        \u003cli>\u003cspan class=\"h-step-number\" aria-hidden=\"true\">02\u003c/span>\u003ch2>The input\u003c/h2>\u003cp>In this example, the Partner maps where deals wait and sets up a focused 1:1. It surfaces the gap: no one owns the buyer’s security review.\u003c/p>\u003c/li>\n        \u003cli>\u003cspan class=\"h-step-number\" aria-hidden=\"true\">03\u003c/span>\u003ch2>The leader’s decision\u003c/h2>\u003cp>The leader tests a shared buyer plan and names an owner for technical review. Hiring stays an option once capacity is clearer.\u003c/p>\u003c/li>\n        \u003cli>\u003cspan class=\"h-step-number\" aria-hidden=\"true\">04\u003c/span>\u003ch2>The follow-through\u003c/h2>\u003cp>The Partner follows up as priorities shift. The leader takes the new context into the next hiring and budget discussion.\u003c/p>\u003c/li>\u003c/ol>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--mist\" id=\"company-value\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"h-case-carry\">\u003cdiv>\u003cp class=\"v-eyebrow\">The individual decision serves the company\u003c/p>\u003ch2>What changed across the team.\u003c/h2>\u003c/div>\u003cdiv>\u003cp>Sales and product agree who owns security review. Finance re-checks the hiring budget against that gap.\u003c/p>\u003cp class=\"h-personal-last\">The hiring and budget conversations that follow start from where the deals stalled.\u003c/p>\u003ca class=\"v-text-link\" href=\"team.html#connected-decisions\">See how individual decisions connect \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"h-case-boundary v-wrap\">\u003c/div>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What decision are you working through?\u003c/h2>\u003cp>Bring your role and the decision in front of you. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual&amp;role=sales\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"v-text-link\" href=\"role-sales.html\">Sales &amp; revenue support \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/ x=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">Our operational advisors\u003c/p>\u003ch1>Experience behind\u003cbr>the advice.\u003c/h1>\u003cp class=\"v-lead\">People who have built companies, led functions and worked through the decisions that come with growth.\u003c/p>\u003cp class=\"v-note c-head-note\">Your Partner suggests the advisor for your question and briefs both sides. Introductions depend on fit and availability.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white c-experts-section\">\u003cdiv class=\"v-wrap c-experts-grid\">\u003carticle class=\"c-expert\" id=\"court\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:a2ebf63be3c5cd69913e.webp]]\" alt=\"Court Lorenzini\" width=\"2000\" height=\"1334\" class=\"\" loading=\"lazy\" style=\"object-position:45% 28%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Company building and leadership\u003c/p>\u003ch2>Court Lorenzini\u003c/h2>\u003cp class=\"c-person-title\">Founding CEO, DocuSign\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.linkedin.com/in/court-lorenzini-333447/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"collin\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:a3b0e72d4f30c8164865.webp]]\" alt=\"Collin Stewart\" width=\"1200\" height=\"1200\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Sales process and team development\u003c/p>\u003ch2>Collin Stewart\u003c/h2>\u003cp class=\"c-person-title\">Founder &amp; CEO, Predictable Revenue\u003c/p>\u003ca class=\"v-text-link\" href=\"https://predictablerevenue.com/about/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"jordan\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:29e29213c277b5ec7c8f.webp]]\" alt=\"Jordan Tigani\" width=\"760\" height=\"760\" class=\"\" loading=\"lazy\" style=\"object-position:50% 0%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Product, data and technical decisions\u003c/p>\u003ch2>Jordan Tigani\u003c/h2>\u003cp class=\"c-person-title\">Founder &amp; CEO, MotherDuck\u003c/p>\u003ca class=\"v-text-link\" href=\"https://motherduck.com/authors/jordan-tigani/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"shareen\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:74818710371e103b7e10.webp]]\" alt=\"Shareen Corlett\" width=\"402\" height=\"399\" class=\"\" loading=\"lazy\" style=\"object-position:50% 12%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Accounting processes and budgeting\u003c/p>\u003ch2>Shareen Corlett\u003c/h2>\u003cp class=\"c-person-title\">CPA · Principal, Clark Nuber\u003c/p>\u003ca class=\"v-text-link\" href=\"https://clarknuber.com/people/shareen-corlett/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"tak\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:0b0ad82428bc25a04cce.webp]]\" alt=\"Thach “Tak” Nguyen\" width=\"1000\" height=\"1001\" class=\"\" loading=\"lazy\" style=\"object-position:50% 5%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Executive hiring and leadership capability\u003c/p>\u003ch2>Thach “Tak” Nguyen\u003c/h2>\u003cp class=\"c-person-title\">Founder &amp; Managing Partner, Plenty Search\u003c/p>\u003ca class=\"v-text-link\" href=\"https://plentysearch.com/about\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"karl\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:db19d278a020cf2b6ef2.webp]]\" alt=\"Karl Siebrecht\" width=\"300\" height=\"450\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Logistics and operating scale\u003c/p>\u003ch2>Karl Siebrecht\u003c/h2>\u003cp class=\"c-person-title\">Co-founder &amp; CEO, Flexe\u003c/p>\u003ca class=\"v-text-link\" href=\"https://flexe.com/company/about/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"adine\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:ab20b83c2ed6bf16511f.webp]]\" alt=\"Adine Mitrani\" width=\"400\" height=\"420\" class=\"\" loading=\"lazy\" style=\"object-position:50% 15%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Technology transactions and intellectual property\u003c/p>\u003ch2>Adine Mitrani\u003c/h2>\u003cp class=\"c-person-title\">Associate, Fenwick\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.fenwick.com/people/adine-mitrani\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"rich\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:6ffd1392203412712e2a.webp]]\" alt=\"Rich Barton\" width=\"671\" height=\"680\" class=\"\" loading=\"lazy\" style=\"object-position:50% 10%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Company building and scale\u003c/p>\u003ch2>Rich Barton\u003c/h2>\u003cp class=\"c-person-title\">Co-founder, Zillow &amp; Glassdoor · Founder, Expedia\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.zillow.com/news/our-leaders/rich-barton/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"darrell\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:c7e3d51c2f48f2af387b.jpg]]\" alt=\"Darrell Cavens\" width=\"512\" height=\"512\" loading=\"lazy\" style=\"object-position:50% 30%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Commerce, growth and operating scale\u003c/p>\u003ch2>Darrell Cavens\u003c/h2>\u003cp class=\"c-person-title\">Co-founder &amp; former CEO, Zulily\u003c/p>\u003ca class=\"v-text-link\" href=\"https://ir.mtch.com/investor-relations/corporate-governance/board-of-directors/default.aspx\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003carticle class=\"c-expert\" id=\"dave\">\u003cfigure>\u003cimg src=\"[[VEN_ASSET:3d919693f0894715b7a9.webp]]\" alt=\"Dave Hersh\" width=\"1200\" height=\"800\" class=\"\" loading=\"lazy\" style=\"object-position:50% 8%\">\u003c/figure>\u003cdiv>\u003cp class=\"c-person-topic\">Leadership and growth transitions\u003c/p>\u003ch2>Dave Hersh\u003c/h2>\u003cp class=\"c-person-title\">Founding CEO, Jive Software\u003c/p>\u003ca class=\"v-text-link\" href=\"https://www.davehersh.com/about/\">Professional background \u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What are your top two challenges?\u003c/h2>\u003cp>Bring the question you would put to one of them. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good co 003c/button>\u003cnav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\">\u003cdiv class=\"study-nav-main\">\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003c/div>\u003cdiv class=\"study-nav-actions\">\u003ca class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in\u003c/a>\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003c/header>\u003cdiv class=\"study-atmosphere\" aria-hidden=\"true\">\u003cdiv class=\"study-wash study-wash--sand\">\u003c/div>\u003cdiv class=\"study-wash study-wash--sage\">\u003c/div>\u003cdiv class=\"study-wash study-wash--rose\">\u003c/div>\u003cdiv class=\"study-grain\">\u003c/div>\u003c/div>\u003cmain id=\"main\" tabindex=\"-1\">\u003csection class=\"v-page-head\">\u003cdiv class=\"v-wrap\">\u003cdiv class=\"v-page-head-copy\">\u003cp class=\"v-eyebrow\">FounderNexus member experience\u003c/p>\u003ch1>What members\u003cbr>bring back.\u003c/h1>\u003cp class=\"v-lead\">FounderNexus members, in their own words. VEN is built on FounderNexus for venture-backed leadership teams.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"v-section v-section--white\">\u003cdiv class=\"v-wrap\">\u003carticle class=\"c-member-story\" id=\"gayathri\">\u003cdiv>\u003cp class=\"v-eyebrow\">Gayathri Venkataraman · FounderNexus member\u003c/p>\u003ch2>Clarity before a course correction.\u003c/h2>\u003cp>Gayathri describes testing her thinking with other people before deciding whether to continue or adjust.\u003c/p>\u003cdetails class=\"c-transcript\">\u003csummary>Read the transcript\u003c/summary>\u003cp>There were so many times that I have actually doubted what I have been doing. Whether you are going to continue that path or you're going to course correct and take a different path, you need to have certain clarity on why this is working, why this is not working. Create a framework of whatever you typically would make your decision and like run it by people. And then you will get that clarity, okay, you know what? Maybe I'm jumping into this conclusion too early or maybe I have been sitting on it for too late. Doesn't matter, but at least you can actually talk with people and get that thing resolved as soon as possible.\u003c/p>\u003c/details>\u003c/div>\u003cfigure>\u003cvideo class=\"c-member-video\" controls playsinline preload=\"none\" poster=\"[[VEN_ASSET:b79d4bed15e25fbafd03.jpg]]\" aria-label=\"Member experience: Gayathri Venkataraman\">\u003csource src=\"[[VEN_ASSET:bfb09463781b99c9e23a.mp4]]\" type=\"video/mp4\">\u003ctrack kind=\"captions\" src=\"[[VEN_ASSET:c2ca6b10c178573363bc.vtt]]\" srclang=\"en\" label=\"English\" default>\u003cp>Your browser cannot play this video.\u003c/p>\u003c/video>\u003c/figure>\u003c/article>\u003carticle class=\"c-member-story\" id=\"ken\">\u003cdiv>\u003cp class=\"v-eyebrow\">Ken Aragon · FounderNexus member\u003c/p>\u003ch2>Reconsidering the order of priorities.\u003c/h2>\u003cp>Ken describes how conversations helped him put product-market fit ahead of fundraising in his own plan.\u003c/p>\u003cdetails class=\"c-transcript\">\u003csummary>Read the transcript\u003c/summary>\u003cp>But as a prior to joining FounderNexus, I had this idea in my mind that you have to go raise money first and then you go build your product. And that's not the way it should be. Through the conversations I had with Court and the other members of FounderNexus, it became really clear to me that my priorities as a founder needed to be in finding product market fit. First.\u003c/p>\u003c/details>\u003c/div>\u003cfigure>\u003cvideo class=\"c-member-video\" controls playsinline preload=\"none\" poster=\"[[VEN_ASSET:672f93e5976a5cc2ae15.jpg]]\" aria-label=\"Member experience: Ken Aragon\">\u003csource src=\"[[VEN_ASSET:5db783474a8a8671b3dd.mp4]]\" type=\"video/mp4\">\u003ctrack kind=\"captions\" src=\"[[VEN_ASSET:6dc3529e3f4c7316bde8.vtt]]\" srclang=\"en\" label=\"English\" default>\u003cp>Your browser cannot play this video.\u003c/p>\u003c/video>\u003c/figure>\u003c/article>\u003c/div>\u003c/section>\u003csection class=\"v-invitation v-section--coral\">\u003cdiv class=\"v-wrap\">\u003cdiv>\u003cp class=\"v-eyebrow\">Next step\u003c/p>\u003ch2>What are your top two challenges?\u003c/h2>\u003cp>Bring the decision you are weighing. No commitment; a person replies within 2 business days.\u003c/p>\u003cp class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.\u003c/p>\u003c/div>\u003cdiv class=\"v-actions\">\u003ca class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"v-footer s-footer\">\u003cdiv class=\"s-footer-inner\">\u003cdiv class=\"s-footer-brand\">\u003ca class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\">\u003cspan class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN\u003c/span>\u003c/a>\u003cp>Venture Executive Network.\u003cbr>Hard calls. Good company.\u003c/p>\u003c/div>\u003cnav class=\"s-footer-nav\" aria-label=\"Footer\">\u003cdiv>\u003cp>Community\u003c/p>\u003ca href=\"membership.html\">How it works\u003c/a>\u003ca href=\"roles.html\">By role\u003c/a>\u003ca href=\"team.html\">For your team\u003c/a>\u003ca href=\"case-study.html\">Decision example\u003c/a>\u003ca href=\"equation.html\">Decision approach\u003c/a>\u003c/div>\u003cdiv>\u003cp>Network\u003c/p>\u003ca href=\"experts.html\">Advisors\u003c/a>\u003ca href=\"story.html\">Our story\u003c/a>\u003ca href=\"advisors.html\">For advisors\u003c/a>\u003ca href=\"venture-partners.html\">For venture firms\u003c/a>\u003c/div>\u003cdiv>\u003cp>Explore\u003c/p>\u003ca href=\"events.html\">Sessions\u003c/a>\u003ca href=\"blog.html\">Blog\u003c/a>\u003ca href=\"member-experience.html\">Member experience\u003c/a>\u003c/div>\u003c/nav>\u003c/div>\u003cdiv class=\"s-footer-base\">\u003cspan>© 2026 Venture Executive Network · Built on FounderNexus\u003c/span>\u003ca href=\"#main\">Back to top\u003c/a>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","scripts":["pathways/editorial.js","study/site.js"],"title":"Member experience | Venture Executive Network"}},"styles":{"pathways/hospitality.css":"@font-face{font-family:Jakarta;src:url(\"[[VEN_ASSET:221a4135d06a4b33abbd.woff2]]\") format('woff2');font-weight:400;font-display:swap}\n@font-face{font-family:Jakarta;src:url(\"[[VEN_ASSET:bad081c8dbc15aed6c5e.woff2]]\") format('woff2');font-weight:500;font-display:swap}\n@font-face{font-family:Jakarta;src:url(\"[[VEN_ASSET:8872bb5c9111df9bd316.woff2]]\") format('woff2');font-weight:600;font-display:swap}\n@font-face{font-family:Jakarta;src:url(\"[[VEN_ASSET:2050755bf475817c96ac.woff2]]\") format('woff2');font-weight:700;font-display:swap}\n:root{--chalk:#f4f1e9;--paper:#fcfbf7;--limestone:#e7e1d5;--ink:#252c2b;--muted:#555d5b;--steel:#486174;--mist:#e8ecec;--copper:#b45309;--rule:#cbc8bd;--radius:3px}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:28px}body{margin:0;background:var(--chalk);color:var(--ink);font:400 17px/1.65 Jakarta,Arial,sans-serif;-webkit-font-smoothing:antialiased}h1,h2,h3,h4,p,figure,blockquote{margin:0}h1,h2,h3,h4{font-weight:500;text-wrap:balance}h1{font-size:clamp(38px,4.25vw,64px);line-height:1.15;letter-spacing:-.025em}h2{font-size:clamp(32px,3.05vw,44px);line-height:1.2;letter-spacing:-.022em}h3{font-size:25px;line-height:1.35;letter-spacing:-.012em}h4{font-size:15px;line-height:1.5;font-weight:600}p+p{margin-top:18px}p{max-width:70ch}img{display:block;max-width:100%;height:auto}a{color:var(--steel);text-underline-offset:5px}button,input,
