<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1e9"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Venture Executive Network"><title>Venture Executive Network</title></head><body><script id="ven-bundle" type="application/json">{"revision":"Venture Executive Network v15.14","pages":{"clean/index.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Operational support for leadership teams | Venture Executive Network</title><meta name=\"description\" content=\"Focused peer groups, experienced advisors and personalized support for venture-backed leadership teams. Help to execute at venture speed and scale.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"hero-working-v156.css\">[[VEN_STYLE:hero-working-v156.css]]</style><style data-source=\"hero-alignment-v157.css\">[[VEN_STYLE:hero-alignment-v157.css]]</style><style data-source=\"pressure-hero-v158.css\">[[VEN_STYLE:pressure-hero-v158.css]]</style><style data-source=\"how-it-works-v1510.css\">[[VEN_STYLE:how-it-works-v1510.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality mai-study mai-home\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\" class=\"study-root\">\n<section class=\"study-hero\" data-theme=\"sand\" data-bg-fade=\"ivory\" aria-labelledby=\"hero-title\">\n <figure class=\"s-hero-media\"><img src=\"[[VEN_ASSET:ven-hero-working-group-v156.png]]\" alt=\"Illustrative image of startup leaders discussing their work with laptops and notes\" width=\"1672\" height=\"941\" fetchpriority=\"high\"><figcaption class=\"ven-hero-disclosure\">Illustrative image</figcaption></figure>\n <div class=\"study-hero-copy\">\n  <div class=\"hero-kicker\">\n  <p class=\"study-label\" data-reveal style=\"max-width:none!important\">For leadership teams at companies with $1M+ in venture funding · Worldwide</p>\n  </div>\n  <h1 id=\"hero-title\" data-reveal>Accepting venture money<br>raises expectations.</h1>\n  <p class=\"study-hero-lead\" data-reveal>An operational support community with focused peer groups, experienced advisors and personalized support to help you execute at venture speed and scale.</p>\n  <div class=\"study-hero-actions\" data-reveal><a class=\"study-cta\" href=\"apply.html?intent=individual\"><span>Can we help?</span><span class=\"study-cta-arrow\" aria-hidden=\"true\">↗</span></a><a class=\"study-link\" href=\"membership.html\">How it works <span aria-hidden=\"true\">→</span></a></div>\n </div>\n <a class=\"study-scroll\" href=\"#roles\" aria-label=\"Continue to the decisions by role\"><span aria-hidden=\"true\">↓</span></a>\n</section>\n\n<div class=\"study-nav-wrap\"><nav class=\"study-section-nav\" aria-label=\"Page sections\"><a href=\"#roles\" aria-current=\"true\">Roles</a><a href=\"#support\">Support</a><a href=\"#example\">Example</a><a href=\"#membership\">Participation</a></nav></div>\n\n<section class=\"study-section study-role-section\" id=\"roles\" data-theme=\"sage\" data-bg-fade=\"limestone\" aria-labelledby=\"roles-title\">\n <div class=\"study-centered\">\n  <p class=\"study-label\" data-reveal>By role</p>\n  <h2 id=\"roles-title\" data-reveal>Deliver on the company plan.</h2>\n  <p class=\"study-section-lead\" data-reveal>Get perspective on the trade-offs behind your team’s commitments.</p>\n </div>\n <div class=\"study-role-grid\" data-reveal>\n  <a href=\"role-ceo.html\"><span class=\"study-label\">Founders &amp; CEOs</span><span class=\"study-role-question\">Which commitments matter most to the next milestone?</span><span class=\"study-role-action\">See the decisions <span aria-hidden=\"true\">→</span></span></a>\n  <a href=\"role-finance.html\"><span class=\"study-label\">Finance</span><span class=\"study-role-question\">Which spending protects the next milestone?</span><span class=\"study-role-action\">See the decisions <span aria-hidden=\"true\">→</span></span></a>\n  <a href=\"role-product.html\"><span class=\"study-label\">Product &amp; technology</span><span class=\"study-role-question\">Ship the customer feature, or protect reliability first?</span><span class=\"study-role-action\">See the decisions <span aria-hidden=\"true\">→</span></span></a>\n </div>\n <div class=\"s-role-more\" data-reveal><span class=\"study-label\">Also</span><a href=\"role-sales.html\">Sales &amp; revenue</a><a href=\"role-marketing.html\">Marketing</a><a href=\"role-operations.html\">Operations</a><a href=\"role-people.html\">People leadership</a><a href=\"role-other.html\">Another leadership role</a><a class=\"s-role-all\" href=\"roles.html\">All roles <span aria-hidden=\"true\">→</span></a></div>\n</section>\n\n<section class=\"study-section study-support\" id=\"support\" data-theme=\"sand\" data-bg-fade=\"sage\" aria-labelledby=\"support-title\">\n <div class=\"study-centered\">\n  <p class=\"study-label\" data-reveal>How VEN supports you</p>\n  <h2 id=\"support-title\" data-reveal>Meet with purpose.</h2>\n  <p class=\"study-section-lead\" data-reveal>We meet in small groups and individual conversations to help you make better-informed decisions.</p>\n </div>\n \n <div class=\"s-pair\">\n  <div class=\"s-pair-col\" id=\"ven-partner-support\" data-reveal>\n   <p class=\"study-label\">Personalized support</p>\n   <h3>Built around your work.</h3>\n   <p>Your VEN Partner learns what you’re working on, helps arrange relevant connections and sessions, and follows up as your needs change.</p>\n   <p class=\"s-quiet\">Works alongside your board, coach or peer network.</p>\n   <a class=\"study-link\" href=\"membership.html#ven-partner\">Meet a VEN Partner <span aria-hidden=\"true\">→</span></a>\n  </div>\n  <div class=\"s-pair-col\" id=\"peer-learning\" data-reveal>\n   <p class=\"study-label\">Your peers</p>\n   <h3>Learn from what others have tried.</h3>\n   <p>Leaders from other companies and industries share what worked, what didn’t and what they would change.</p>\n   <p class=\"s-quiet\">Peer groups are matched to your company stage and the topic.</p>\n   <a class=\"study-link\" href=\"membership.html#formats\">How sessions work <span aria-hidden=\"true\">→</span></a>\n  </div>\n </div><figure class=\"study-wide-photo\" data-reveal><img src=\"[[VEN_ASSET:ven-peers-table-ivory-8359e856bd62a9d1.webp]]\" alt=\"Leaders in conversation around a walnut table\" width=\"1536\" height=\"864\" loading=\"lazy\"></figure>\n <p class=\"study-foundation\" data-reveal>Built on FounderNexus. For you and your leadership team. Each leader applies individually. <a href=\"team.html\">For your team <span aria-hidden=\"true\">→</span></a></p>\n</section>\n\n<section class=\"study-split study-section\" id=\"example\" data-theme=\"rose\" data-bg-fade=\"blush\" aria-labelledby=\"example-title\">\n <div class=\"study-split-copy\" data-reveal>\n  <p class=\"study-label\">Illustrative scenario · Sales &amp; revenue</p>\n  <h2 id=\"example-title\">Before the next sales hire.</h2>\n  <p>Find where deals stall before you add headcount.</p>\n  <a class=\"study-link s-split-link\" href=\"case-study.html\">Follow the decision <span aria-hidden=\"true\">→</span></a>\n </div>\n <figure class=\"study-decision-image\" data-reveal>\n  <div class=\"study-note\" aria-label=\"Illustration of a decision note, not a member result\">\n   <div class=\"study-note-top\"><span>The work in front of you</span><span aria-hidden=\"true\">↗</span></div>\n   <p class=\"study-note-title\">More people,<br>or a different problem?</p>\n   <div class=\"study-note-rule\"></div>\n   <div class=\"study-note-row\"><span class=\"study-note-number\">01</span><div><p class=\"study-note-label\">The challenge</p><p>Enterprise deals stall after the demo.</p></div></div>\n   <div class=\"study-note-row\"><span class=\"study-note-number\">02</span><div><p class=\"study-note-label\">Work it through</p><p>Find the gap in security review.</p></div></div>\n   <div class=\"study-note-row\"><span class=\"study-note-number\">03</span><div><p class=\"study-note-label\">Your next step</p><p>Name an owner before adding headcount.</p></div></div>\n   <div class=\"study-note-bottom\"><span>Illustrative scenario</span><span aria-hidden=\"true\">VEN</span></div>\n  </div>\n  <figcaption>An example of the work. The leader owns the decision.</figcaption>\n </figure>\n</section>\n\n<section class=\"study-section s-proof\" id=\"experience\" data-theme=\"rose\" data-bg-fade=\"mist\" aria-labelledby=\"proof-title\">\n <div class=\"study-centered\">\n  <p class=\"study-label\" data-reveal>The community</p>\n  <h2 id=\"proof-title\" data-reveal>People who’ve done the work.</h2>\n  <p class=\"study-section-lead\" data-reveal>Operational advisors bring relevant experience to discussions about what you’re working on.</p>\n </div>\n <div class=\"s-proof-grid\">\n  <div data-reveal>\n   <div class=\"study-advisor-image\">\n    <a href=\"experts.html#court\"><img src=\"[[VEN_ASSET:a2ebf63be3c5cd69913e.webp]]\" alt=\"Court Lorenzini\" width=\"2000\" height=\"1334\" loading=\"lazy\"><span>Court Lorenzini<small>Founding CEO, DocuSign</small></span></a>\n    <a href=\"experts.html#jordan\"><img src=\"[[VEN_ASSET:29e29213c277b5ec7c8f.webp]]\" alt=\"Jordan Tigani\" width=\"760\" height=\"760\" loading=\"lazy\"><span>Jordan Tigani<small>Founder &amp; CEO, MotherDuck</small></span></a>\n    <a href=\"experts.html#shareen\"><img src=\"[[VEN_ASSET:74818710371e103b7e10.webp]]\" alt=\"Shareen Corlett\" width=\"402\" height=\"399\" loading=\"lazy\"><span>Shareen Corlett<small>CPA · Principal, Clark Nuber</small></span></a>\n    <a href=\"experts.html#tak\"><img src=\"[[VEN_ASSET:0b0ad82428bc25a04cce.webp]]\" alt=\"Thach “Tak” Nguyen\" width=\"800\" height=\"800\" loading=\"lazy\"><span>Thach “Tak” Nguyen<small>Founder, Plenty Search</small></span></a>\n   </div>\n   <a class=\"study-link s-under\" href=\"experts.html\">Meet the advisors <span aria-hidden=\"true\">→</span></a>\n  </div>\n  <div data-reveal>\n   <figure class=\"study-video\"><video controls playsinline preload=\"none\" poster=\"[[VEN_ASSET:b79d4bed15e25fbafd03.jpg]]\" aria-label=\"Member experience: Gayathri Venkataraman\"><source src=\"[[VEN_ASSET:bfb09463781b99c9e23a.mp4]]\" type=\"video/mp4\"><track kind=\"captions\" src=\"[[VEN_ASSET:c2ca6b10c178573363bc.vtt]]\" srclang=\"en\" label=\"English\" default><p>Your browser cannot play this video.</p></video>\n   <figcaption>Gayathri Venkataraman, FounderNexus member, on deciding when to stay the course and when to adjust.</figcaption></figure>\n   <a class=\"study-link s-under\" href=\"member-experience.html\">Hear from FounderNexus members <span aria-hidden=\"true\">→</span></a>\n  </div>\n </div>\n \n</section>\n\n<section class=\"study-section study-membership\" id=\"membership\" data-theme=\"sand\" data-bg-fade=\"limestone\" aria-labelledby=\"membership-title\">\n <div class=\"study-centered\">\n  <p class=\"study-label\" data-reveal>Participation</p>\n  <h2 id=\"membership-title\" data-reveal>Group sessions are optional.</h2>\n  <p class=\"study-section-lead\" data-reveal>Choose discussions relevant to your current work.</p>\n </div>\n <dl class=\"study-facts study-facts--three\" data-reveal><div><dt>Membership</dt><dd>Individual; colleagues can join alongside you.</dd></div><div><dt>Partner check-in</dt><dd>Normally monthly, with flexible scheduling and touch bases as needed.</dd></div><div><dt>Pricing</dt><dd>Shared in the fit conversation, before you decide.</dd></div></dl>\n <p class=\"study-privacy\" data-reveal>Group recordings are available in the member portal for your stage and earlier stages, never publicly. <a href=\"membership.html#privacy\">Recording access</a> · <a href=\"membership.html#questions\">Common questions and trial</a></p>\n</section>\n\n<section class=\"study-section study-final\" id=\"next-step\" data-theme=\"sand\" data-bg-fade=\"ivory\" aria-labelledby=\"final-title\">\n <div class=\"study-centered\">\n  <p class=\"study-label\" data-reveal>Next step</p>\n  <h2 id=\"final-title\" data-reveal>Have an immediate challenge<br> we can help with?</h2>\n  <p class=\"study-section-lead\" data-reveal>Tell us what it is. No commitment. Eligible applications receive a personal reply within 24 hours.</p>\n  <div class=\"study-hero-actions\" data-reveal><a class=\"study-cta\" href=\"apply.html?intent=individual\"><span>Can we help?</span><span class=\"study-cta-arrow\" aria-hidden=\"true\">↗</span></a></div>\n  <p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p>\n </div>\n</section>\n</main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","study/site.js"],"title":"Operational support for leadership teams | Venture Executive Network"},"clean/membership.html":{"html":"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"/><meta content=\"width=device-width,initial-scale=1\" name=\"viewport\"/><meta content=\"#f4f1e9\" name=\"theme-color\"/><title>How it works | Venture Executive Network</title><meta name=\"description\" content=\"How VEN works: set your monthly focus, arrange relevant introductions and discussions, and review what helps. Group sessions are optional; eligible newcomers receive two free trial sessions.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"photo-preview.css\">[[VEN_STYLE:photo-preview.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"engagement-labels.css\">[[VEN_STYLE:engagement-labels.css]]</style><style data-source=\"engagement-controls.css\">[[VEN_STYLE:engagement-controls.css]]</style><style data-source=\"personal-support.css\">[[VEN_STYLE:personal-support.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"partner-support.css\">[[VEN_STYLE:partner-support.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"advisor-carousel.css\">[[VEN_STYLE:advisor-carousel.css]]</style><style data-source=\"hierarchy-v23.css\">[[VEN_STYLE:hierarchy-v23.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"how-it-works-v1510.css\">[[VEN_STYLE:how-it-works-v1510.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-membership v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a aria-label=\"VEN, Venture Executive Network home\" class=\"v-brand\" href=\"index.html\"><span aria-hidden=\"true\" class=\"v-brand-name v-brand-wordmark\">VEN</span></a><button aria-controls=\"v-primary-nav\" aria-expanded=\"false\" class=\"v-menu-toggle\" type=\"button\">Menu <span aria-hidden=\"true\">＋</span></button><nav aria-label=\"Main navigation\" class=\"v-nav\" id=\"v-primary-nav\"><div class=\"study-nav-main\"><a aria-current=\"page\" href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div aria-hidden=\"true\" class=\"study-atmosphere\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\">\n<section class=\"v-page-head c-membership-head\">\n <div class=\"v-wrap\"><div class=\"v-page-head-copy\">\n  <p class=\"v-eyebrow\">How it works</p>\n  <h1>Work through your current challenges.</h1>\n  <p class=\"v-lead\">Your VEN Partner helps connect you with peers and operational advisors around your work. You decide what to act on.</p>\n  <p class=\"hwi-qualification\">For companies with $1M+ in venture funding · Worldwide.</p>\n  <div class=\"v-actions\">\n   <a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? <span aria-hidden=\"true\">↗</span></a>\n   <a class=\"v-text-link\" href=\"#formats\">See the ways to engage <span aria-hidden=\"true\">→</span></a>\n  </div>\n </div></div>\n</section>\n<section class=\"v-section v-section--white c-how c-membership-work\" id=\"how-it-works\">\n <div class=\"v-wrap\">\n  <div class=\"c-section-heading\"><div><p class=\"v-eyebrow\">Working with your VEN Partner</p><h2>You set the agenda.</h2></div></div>\n  <div class=\"hwi-process-layout\">\n   <ol class=\"c-care\">\n    <li><span aria-hidden=\"true\">01</span><div><h3>Set your monthly focus.</h3><p>Bring your top two challenges, what you’ve tried and the constraints. Agree with your Partner where to start.</p></div></li>\n    <li><span aria-hidden=\"true\">02</span><div><h3>Bring in relevant experience.</h3><p>Your Partner helps arrange peer discussions, advisor input, 1:1 conversations or resources. Introductions include context for both sides.</p></div></li>\n    <li><span aria-hidden=\"true\">03</span><div><h3>Decide and revisit.</h3><p>You decide what to act on. Review with your Partner what helped and what support would be useful next.</p></div></li>\n   </ol>\n   <figure class=\"c-banner-photo hwi-process-photo\"><img alt=\"A Partner and a leader in conversation by a window\" class=\"\" loading=\"lazy\" height=\"1024\" src=\"[[VEN_ASSET:ven-partner-one-to-one-4f4f666f1a58bc4a.webp]]\" style=\"object-position:50% 20%\" width=\"1536\"/></figure>\n  </div>\n  <p class=\"s-mem-example\"><a class=\"v-text-link\" href=\"case-study.html\">See a decision example <span aria-hidden=\"true\">→</span></a></p>\n </div>\n</section>\n<section aria-labelledby=\"formats-title\" class=\"v-section v-section--white c-how\" id=\"formats\"><div class=\"v-wrap\"><div class=\"v25-formats-head\"><p class=\"v-eyebrow\">Ways to engage</p><h2 id=\"formats-title\">Introductions, discussions and 1:1s.</h2><p>Choose the format that fits the question.</p></div><div class=\"v12-engagement\" data-engagement-gallery=\"\"><div class=\"v12-engagement-layout\"><div class=\"v12-mode-panels\"><div aria-labelledby=\"mode-tab-introductions\" class=\"v12-mode-panel\" id=\"mode-panel-introductions\" role=\"tabpanel\" tabindex=\"0\"><figure><img alt=\"A notebook and coffee on a walnut table after a working conversation\" class=\"\" height=\"1024\" loading=\"lazy\" src=\"[[VEN_ASSET:ven-still-life-notebook-bcf666e15c171b75.webp]]\" style=\"object-position:50% 20%\" width=\"1536\"/></figure><div class=\"v12-mode-description\"><h3>Introductions</h3><p>Your Partner helps arrange an introduction around your question and the experience you need.</p></div></div><div aria-labelledby=\"mode-tab-peers\" class=\"v12-mode-panel\" hidden=\"\" id=\"mode-panel-peers\" role=\"tabpanel\" tabindex=\"0\"><figure><img alt=\"Leaders comparing notes around a table\" class=\"\" height=\"1024\" loading=\"lazy\" src=\"[[VEN_ASSET:ven-peers-session-6419815648de133c.webp]]\" style=\"object-position:50% 40%\" width=\"1536\"/></figure><div class=\"v12-mode-description\"><h3>Peer discussions</h3><p>Compare how leaders at other companies handled a similar problem and what they would change.</p></div></div><div aria-labelledby=\"mode-tab-experts\" class=\"v12-mode-panel\" hidden=\"\" id=\"mode-panel-experts\" role=\"tabpanel\" tabindex=\"0\"><figure><img alt=\"Gururaj Pandurangi and participants at a FounderNexus session\" class=\"ven-photo--daylight-session\" height=\"1670\" loading=\"lazy\" src=\"[[VEN_ASSET:38d3dce2765789b90ad6.jpg]]\" style=\"object-position:50% 20%\" width=\"2224\"/></figure><div class=\"v12-mode-description\"><h3>Advisor discussions</h3><p>Discuss your work with an operational advisor whose experience fits the topic.</p></div></div><div aria-labelledby=\"mode-tab-one-to-one\" class=\"v12-mode-panel\" hidden=\"\" id=\"mode-panel-one-to-one\" role=\"tabpanel\" tabindex=\"0\"><figure><img alt=\"Two people working together at a FounderNexus gathering\" class=\"ven-photo--conversation\" height=\"2391\" loading=\"lazy\" src=\"[[VEN_ASSET:333d78cc6fb1e80f666f.jpg]]\" style=\"object-position:50% 40%\" width=\"1800\"/></figure><div class=\"v12-mode-description\"><h3>1:1 conversations</h3><p>Work through the detail with one peer or operational advisor.</p></div></div></div><div class=\"v12-mode-controls\"><p class=\"v12-mode-prompt\" id=\"mode-choice-prompt\">Select a way to engage</p><div aria-describedby=\"mode-choice-prompt\" aria-label=\"How members engage\" aria-orientation=\"vertical\" role=\"tablist\"><button aria-controls=\"mode-panel-introductions\" aria-selected=\"true\" data-mode=\"introductions\" id=\"mode-tab-introductions\" role=\"tab\" tabindex=\"0\" type=\"button\"><span>Introductions</span><span aria-hidden=\"true\" class=\"v12-mode-arrow\"><span class=\"v12-mode-open\">→</span><span class=\"v12-mode-check\">✓</span></span></button><button aria-controls=\"mode-panel-peers\" aria-selected=\"false\" data-mode=\"peers\" id=\"mode-tab-peers\" role=\"tab\" tabindex=\"-1\" type=\"button\"><span>Peer discussions</span><span aria-hidden=\"true\" class=\"v12-mode-arrow\"><span class=\"v12-mode-open\">→</span><span class=\"v12-mode-check\">✓</span></span></button><button aria-controls=\"mode-panel-experts\" aria-selected=\"false\" data-mode=\"experts\" id=\"mode-tab-experts\" role=\"tab\" tabindex=\"-1\" type=\"button\"><span>Advisor discussions</span><span aria-hidden=\"true\" class=\"v12-mode-arrow\"><span class=\"v12-mode-open\">→</span><span class=\"v12-mode-check\">✓</span></span></button><button aria-controls=\"mode-panel-one-to-one\" aria-selected=\"false\" data-mode=\"one-to-one\" id=\"mode-tab-one-to-one\" role=\"tab\" tabindex=\"-1\" type=\"button\"><span>1:1 conversations</span><span aria-hidden=\"true\" class=\"v12-mode-arrow\"><span class=\"v12-mode-open\">→</span><span class=\"v12-mode-check\">✓</span></span></button></div></div></div></div><p class=\"hwi-format-note\">Introductions depend on fit and availability.</p><section aria-labelledby=\"partner-spotlight-title\" class=\"v15-partner-spotlight\" id=\"ven-partner\"><h3 id=\"partner-spotlight-title\">Meet a VEN Partner</h3><article class=\"v15-partner-profile v15-partner-profile--portrait s-partner-right\" data-partner-profile=\"karin-klemencic\"><div><h4>Karin Klemencic</h4><p class=\"v15-partner-context\">One of several VEN Partners.</p><p class=\"v15-partner-bio\">15+ years in strategic operations, including Chief of Staff at Boehringer Ingelheim.</p><a class=\"v-text-link\" href=\"apply.html?intent=individual\">Can we help? <span aria-hidden=\"true\">→</span></a></div><figure class=\"v28-partner-portrait\"><img alt=\"Karin Klemencic\" height=\"480\" loading=\"lazy\" src=\"[[VEN_ASSET:ven-partner-karin-klemencic-d640fcc2d0547fba.webp]]\" width=\"480\"/></figure></article></section></div></section>\n<section aria-labelledby=\"participation-title\" class=\"v-section v-section--white c-how hwi-participation\" id=\"fit\">\n <div class=\"v-wrap\">\n  <div class=\"s-fit-head\"><p class=\"v-eyebrow\">Participation</p><h2 id=\"participation-title\">Participation at a glance.</h2></div>\n  <dl class=\"s-fit-facts s-fit-facts--3\" id=\"participation\">\n   <div><dt>Who</dt><dd>CEOs and functional leaders at venture-backed companies</dd></div>\n   <div><dt>Company funding</dt><dd>At least $1M in venture funding</dd></div>\n   <div><dt>Location</dt><dd>Worldwide</dd></div>\n   <div><dt>Participation</dt><dd>Join individually or with colleagues. Each leader has their own Partner.</dd></div>\n   <div><dt>Time</dt><dd>A few hours a month, depending on need. Normally monthly Partner check-ins, plus touch bases as needed.</dd></div>\n   <div><dt>Trial</dt><dd>Two free sessions for each eligible newcomer</dd></div>\n  </dl>\n  <p class=\"hwi-pricing\">Pricing and terms are discussed in the fit conversation, before you decide.</p>\n </div>\n</section>\n<section aria-labelledby=\"recordings-title\" class=\"v-section v-section--white c-how hwi-recordings\" id=\"privacy\">\n <div class=\"v-wrap\"><div class=\"hwi-recordings-layout\">\n  <div><p class=\"v-eyebrow\">Privacy and recordings</p><h3 id=\"recordings-title\">Participation and recordings.</h3></div>\n  <div class=\"hwi-recordings-copy\">\n   <p>Group sessions are recorded. Members can access recordings for their company stage and earlier stages through the member portal. Recordings are never public.</p>\n   <p><strong>Private 1:1 conversations.</strong> Ask about recording and access before participating.</p>\n  </div>\n </div></div>\n</section>\n<section aria-labelledby=\"questions-title\" class=\"v-section v-section--white c-how s-mem-questions\" id=\"questions\"><div class=\"v-wrap\"><div class=\"s-q-grid\"><div class=\"s-q-head\"><p class=\"v-eyebrow\">Practical questions</p><h2 id=\"questions-title\">Before you decide.</h2><p>Sessions, the free trial, who you’ll meet and what happens after.</p></div><div class=\"v-faq\"><details><summary>What is a session?</summary><p>Usually a 60-minute discussion on one topic: a small peer group or a 1:1 with a peer or operational advisor.</p></details><details><summary>What is the trial, and is it free?</summary><p>Yes. Each eligible newcomer receives two free sessions, with timing agreed individually.</p></details><details><summary>Who will I meet?</summary><p>Peer groups bring together members at your company stage around a specific topic. Operational advisors join where their experience is relevant.</p></details><details><summary>How is my Partner chosen?</summary><p>We match you by company stage. Your Partner learns what you’re working on and helps arrange relevant people, sessions and resources.</p></details><details><summary>Why peers from other industries?</summary><p>Leaders in other industries may have faced the same hiring, growth or delivery problem. Their approaches can help you test your assumptions.</p></details><details><summary>What happens after the trial?</summary><p>If it fits, you choose monthly or annual membership. Pricing and terms come in the fit conversation, before you decide.</p></details><details><summary>Who pays?</summary><p>You decide whether to pay personally or through your company. Each leader holds their own membership; there is no team or group billing.</p></details><details><summary>What if we haven’t raised $1M yet?</summary><p>You can apply for future consideration. VEN is for companies that have raised at least $1M in venture funding.</p></details></div></div></div></section>\n<section class=\"v-invitation v-section--coral\">\n <div class=\"v-wrap\"><div>\n  <p class=\"v-eyebrow\">Fit goes both ways</p>\n  <h2>Have an immediate challenge we can help with?</h2>\n  <p>Share one current challenge. Applying carries no commitment. Eligible applications receive a personal reply within 24 hours.</p>\n  <p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p>\n </div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div>\n</section>\n</main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a aria-label=\"VEN, Venture Executive Network home\" class=\"v-brand\" href=\"index.html\"><span aria-hidden=\"true\" class=\"v-brand-name v-brand-wordmark\">VEN</span></a><p>Venture Executive Network.<br/>Hard calls. Good company.</p></div><nav aria-label=\"Footer\" class=\"s-footer-nav\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"How it works | Venture Executive Network"},"clean/roles.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Support by leadership role | Venture Executive Network</title><meta name=\"description\" content=\"Different roles contribute to the company plan in different ways. Find relevant experience for the decisions and commitments in yours.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-roles v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\" aria-current=\"page\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"v-page-head\"><div class=\"v-wrap\"><div class=\"v-page-head-copy\"><p class=\"v-eyebrow\">By role · For venture-backed leaders</p><h1>Start with the role you hold.</h1><p class=\"v-lead\">Each role page shows the decisions VEN is built for. If you cover several, start with the most urgent.</p><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide. <a href=\"membership.html#privacy\">Participation and recording access →</a></p><a class=\"v-text-link v12-team-crosslink\" href=\"team.html\">Introducing colleagues? <span aria-hidden=\"true\">→</span></a></div></div></section><section class=\"v-section v-section--white v-role-directory-opening\"><div class=\"v-wrap\"><div class=\"h-directory-layout\"><figure class=\"h-directory-photo v11-role-directory-photo\"><img src=\"[[VEN_ASSET:ven-roles-plan-45040714e74ef5ee.webp]]\" alt=\"Two leaders working through a plan at a walnut table\" width=\"960\" height=\"1280\" loading=\"lazy\"></figure><div><nav class=\"v-role-directory\" aria-label=\"Explore support by role\"><a class=\"v-role-entry\" href=\"role-ceo.html\"><div><h3>Founders &amp; CEOs</h3><p>Which commitments to fund, staff or stop before the next milestone.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-sales.html\"><div><h3>Sales &amp; revenue</h3><p>Sales capacity, conversion and a forecast you can explain.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-marketing.html\"><div><h3>Marketing</h3><p>Positioning, channel investment and demand that reaches sales.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-finance.html\"><div><h3>Finance</h3><p>Runway, hiring and spend, and what the plan costs to reach.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-product.html\"><div><h3>Product &amp; technology</h3><p>Customer commitments, product reliability and the roadmap.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-operations.html\"><div><h3>Operations</h3><p>Who owns what, and whether delivery holds as volume grows.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-people.html\"><div><h3>People leadership</h3><p>Which leaders to hire, how ownership shifts and who you keep.</p></div><span aria-hidden=\"true\">↗</span></a><a class=\"v-role-entry\" href=\"role-other.html\"><div><h3>Another leadership role</h3><p>Customer success, strategy, specialist functions and combined responsibilities.</p></div><span aria-hidden=\"true\">↗</span></a></nav><p class=\"v-note\">These roles are starting points. Your responsibilities may span more than one.</p></div></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Bring your own challenges.</h2><p>Share your role and one current challenge. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Support by leadership role | Venture Executive Network"},"clean/team.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>For your company | Venture Executive Network</title><meta name=\"description\" content=\"Introduce a colleague to VEN without joining yourself. Each leader applies individually and brings relevant peer and advisor experience back to the company’s plan.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"photo-finish.css\">[[VEN_STYLE:photo-finish.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"team-connections.css\">[[VEN_STYLE:team-connections.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style><style data-source=\"team-v1513.css\">[[VEN_STYLE:team-v1513.css]]</style><style data-source=\"team-v1514.css\">[[VEN_STYLE:team-v1514.css]]</style></head><body class=\"hospitality v10 v-page-team v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\" aria-current=\"page\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"v-page-head v-page-head--photo\"><div class=\"v-wrap\"><div class=\"v-page-head-copy\"><p class=\"v-eyebrow\">For CEOs exploring support for their team</p><h1>Help your leaders with the decisions they own.</h1><p class=\"v-lead\">Introduce a colleague who could use relevant peer and advisor experience. You don’t have to join yourself.</p><a class=\"v-text-link\" href=\"team.html#introduce\">Introduce a leader <span aria-hidden=\"true\">→</span></a><a class=\"v-text-link v12-team-personal-link\" href=\"role-ceo.html\">Support for your own role <span aria-hidden=\"true\">→</span></a></div><figure class=\"v-page-head-image\"><img class=\"ven-photo--speaker-frame\" src=\"[[VEN_ASSET:ven-peers-session-6419815648de133c.webp]]\" alt=\"Leaders comparing notes around a table\" width=\"1536\" height=\"1024\" fetchpriority=\"high\"></figure></div></section><section class=\"v-section v-section--mist v-working-section\" id=\"connected-decisions\"><div class=\"v-wrap\"><div class=\"v-section-heading\"><p class=\"v-eyebrow\">How it connects</p><h2>Different decisions. One company plan.</h2><p class=\"v-lead\">Each leader faces different challenges. VEN helps them draw on relevant experience for the work they own.</p></div><div class=\"v-contribution-path\"><p class=\"v-connection-label\">Individual decisions</p><div class=\"v-team-flow\"><article><h3>Sales &amp; revenue</h3><p>Which deals need attention to hit our target?</p></article><article><h3>Marketing</h3><p>Which channels bring buyers who actually convert?</p></article><article><h3>Product &amp; technology</h3><p>Ship the customer feature, or fix reliability first?</p></article><article><h3>Finance</h3><p>What can we fund without shortening our runway?</p></article><article><h3>Operations</h3><p>Where is delivery breaking down as demand grows?</p></article><article><h3>People leadership</h3><p>Hire a leader, or change who owns the work?</p></article></div><div class=\"v-company-objective\"><p class=\"v-eyebrow\">A shared company plan</p><h3>Deliver the company’s commitments.</h3><p>Example questions. Each leader owns their decisions and execution.</p></div></div><div class=\"v-company-concept-link\"><a class=\"v-text-link\" href=\"equation.html\">See how one decision carries forward <span aria-hidden=\"true\">→</span></a></div></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"v-columns\"><div><div class=\"v-section-heading\"><p class=\"v-eyebrow\">One member at a time</p><h2>Each leader joins individually.</h2></div><p>Each member has their own VEN Partner and brings their own challenges. Eligible newcomers receive two free trial sessions.</p><p><a class=\"v-text-link\" href=\"membership.html#participation\">Participation and trial details <span aria-hidden=\"true\">→</span></a></p></div><aside class=\"v-column-aside\"><p class=\"v-eyebrow\">Before bringing others in</p><h3>Start with the decision they need to make.</h3><p>Name the leader, the call they own and the company goal it affects.</p><p><a class=\"v-text-link\" href=\"roles.html\">Find support by role <span aria-hidden=\"true\">→</span></a></p></aside></div><div class=\"v-faq\"><details><summary>Who pays when a colleague joins?</summary><p>Each colleague holds their own membership and decides how to pay, personally or through the company. There is no team plan. Terms come in the fit conversation.</p></details><details><summary>Do we have to enroll the whole team?</summary><p>No. Introduce one leader or several. Each applies individually.</p></details><details><summary>Do colleagues need to bring the same challenges?</summary><p>No. Each member works on their own challenges, informed by the company’s plan.</p></details></div><details class=\"v-faq v-sponsor\" id=\"introduce\"><summary>A note to introduce a colleague</summary><div id=\"sponsor-note\" class=\"v-reading\"><p>I’d like to introduce [leader or role] to VEN. They’re working through [current challenge], which affects [company priority].</p><p>Could they apply? VEN reviews each application before any conversation.</p></div><div class=\"v-actions\"><button class=\"v-button v-button--secondary\" type=\"button\" disabled id=\"copy-sponsor\">Copy conversation starter</button><button class=\"v-button v-button--secondary\" type=\"button\" disabled id=\"print-overview\">Print this overview</button></div><p id=\"copy-status\" class=\"v-note\" role=\"status\"></p></details></div></section><section class=\"c-evidence-links v-section--white\"><div class=\"v-wrap\"><p>Meet the advisors and hear from FounderNexus members.</p><div><a class=\"v-text-link\" href=\"experts.html\">Our operational advisors <span aria-hidden=\"true\">→</span></a><a class=\"v-text-link\" href=\"member-experience.html\">Member experience <span aria-hidden=\"true\">→</span></a></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Who should go first?</h2><p>Start with yourself, or introduce the leader whose decision can’t wait. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? <span aria-hidden=\"true\">↗</span></a><a class=\"v-text-link\" href=\"team.html#introduce\">Introduce a colleague <span aria-hidden=\"true\">→</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"For your company | Venture Executive Network"},"clean/story.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Our story | Venture Executive Network</title><meta name=\"description\" content=\"VE tyle></head><body class=\"hospitality v10 v-page-story v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\" aria-current=\"page\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"v-page-head v11-story-head\"><div class=\"v-wrap\"><div class=\"v-page-head-copy\"><p class=\"v-eyebrow\">Our story</p><h1>From founder conversations<br>to leadership teams.</h1><p class=\"v-lead\">FounderNexus members wanted the same peer experience for the people leading their companies. VEN grew from that request.</p></div><figure class=\"v11-story-community\"><img src=\"[[VEN_ASSET:a56689193fabe974f5b8.jpg]]\" alt=\"FounderNexus community members together after a session\" width=\"2163\" height=\"1453\" class=\"v13-photo-community ven-photo--community s-story-photo\" fetchpriority=\"high\"><figcaption class=\"s-story-caption\">FounderNexus members after a session.</figcaption></figure></div></section><section class=\"v-section v-section--white v11-story-roots\" id=\"story-roots\"><div class=\"v-wrap\"><div class=\"v-history h10-history\"><article class=\"v-history-entry\"><p class=\"v-eyebrow\">Built on FounderNexus</p><h3>Experience is worth sharing.</h3><div><p>Court Lorenzini, founding CEO of DocuSign, helped start FounderNexus: founders sharing the experience behind their decisions.</p></div></article></div></div></section><section class=\"v-section v-section--mist\"><div class=\"v-wrap\"><div class=\"v-story-purpose\"><div class=\"v-section-heading\"><p class=\"v-eyebrow\">Why we’re here</p><h2>Why VEN starts with the individual.</h2></div><p>The company plan is shared, but each leader faces different calls. Members bring their own work and use the input with their team.</p><p class=\"v-mission\"><strong>Our mission</strong><br>Help leadership teams of venture-backed companies make better-informed decisions and deliver on their company plans.</p></div></div></section><section class=\"c-evidence-links v-section--white\"><div class=\"v-wrap\"><p>Meet the advisors and hear from FounderNexus members.</p><div><a class=\"v-text-link\" href=\"experts.html\">Our operational advisors <span aria-hidden=\"true\">→</span></a><a class=\"v-text-link\" href=\"member-experience.html\">Member experience <span aria-hidden=\"true\">→</span></a></div></div></section><section class=\"v-section v25-marks\"><div class=\"v-wrap c-community-marks\"><p class=\"v-note\">Companies represented in the FounderNexus community</p><div class=\"h-company-marks\"><img src=\"[[VEN_ASSET:b66906af458d1ad51489.svg]]\" alt=\"ConversionMagic\" loading=\"lazy\"><img src=\"[[VEN_ASSET:c03e61bf4e5b8705e433.webp]]\" alt=\"Identient\" loading=\"lazy\" width=\"250\" height=\"62\"><img src=\"[[VEN_ASSET:28803e3ad69e4363b196.svg]]\" alt=\"Payscore\" loading=\"lazy\"><img src=\"[[VEN_ASSET:3532bf31ccd1067fa87b.png]]\" alt=\"ARY Engineering\" loading=\"lazy\" width=\"2234\" height=\"892\"><img src=\"[[VEN_ASSET:a9e658535753692394e2.svg]]\" alt=\"SDF Labs\" loading=\"lazy\" width=\"688\" height=\"200\"><img src=\"[[VEN_ASSET:1946d5e9ab0fa9c05e80.png]]\" alt=\"Wild Zebra\" loading=\"lazy\" width=\"260\" height=\"43\"></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Bring the work you’re responsible for.</h2><p>Share your role and one current challenge. No commitment. Eligible applications receive a personal reply within 24 hours.</p><p class=\"v-close-fit\">For companies that have raised at least $1M in venture funding.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help? <span aria-hidden=\"true\">↗</span></a><a class=\"v-text-link\" href=\"membership.html\">How it works <span aria-hidden=\"true\">→</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a>< \"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"v-page-head v-page-head--photo\"><div class=\"v-wrap\"><div class=\"v-page-head-copy\"><p class=\"v-eyebrow\">Contribute to VEN · For advisors</p><h1>You’ve made these calls before.<br>Help someone making them now.</h1><p class=\"v-lead\">Share your experience with venture-backed leaders working through decisions you know.</p><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=advisor\">Start an advisor conversation <span aria-hidden=\"true\">↗</span></a></div></div><figure class=\"v-page-head-image\"><img src=\"[[VEN_ASSET:ven-still-life-notebook-bcf666e15c171b75.webp]]\" alt=\"A notebook and coffee on a walnut table after a working conversation\" width=\"1536\" height=\"1024\" fetchpriority=\"high\"></figure></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"v-section-heading\"><p class=\"v-eyebrow\">Built on FounderNexus</p><h2>Who you would work with.</h2></div><div class=\"v-reading\"><p>CEOs and functional leaders at venture-backed companies.</p></div></div></section><section class=\"v-section v-section--mist v-working-section\"><div class=\"v-wrap\"><div class=\"v-section-heading\"><p class=\"v-eyebrow\">Fit first</p><h2>Start with the decisions you know.</h2><p class=\"v-lead\">Tell us the roles, company stages and decisions you know best. The member’s VEN Partner helps arrange relevant participation.</p></div><dl class=\"v-fit-facts\"><div><dt>Member company funding</dt><dd>At least $1M in venture funding</dd></div><div><dt>Leaders</dt><dd>CEOs and senior leaders across functions</dd></div><div><dt>Location</dt><dd>Worldwide</dd></div></dl></div></section><section class=\"v-section\"><div class=\"v-wrap\"><div class=\"v-section-heading\"><p class=\"v-eyebrow\">Proposed starting points</p><h2>Work around a real decision.</h2></div><div class=\"v-participation\"><div class=\"v-participation-item\"><h3>Talk through a decision</h3><p>Compare options on a challenge you know.</p></div><div class=\"v-participation-item\"><h3>Share an approach</h3><p>Offer a practical framework or worked example.</p></div><div class=\"v-participation-item\"><h3>Explore a topic session</h3><p>Focus on a question members have in common.</p></div></div><p class=\"v-note\">Scope, availability and expectations are agreed before any introduction.</p><div class=\"v-faq\"><details><summary>Do I need to be part of a firm?</summary><p>No. Independent operators and specialists can contribute relevant experience.</p></details><details><summary>What would participation involve?</summary><p>We agree the topic, format and availability first. An inquiry carries no commitment; contributing is separate from membership.</p></details></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>Where could your experience help?</h2><p>Tell us where your experience is relevant and which decisions you’ve worked through. A sentence or two is enough; we reply within 24 hours.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=advisor\">Start an advisor conversation <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a estion your portfolio keeps hitting. We agree who should be in the room and who from your network can speak to it.</p></div><div class=\"v-participation-item\"><h3>Connect operating experience</h3><p>Put forward an operator or specialist who wants to contribute.</p></div></div><p class=\"v-note\">Scope, responsibilities and terms are agreed up front.</p></div></section><section class=\"v-section\"><div class=\"v-wrap\"><div class=\"v-section-heading\"><p class=\"v-eyebrow\">A practical first conversation</p><h2>Start with your portfolio’s work.</h2></div><div class=\"v-faq\"><details><summary>What should we bring to the conversation?</summary><p>The roles, stages and challenges where outside experience would help. No sensitive company details needed.</p></details><details><summary>Does an introduction commit a leader?</summary><p>No. Each leader decides individually. Eligible newcomers receive two free sessions.</p></details><details><summary>What arrangements need to be agreed?</summary><p>Formats, availability, referral arrangements and commercial terms. <a href=\"membership.html#privacy\">See the member recording-access rules.</a></p></details></div></div></section><section class=\"v-invitation v-section--coral\"><div class=\"v-wrap\"><div><p class=\"v-eyebrow\">Next step</p><h2>What are your portfolio leaders working through?</h2><p>Tell us which leaders and which decisions. We reply within 24 hours with where to start.</p></div><div class=\"v-actions\"><a class=\"v-button v-button--primary\" href=\"partner-inquiry.html?type=vc\">Start a venture firm conversation <span aria-hidden=\"true\">↗</span></a></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","study/site.js"],"title":"Partner as a venture firm | Venture Executive Network"},"clean/apply.html":{"html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#f4f1e9\"><title>Apply | Venture Executive Network</title><meta name=\"description\" content=\"Apply to VEN: tell us the challenge. For leadership teams at companies that have raised at least $1M in venture funding.\"><style data-source=\"pathways/hospitality.css\">[[VEN_STYLE:pathways/hospitality.css]]</style><style data-source=\"pathways/v9-additions.css\">[[VEN_STYLE:pathways/v9-additions.css]]</style><style data-source=\"pathways/v10-additions.css\">[[VEN_STYLE:pathways/v10-additions.css]]</style><style data-source=\"pathways/v11-additions.css\">[[VEN_STYLE:pathways/v11-additions.css]]</style><style data-source=\"pathways/v12-additions.css\">[[VEN_STYLE:pathways/v12-additions.css]]</style><style data-source=\"care-clarity.css\">[[VEN_STYLE:care-clarity.css]]</style><style data-source=\"ven-wordmark.css\">[[VEN_STYLE:ven-wordmark.css]]</style><style data-source=\"navigation-readability.css\">[[VEN_STYLE:navigation-readability.css]]</style><style data-source=\"executive-clarity.css\">[[VEN_STYLE:executive-clarity.css]]</style><style data-source=\"venture-speed.css\">[[VEN_STYLE:venture-speed.css]]</style><style data-source=\"clear-participation.css\">[[VEN_STYLE:clear-participation.css]]</style><style data-source=\"hierarchy-v24.css\">[[VEN_STYLE:hierarchy-v24.css]]</style><style data-source=\"partner-peers-v25.css\">[[VEN_STYLE:partner-peers-v25.css]]</style><style data-source=\"premium-v27.css\">[[VEN_STYLE:premium-v27.css]]</style><style data-source=\"owner-v28.css\">[[VEN_STYLE:owner-v28.css]]</style><style data-source=\"mai-study.css\">[[VEN_STYLE:mai-study.css]]</style><style data-source=\"study-v140.css\">[[VEN_STYLE:study-v140.css]]</style><style data-source=\"community-v154.css\">[[VEN_STYLE:community-v154.css]]</style><style data-source=\"spacing-v1512.css\">[[VEN_STYLE:spacing-v1512.css]]</style></head><body class=\"hospitality v10 v-page-apply v11 v12 c126 mai-study mai-interior\"><a class=\"v-skip\" href=\"#main\">Skip to content</a><header class=\"v-header\"><div class=\"v-wrap v-header-inner\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><button class=\"v-menu-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"v-primary-nav\">Menu <span aria-hidden=\"true\">＋</span></button><nav class=\"v-nav\" id=\"v-primary-nav\" aria-label=\"Main navigation\"><div class=\"study-nav-main\"><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a></div><div class=\"study-nav-actions\"><a class=\"v-button v-button--secondary v-login\" href=\"https://platform.foundernexus.com/member-login\">Log in</a><a class=\"v-button v-button--primary\" href=\"apply.html?intent=individual\">Can we help?</a></div></nav></div></header><div class=\"study-atmosphere\" aria-hidden=\"true\"><div class=\"study-wash study-wash--sand\"></div><div class=\"study-wash study-wash--sage\"></div><div class=\"study-wash study-wash--rose\"></div><div class=\"study-grain\"></div></div><main id=\"main\" tabindex=\"-1\"><section class=\"v-page-head\"><div class=\"v-wrap\"><div class=\"v-page-head-copy\"><p class=\"v-eyebrow\">Apply · For venture-backed leadership teams</p><h1>Tell us about the challenge.</h1><p class=\"v-lead\">VEN is for leadership teams at companies that have raised at least $1M in venture funding.</p><p class=\"v-note\">Below $1M? You can still apply for future consideration.</p></div></div></section><section class=\"v-section v-section--white\"><div class=\"v-wrap\"><div class=\"v-columns\"><section class=\"v-form\"><p class=\"v-demo-notice v-demo-flag\" role=\"note\"><strong>Demo only.</strong> Review the flow; no details will be sent.</p><p class=\"v-apply-how\">Every application is reviewed by a person. If your company is at the funding threshold, you’ll hear from us within 24 hours. No commitment.</p><form id=\"membership-form\" data-inquiry-form hidden><p class=\"v-note\">Required unless marked optional.</p><div class=\"v-fields-two\"><div class=\"v-field\"><label for=\"name\">Your name</label><input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" required maxlength=\"160\"></div><div class=\"v-field\"><label for=\"email\">Work email</label><input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required maxlength=\"160\"></div><div class=\"v-field\"><label for=\"company\">Company</label><input id=\"company\" name=\"company\" type=\"text\" autocomplete=\"organization\" required maxlength=\"160\"></div><div class=\"v-field\"><label for=\"role\">Your role</label><select id=\"role\" name=\"role\" required><option value=\"\">Choose your role</option><option>Founders &amp; CEOs</option><option>Sales &amp; revenue</option><option>Marketing</option><option>Finance</option><option>Product &amp; technology</option><option>Operations</option><option>People leadership</option><option>Another leadership role</option></select></div></div><div class=\"v-field\" data-website-field hidden><label for=\"website\">Company website</label><input id=\"website\" name=\"website\" type=\"text\" inputmode=\"url\" autocomplete=\"url\" maxlength=\"200\" placeholder=\"company.com\"><small>Needed because the email address isn’t a company domain.</small></div><fieldset class=\"v-intent v-funding\"><legend>Has your company raised at least $1M in venture funding?</legend><label><input type=\"radio\" name=\"funding\" value=\"Yes\" required> Yes</label><label><input type=\"radio\" name=\"funding\" value=\"Not yet\"> Not yet</label><label><input type=\"radio\" name=\"funding\" value=\"Not sure\"> Not sure</label></fieldset><p class=\"v-inline-note\" data-funding-note=\"Not yet\" hidden>VEN is for companies with $1M+ in venture funding. You can apply for future consideration.</p><p class=\"v-inline-note\" data-funding-note=\"Not sure\" hidden>That’s fine. We’ll check.</p><div class=\"v-field\" data-stage-field hidden><label for=\"stage\">Latest round <span>(optional)</span></label><select id=\"stage\" name=\"stage\"><option value=\"\">Choose a round</option><option>Pre-seed / Seed</option><option>Series A</option><option>Series B / C</option><option>Series D+</option></select></div><div class=\"v-field\"><label for=\"priority\">What challenge can we help with?</label><textarea id=\"priority\" name=\"priority\" required maxlength=\"500\" rows=\"3\" aria-describedby=\"priority-hint\"></textarea><small id=\"priority-hint\">A few lines is enough.</small></div><div class=\"v-field\"><label for=\"referrer\">Referred by a colleague? <span>(optional)</span></label><input id=\"referrer\" name=\"referrer\" type=\"text\" maxlength=\"160\" placeholder=\"Their name\"></div><label class=\"v-check\"><input type=\"checkbox\" name=\"updates\" value=\"Yes\"> Email me occasional VEN updates. <span>You’ll confirm by email; unsubscribe any time.</span></label><p class=\"v-assure\">A brief description is enough. Please leave sensitive company information out of this application.</p><button class=\"v-button v-button--primary\" type=\"submit\">Review my application <span aria-hidden=\"true\">↗</span></button></form><section id=\"request-review\" class=\"v-form-review\" hidden aria-labelledby=\"review-title\"><p class=\"v-eyebrow\">Your application</p><h2 id=\"review-title\" tabindex=\"-1\">Review your application.</h2><dl id=\"request-summary\" class=\"v-form-summary\"></dl><p class=\"v-demo-notice v-demo-flag\" data-send-note><strong>Demo only.</strong> Check the details above; nothing will be sent.</p><div class=\"v-actions\" data-send-actions><button class=\"v-button v-button--primary\" type=\"button\" data-send-inquiry>Preview confirmation</button><button class=\"v-button v-button--secondary\" type=\"button\" data-edit-request>Edit details</button><button class=\"v-button v-button--secondary\" type=\"button\" data-clear-request>Clear entries</button></div><div class=\"v28-sent\" data-inquiry-sent hidden tabindex=\"-1\" role=\"status\"><p class=\"v-eyebrow\">Demo · Nothing was sent</p><h3 data-sent-title>Demo complete. Nothing was sent.</h3><p data-sent-body>On the live site, a person would review your application before a conversation.</p><p class=\"v-note\">Nothing was sent or stored. Edit or clear your details to run the demo again.</p></div></section><noscript><p>This application needs JavaScript. You can still read how VEN works and explore the rest of the site.</p><a class=\"v-text-link\" href=\"membership.html\">How it works <span aria-hidden=\"true\">→</span></a></noscript></section><aside class=\"v-inquiry-aside\"><p class=\"v-eyebrow\">What happens next</p><h2>A short review, then a conversation if it fits.</h2><ol class=\"v-process\"><li><strong>You apply</strong><p>On the live site, submit a short application for VEN to review.</p></li><li><strong>A person reviews it</strong><p>Within 24 hours for companies at the funding threshold. If something is unclear, we ask one question.</p></li><li><strong>A conversation, if it fits</strong><p>Discuss your challenge and how you’d participate with a VEN Partner. Eligible newcomers receive two free trial sessions.</p></li></ol><div class=\"v-inquiry-next\"><h3>When your company qualifies</h3><p>Apply again with the same email for review.</p></div><p class=\"v-note\">Companies with $1M+ in venture funding · Worldwide</p></aside></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span class=\"v-brand-name v-brand-wordmark\" aria-hidden=\"true\">VEN</span></a><p>Venture Executive Network.<br>Hard calls. Good company.</p></div><nav class=\"s-footer-nav\" aria-label=\"Footer\"><div><p>Community</p><a href=\"membership.html\">How it works</a><a href=\"roles.html\">By role</a><a href=\"team.html\">For your team</a><a href=\"case-study.html\">Decision example</a><a href=\"equation.html\">Decision approach</a></div><div><p>Network</p><a href=\"experts.html\">Advisors</a><a href=\"story.html\">Our story</a><a href=\"advisors.html\">For advisors</a><a href=\"venture-partners.html\">For venture firms</a></div><div><p>Explore</p><a href=\"events.html\">Sessions</a><a href=\"blog.html\">Blog</a><a href=\"member-experience.html\">Member experience</a></div></nav></div><div class=\"s-footer-base\"><span>© 2026 Venture Executive Network · Built on FounderNexus</span><a href=\"#main\">Back to top</a></div></footer></body></html>","scripts":["pathways/examples.js","pathways/editorial.js","pathways/v12-engagement.js","clarity/application.js","clarity/inquiry-send.js","study/site.js"],"title": -notice v-demo-flag\" data-send-note><strong>Demo only.</strong> Check the details above; nothing will be sent.</p><div class=\"v-actions\" data-send-actions><button class=\"v-button v-button--primary\" type=\"button\" data-send-inquiry>Preview confirmation</button><button class=\"v-button v-button--secondary\" type=\"button\" data-edit-request>Edit details</button><button class=\"v-button v-button--secondary\" type=\"button\" data-clear-request>Clear entries</button></div><div class=\"v28-sent\" data-inquiry-sent hidden tabindex=\"-1\" role=\"status\"><p class=\"v-eyebrow\">Demo</p><h3>Demo complete. Nothing was sent.</h3><p>Edit or clear your details to run it again.</p></div></section><noscript><p>The interactive inquiry needs JavaScript. You can still explore the advisor and venture-firm pages.</p></noscript></section><aside class=\"v-inquiry-aside\"><p class=\"v-eyebrow\">Where to start</p><h2>Relevance first.</h2><p>We’ll discuss the decisions you’ve made and who they could help. Terms come before any introduction.</p><p class=\"v-note\">An inquiry does not commit you to a format or schedule.</p><div class=\"v-inquiry-next\"><h3>Planned live flow.</h3><ol class=\"v-process v24-next\"><li><strong>You send</strong><p>Your details go to VEN from this page. Nothing to email.</p></li><li><strong>Within 24 hours</strong><p>VEN replies to inquiries and questions.</p></li><li><strong>A partnership conversation</strong><p>Roles, stages and formats where your experience fits; scope and terms before any introduction.</p></li></ol></div><a class=\"v-text-link\" href=\"advisors.html\">For advisors <span aria-hidden=\"true\">→</span></a><a class=\"v-text-link\" href=\"venture-partners.html\">For venture firms <span aria-hidden=\"true\">→</span></a></aside></div></div></section></main><footer class=\"v-footer s-footer\"><div class=\"s-footer-inner\"><div class=\"s-footer-brand\"><a class=\"v-brand\" href=\"index.html\" aria-label=\"VEN, Venture Executive Network home\"><span
