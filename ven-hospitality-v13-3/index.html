y{\n --ink:#252c2b;--text:#3a4140;--muted:#555d5b;--deep:#486174;--deep-hover:#354b5c;--steel:#486174;\n --chalk:#f4f1e9;--paper:#fcfbf7;--limestone:#e7e1d5;--ivory-band:#efebe2;--mist:#e8ecec;--rule:#cbc8bd;--hair:#dcd8cd;--copper:#a3500a;--white:#fcfbf7;\n --serif:\"Newsreader\",Georgia,\"Times New Roman\",serif;\n --sans:Jakarta,\"Helvetica Neue\",Arial,sans-serif;\n --study-display:var(--serif);--study-mono:var(--sans);\n font-family:var(--sans);color:var(--text);background:var(--chalk);\n font-kerning:normal;text-rendering:optimizeLegibility;\n}\nbody.mai-study :is(h1,h2,h3,h4){font-family:var(--serif);font-weight:400;color:var(--ink);letter-spacing:-.022em;text-wrap:balance}\nbody.mai-study ::selection{background:#e7e1d5}\n\n/* ---- labels, captions, links: one sans voice ---- */\nbody.mai-study :is(.study-label,.study-facts dt,.study-note-label,.study-note-top,.study-note-bottom),\nbody.mai-interior .v-eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;line-height:1.5;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}\nbody.mai-study :is(.study-hero-fit,.study-foundation,.study-privacy,.study-role-action,.study-step){font-family:var(--sans);font-size:13px;line-height:1.65;letter-spacing:.01em;color:var(--muted)}\nbody.mai-home figcaption{font:13px/1.6 var(--sans);color:var(--muted);letter-spacing:0}\nbody.mai-study .study-link{font:500 14px/1.5 var(--sans);color:var(--ink);gap:10px;border-bottom:1px solid var(--rule);min-height:44px;text-decoration:none}\nbody.mai-study .study-link:hover{border-color:var(--ink)}\n\n/* ---- serif reading voice: headlines and leads only ---- */\nbody.mai-home :is(.study-hero-lead,.study-section-lead,.study-split-copy>p:not(.study-label),.study-role-question,.study-facts dd,.study-note-title,.study-note-row p:not(.study-note-label),.s-pair-col>p:not(.study-label):not(.s-quiet)),\nbody.mai-interior .v-lead,body.mai-study blockquote p{font-family:var(--serif);color:var(--text);letter-spacing:-.01em}\n\n/* ---- the one primary action ---- */\nbody.mai-study .study-cta{font:500 14px/1.4 var(--sans);letter-spacing:.005em;min-height:52px;gap:4px;color:#fff}\nbody.mai-study .study-cta>span:first-child{background:var(--deep);color:#fff;border-radius:999px;padding:14px 28px;min-width:0}\nbody.mai-study .study-cta .study-cta-arrow{background:var(--deep);color:#fff;border-radius:999px;width:52px;min-width:52px;font-size:17px}\nbody.mai-study .study-cta:hover>span{background:var(--deep-hover)}\nbody.mai-study .v-button{font:500 14px/1.4 var(--sans);text-transform:none;letter-spacing:0;border-radius:999px;padding:13px 24px;min-height:48px}\nbody.mai-study .v-button.v-button--primary{background:var(--deep);border-color:var(--deep);color:#fff}\nbody.mai-study .v-button.v-button--primary:hover{background:var(--deep-hover);border-color:var(--deep-hover)}\nbody.mai-study .v-button.v-button--secondary{background:var(--paper);border:1px solid rgba(37,44,43,.16);color:var(--ink)}\n\n/* ---- header: present at the top, steps aside while reading, returns on scroll up ---- */\nbody.mai-study .v-header{transition:transform .5s cubic-bezier(.2,.8,.2,1),background-color .3s ease,box-shadow .3s ease,border-color .3s ease;will-change:transform}\nbody.mai-study[data-header=\"hidden\"] .v-header{transform:translateY(calc(-100% - 32px))}\nbody.mai-study[data-scrolled=\"false\"] .v-header{background:rgba(251,251,249,.55);box-shadow:none;border-color:transparent}\nbody.mai-study .v-header .v-nav a{font-family:var(--sans)!important;font-size:14px!important;font-weight:500;color:var(--text)}\nbody.mai-study .v-header .v-nav a:hover{color:var(--ink)}\nbody.mai-study .v-header .v-nav a[aria-current=\"page\"]{color:var(--ink);text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:1px}\nbody.mai-study .v-header .v-button{min-height:40px!important;padding:8px 18px!important;font-size:13.5px!important;border-radius:999px!important}\nbody.mai-study .v-header .v-button--secondary{background:transparent;border-color:rgba(37,44,43,.18);color:var(--ink)}\nbody.mai-study .v-header .v-button--primary{background:var(--deep)!important;border:1px solid var(--deep)!important;color:#fff!important}\nbody.mai-study .v-header .v-button--primary:hover{background:var(--deep-hover)!important}\nbody.mai-study .v-menu-toggle{font:500 13px/1 var(--sans);border-radius:999px;padding-inline:18px}\nbody.mai-study .v-brand-name{color:var(--ink)}\n\n/* ---- home rhythm ---- */\nbody.mai-home h1{font-size:clamp(52px,5.8vw,88px);line-height:1.02;letter-spacing:-.028em}\nbody.mai-home h2{font-size:clamp(40px,3.8vw,58px);line-height:1.06;letter-spacing:-.025em}\nbody.mai-home .study-hero-lead{font-size:clamp(21px,1.9vw,27px);line-height:1.32;max-width:700px;margin:28px auto 0!important;color:var(--text)}\nbody.mai-home .study-hero-fit{margin-top:30px!important;font-size:12.5px}\n.study-hero-actions{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:center;margin-top:38px}\nbody.mai-home .study-section{padding-top:clamp(96px,10vw,140px);padding-bottom:20px}\nbody.mai-home .study-split{padding-top:clamp(96px,10vw,140px);min-height:0}\nbody.mai-home .study-section-lead{font-size:clamp(20px,1.7vw,24px);line-height:1.38}\nbody.mai-home .study-scroll{color:var(--ink)}\n\n/* section tabs appear between the hero and the close, and sit under the header when it returns */\nbody.mai-home .study-nav-wrap{top:16px;margin-top:8px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}\nbody.mai-home[data-header=\"shown\"] .study-nav-wrap{transform:translateY(84px)}\nbody.mai-home .study-section-nav{transition:opacity .35s ease,transform .35s ease}\nbody.mai-home[data-snav=\"off\"] .study-section-nav{opacity:0;transform:translateY(-6px);pointer-events:none}\nbody.mai-home .study-section-nav a{font:500 13px/1.4 var(--sans);color:var(--text);border-radius:999px}\nbody.mai-home .study-section-nav{border-radius:999px;padding:6px}\nbody.mai-home .study-section-nav a[aria-current=\"true\"]{color:var(--ink);background:var(--paper)}\n\n/* Partner and peers */\n.s-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px;max-width:1050px;margin:56px auto 0}\n.s-pair-col{border-top:1px solid var(--rule);padding-top:22px;min-width:0}\nbody.mai-home .s-pair-col h3{font-size:clamp(26px,2.2vw,32px);line-height:1.15;margin:14px 0 12px}\nbody.mai-home .s-pair-col>p:not(.study-label):not(.s-quiet){font-size:20px;line-height:1.42;max-width:440px}\nbody.mai-home .s-pair-col .s-quiet{font:14px/1.6 var(--sans);color:var(--muted);margin:14px 0 18px}\nbody.mai-home .study-foundation{margin-top:44px!important}\n\n/* roles: three questions, the other five one line below */\nbody.mai-home .study-role-question{color:var(--ink)}\nbody.mai-home .study-role-grid>a:hover .study-role-question{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}\n.s-role-more{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 26px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}\n.s-role-more .study-label{margin-right:4px}\n.s-role-more a{font:500 14px/1.5 var(--sans);color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:8px}\n.s-role-more a:hover{text-decoration:underline;text-underline-offset:6px}\n.s-role-more .s-role-all{color:var(--muted)}\n\n/* decision example */\nbody.mai-home .s-split-link{margin-top:28px}\nbody.mai-home .study-note-top,body.mai-home .study-note-bottom{font-size:10px;letter-spacing:.12em}\nbody.mai-home .study-note-label{font-size:10px;margin-bottom:6px!important}\nbody.mai-home .study-note-number{font:600 11px/1.5 var(--sans);color:var(--muted)}\nbody.mai-home .study-note-title{color:var(--ink);letter-spacing:-.03em}\nbody.mai-home .study-decision-image figcaption{color:var(--text);font-size:13px}\n\n/* proof: advisors and a member, one section */\n.s-proof-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px;align-items:start;margin-top:60px}\nbody.mai-home .s-proof .study-advisor-image{max-width:none}\nbody.mai-home .study-advisor-image img{filter:grayscale(1) contrast(.97) brightness(1.02)}\nbody.mai-home .study-advisor-image a:hover img{filter:grayscale(.15)}\nbody.mai-home .study-advisor-image a>span{font:500 14px/1.4 var(--sans);color:var(--ink);letter-spacing:0}\nbody.mai-home .study-advisor-image small{font:12.5px/1.5 var(--sans);color:var(--muted)}\nbody.mai-home .s-under{margin-top:18px}\nbody.mai-home .study-video video{aspect-ratio:16/9;object-fit:cover;background:#252c2b}\n.s-placeholder{max-width:780px;margin:64px auto 0;padding:24px 28px;border-left:2px solid #a7b0b6;background:rgba(251,251,249,.7);text-align:left}\n.s-placeholder .v-eyebrow{font:600 11px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#4f5f6b;margin:0}\n.s-placeholder figure{margin:12px 0 0}\n.s-placeholder blockquote{margin:0}\n.s-placeholder blockquote p{font-size:21px;line-height:1.42}\n.s-placeholder :is(.v24-attrib,figcaption){font:13px/1.6 var(--sans)!important;color:var(--muted)!important;margin-top:10px!important}\n\n/* participation and close */\nbody.mai-home .study-membership{padding-bottom:0}\nbody.mai-home .study-facts dd{color:var(--ink)}\nbody.mai-home .study-facts{margin-bottom:28px!important}\nbody.mai-home .study-privacy{max-width:720px;font-size:13.5px;line-height:1.7}\nbody.mai-home .study-privacy a{color:var(--ink);text-underline-offset:4px;white-space:nowrap}\nbody.mai-home .study-final .study-cta{margin-top:0}\nbody.mai-home .study-final{padding-top:clamp(96px,10vw,140px);padding-bottom:clamp(96px,10vw,140px)}\n\n/* ---- interior pages ---- */\nbody.mai-interior main h1{font-size:clamp(42px,4.6vw,68px);line-height:1.04;letter-spacing:-.026em}\nbody.mai-interior main h2{font-size:clamp(30px,3vw,44px);line-height:1.1}\nbody.mai-interior main h3{line-height:1.2}\nbody.mai-interior main :is(p,li,dd,td){color:var(--text)}\nbody.mai-interior .v-lead{font-size:clamp(20px,1.7vw,23px)!important;line-height:1.38!important}\nbody.mai-interior :is(.v-text-link){font:500 14px/1.5 var(--sans);color:var(--ink)}\nbody.mai-interior :is(label,.v-note,.v-form-help,dt,small,.v-demo-notice){font-family:var(--sans)}\nbody.mai-interior :is(input,select,textarea){font-family:var(--sans);font-size:15px}\n\n\n/* ---- footer: three short groups, one base line ---- */\nbody.mai-study .s-footer{background:transparent;border:0;border-top:1px solid var(--rule);padding:48px 0 22px;margin-top:24px}\n.s-footer-inner,.s-footer-base{width:min(1180px,calc(100% - 64px));margin-inline:auto}\n.s-footer-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:40px}\n.s-footer-brand .v-brand-name{font-size:24px}\nbody.mai-study .s-footer-brand p{font:13px/1.6 var(--sans);color:var(--muted);margin:12px 0 0}\n.s-footer-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}\nbody.mai-study .s-footer-nav p{font:600 11px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}\n.s-footer-nav a{display:block;width:fit-content;font:13.5px/1.5 var(--sans);color:var(--text);text-decoration:none;padding:5px 0}\n.s-footer-nav a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:5px}\n.s-footer-base{display:flex;justify-content:space-between;gap:16px;margin-top:36px;padding-top:16px;border-top:1px solid var(--rule);font:12.5px/1.5 var(--sans);color:var(--muted)}\n.s-footer-base a{color:inherit;text-decoration:none}\n.s-footer-base a:hover{color:var(--ink)}\n\n\n/* ---- ivory palette (designer guide v12.23): warm surfaces, clear signals ---- */\nbody.mai-study .study-atmosphere{background:var(--chalk)}\nbody.mai-study .study-wash--sand{background:radial-gradient(ellipse at 15% 16%,#ebe5d7 0,transparent 46%),radial-gradient(ellipse at 82% 22%,#f8f6ef 0,transparent 40%),radial-gradient(ellipse at 52% 89%,#e9e9e2 0,transparent 52%),#f4f1e9}\nbody.mai-stud ette */\nbody.mai-interior .v11-story-community img.s-story-photo{filter:saturate(.6) sepia(.14) contrast(.95) brightness(1.03)}\n.s-story-caption{font:13px/1.6 var(--sans);color:var(--muted);margin-top:12px}\nbody.v-page-story .v11-story-community{margin-bottom:28px}\n\n@media(max-width:1000px){.s-fit-facts{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:800px){\n .s-fit-grid{grid-template-columns:1fr;gap:40px}\n body.mai-interior .v11-role-directory-photo{position:static}\n body.mai-interior .v11-role-directory-photo img{aspect-ratio:1.1}\n}\n@media(max-width:700px){\n body.mai-interior .v15-partner-profile--portrait.s-partner-right{grid-template-columns:1fr;gap:20px}\n .s-partner-right .v28-partner-portrait{order:-1;width:160px;height:200px}\n}\n@media(prefers-reduced-motion:reduce){body.mai-study,body.mai-study .study-atmosphere{transition:none}}\n\n/* ===== v13.6: stronger page-colour shift; copper darkened so small numerals pass on every stop ===== */\nbody.mai-study{--copper:#9a4a09}\n\n/* v13.7: section-keyed colour with the MAI fade (1.1s, cubic-bezier(.43,.195,.02,1)). */\nbody.mai-study{background:var(--study-bg,#f4f1e9);transition:background-color 1.1s cubic-bezier(.43,.195,.02,1)}\nbody.mai-study .study-atmosphere{background:var(--study-bg,#f4f1e9);transition:background-color 1.1s cubic-bezier(.43,.195,.02,1)}\n@media (prefers-reduced-motion:reduce){body.mai-study,body.mai-study .study-atmosphere{transition:none}}\n\n/* ===== v13.8: audit priorities ===== */\n/* Membership: facts, privacy and questions at the opening, before the large photo */\nbody.mai-interior .s-mem-glance{margin-top:52px}\nbody.mai-interior .s-fit-facts--3{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 36px;margin:0 0 52px}\nbody.mai-interior .s-mem-glance .s-fit-grid{margin-bottom:60px}\n@media(max-width:700px){\n body.mai-interior .s-mem-glance{margin-top:36px}\n body.mai-interior .s-fit-facts--3{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 18px;margin-bottom:40px}\n body.mai-interior .s-fit-facts--3>div:first-child{grid-column:1/-1}\n body.mai-interior .s-fit-facts--3 dd{font-size:16.5px}\n body.mai-interior .s-mem-glance .s-fit-grid{margin-bottom:40px}\n}\n/* Inquiry: the demo is labelled before and during review */\nbody.mai-interior .v-demo-flag{color:var(--ink);font-size:14px;line-height:1.5;background:var(--paper);border:1px solid var(--hair);border-radius:4px;padding:12px 16px;margin-bottom:28px}\nbody.mai-interior .v-demo-flag strong{font-weight:600}\n/* Home phone: Partner and peers before the large photo, tighter intervals */\n@media(max-width:800px){\n body.mai-home .study-support{display:flex;flex-direction:column;align-items:stretch}\n body.mai-home .study-support>.study-centered{order:0}\n body.mai-home .study-support>.s-pair{order:1;margin:32px 0 0;gap:32px}\n body.mai-home .study-support>.study-wide-photo{order:2;margin:36px -12px 0!important}\n body.mai-home .study-support>.study-foundation{order:3;margin-left:auto;margin-right:auto}\n}\n/* Home phone hero: copy on ivory, then the whole group in view; no veil over people */\n@media(max-width:600px){\n body.mai-home .study-hero{flex-direction:column;justify-content:flex-start;align-items:stretch;min-height:0;height:auto;padding:112px 20px 0}\n body.mai-home .study-hero-copy{order:1}\n body.mai-home .s-hero-media{position:relative;inset:auto;order:2;z-index:0;margin:36px -20px 0;aspect-ratio:16/10;height:auto;\n  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 20%,#000 86%,transparent 100%)}\n body.mai-home .s-hero-media::after{display:none}\n body.mai-home .s-hero-media img{object-position:50% 70%;filter:saturate(.92)}\n body.mai-home .study-scroll{display:none}\n}\n\n/* ===== v14.0: the header floats away and the section tabs take its place (MAI pattern) ===== */\nbody.mai-study .v-header{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s ease,background-color .3s ease,box-shadow .3s ease,border-color .3s ease}\nbody.mai-study[data-header=\"hidden\"] .v-header{opacity:0}\nbody.mai-study .study-nav-wrap{position:fixed;top:16px;left:0;right:0;height:0;margin:0!important;z-index:40;text-align:center;pointer-events:none;transform:none!important;transition:none}\nbody.mai-study .study-section-nav{display:inline-flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:rgba(250,248,242,.94);border:1px solid rgba(37,44,43,.07);box-shadow:0 10px 30px rgba(37,44,43,.07);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);pointer-events:auto;\n opacity:0;visibility:hidden;transform:translateY(-26px);transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s linear .55s}\nbody.mai-study[data-snav=\"on\"][data-header=\"hidden\"] .study-section-nav{opacity:1;visibility:visible;transform:none;transition:opacity .45s cubic-bezier(.2,.8,.2,1) .1s,transform .6s cubic-bezier(.2,.8,.2,1) .1s,visibility 0s}\nbody.mai-study .study-section-nav a{min-height:44px;padding:10px 18px;display:flex;align-items:center;font:500 13px/1.4 var(--sans);letter-spacing:0;color:var(--text);border-radius:999px;white-space:nowrap;text-decoration:none!important;background:transparent}\nbody.mai-study .study-section-nav a:hover{background:var(--paper)}\nbody.mai-study .study-section-nav a[aria-current=\"true\"]{color:var(--ink);background:var(--mist)}\nbody.mai-study .study-section-nav a:focus-visible{outline:2px solid var(--steel);outline-offset:2px}\n@media(max-width:600px){\n body.mai-study .study-nav-wrap{top:12px}\n body.mai-study .study-section-nav{max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;padding:5px}\n body.mai-study .study-section-nav::-webkit-scrollbar{display:none}\n body.mai-study .study-section-nav a{font-size:12px;padding:10px 12px}\n}\n@media(prefers-reduced-motion:reduce){body.mai-study .study-section-nav,body.mai-study .v-header{transition:none}}\n@media(max-width:360px){body.mai-study .study-section-nav a{font-size:11.5px;padding:10px 9px}}\n/* v14.0: portraits in one warm monochrome, always; no grey-to-colour hover (touch screens never saw it, and the source photos don't match in colour) */\nbody.mai-study :is(.study-advisor-image img,.c-person-photo img,.c-expert figure img,.c-role-proof figure img,.v28-partner-portrait img),\nbody.mai-study :is(.study-advisor-image a:hover img,.c-person-photo:hover img,.c-expert:hover figure img,.v15-partner-profile--portrait:hover .v28-partner-portrait img){filter:grayscale(1) sepia(.12) contrast(.97) brightness(1.02);transition:none}\n\n/* ===== v14.2: Membership privacy strip; Practical questions as its own section ===== */\n.s-fit-grid--privacy{grid-template-columns:1fr}\nbody.mai-interior .s-confidential--row{display:grid;grid-template-columns:minmax(0,1.15fr) repeat(3,minmax(0,1fr));gap:32px;align-items:start;border-top:1px solid var(--rule);padding-top:24px}\nbody.mai-interior .s-confidential--row .s-conf-head h3{margin:10px 0 0}\nbody.mai-interior .s-confidential--row>p:not(.v-eyebrow){margin:0;max-width:none}\n.s-q-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:64px;align-items:start}\n.s-q-head h2{margin:10px 0 14px}\n.s-q-head p:not(.v-eyebrow){max-width:36ch;color:var(--muted)}\n@media(max-width:1000px){body.mai-interior .s-confidential--row{grid-template-columns:repeat(3,minmax(0,1fr))}body.mai-interior .s-confidential--row .s-conf-head{grid-column:1/-1}}\n@media(max-width:800px){.s-q-grid{grid-template-columns:1fr;gap:24px}}\n@media(max-width:700px){body.mai-interior .s-confidential--row{grid-template-columns:1fr;gap:12px}}\n\n/* ===== v15.0: hero, closes and the application ===== */\nbody.mai-home .study-hero h1.s-hero-community{font-size:clamp(36px,3.9vw,58px);line-height:1.06;max-width:1000px;margin-left:auto;margin-right:auto;text-wrap:balance}\nbody.mai-home .study-hero-how{font:400 16.5px/1.6 var(--sans);color:var(--muted);max-width:52ch;margin:16px auto 0;text-wrap:balance}\nbody.mai-study .v-invitation p.v-close-fit,body.mai-home .study-final p.v-close-fit,.v-close-fit{font:500 13px/1.5 var(--sans)!important;letter-spacing:.02em;color:var(--muted)!important;margin-top:10px;max-width:none}\n.study-final .v-close-fit{text-align:center}\n.v-apply-how{font:500 15px/1.55 var(--sans);color:var(--ink);margin:0 0 20px}\n.v-funding{margin:6px 0 4px}\n.v-funding legend{font:600 14px/1.45 var(--sans);color:var(--ink);margin-bottom:8px}\n.v-inline-note{font:400 14px/1.55 var(--sans);color:var(--ink);border-left:2px solid var(--copper);padding:2px 0 2px 12px;margin:2px 0 14px;max-width:56ch}\n.v-check{display:flex;gap:10px;align-items:flex-start;font:400 14.5px/1.5 var(--sans);color:var(--ink);margin:6px 0 14px}\n.v-check input{margin-top:4px;flex:none}\n.v-check span{display:block;color:var(--muted);font-size:13px}\n.v-assure{font:400 13.5px/1.55 var(--sans);color:var(--muted);margin:0 0 18px;max-width:56ch}\n.v-inquiry-next p{font:400 15px/1.6 var(--sans);color:var(--ink)}\n.v-form select{width:100%}\n\n/* ===== v15.1: hero option C ===== */\n@media(min-width:901px){\n body.mai-home .study-hero{justify-content:flex-start;text-align:left;padding-left:clamp(32px,6vw,104px);padding-right:24px;min-height:min(860px,100svh)}\n body.mai-home .study-hero-copy{max-width:min(600px,calc(47vw - clamp(32px,6vw,104px) - 32px));text-align:left}\n body.mai-home .study-hero-copy>*{margin-left:0!important;margin-right:0!important;text-align:left}\n body.mai-home .study-hero-copy>.study-label{max-width:none}\n body.mai-home .study-hero h1{font-size:clamp(44px,4.6vw,76px);line-height:1.03;max-width:12ch}\n body.mai-home .study-hero-lead{max-width:100%;margin-top:26px!important}\n body.mai-home .study-hero .study-hero-actions{justify-content:flex-start}\n /* the photo is a framed panel: below the menu bar, crisp edge, no veil */\n body.mai-home .s-hero-media{inset:auto;top:112px;bottom:28px;left:51%;right:22px;border-radius:14px;overflow:hidden;\n  -webkit-mask-image:none;mask-image:none}\n body.mai-home .s-hero-media img{object-position:100% 62%}\n body.mai-home .s-hero-media::after{display:none}\n body.mai-home .study-scroll{left:clamp(32px,6vw,104px);transform:none}\n}\n@media(min-width:901px) and (max-width:1180px){\n body.mai-home .s-hero-media{left:53%}\n body.mai-home .study-hero h1{font-size:clamp(42px,5vw,58px)}\n}\n@media(max-width:600px){\n body.mai-home .study-hero-copy{text-align:left}\n body.mai-home .study-hero-copy>*{margin-left:0!important;margin-right:0!important;text-align:left}\n body.mai-home .study-hero-copy>.study-label{max-width:none}\n body.mai-home .study-hero .study-hero-actions{align-items:flex-start;justify-content:flex-start}\n}\n/* one button: the arrow sits inside the pill */\nbody.mai-study .study-cta{gap:0;background:var(--deep);border-radius:999px;transition:background 160ms}\nbody.mai-study .study-cta>span:first-child{background:transparent;padding:14px 8px 14px 28px}\nbody.mai-study .study-cta .study-cta-arrow{background:transparent;width:auto;min-width:0;padding:0 26px 0 6px}\nbody.mai-study .study-cta:hover{background:var(--deep-hover)}\nbody.mai-study .study-cta:hover>span{background:transparent}\n\n/* ===== v15.2: floating bar over a full-bleed hero; frosted copy card ===== */\n:root{--float-radius:20px}\nbody.mai-study .v-header{border-radius:var(--float-radius)!important}\nbody.mai-study .v-header .v-nav{border-radius:var(--float-radius)!important}\nbody.mai-study[data-scrolled=\"false\"] .v-header{-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1)}\n@media(min-width:601px){\n body.mai-home .study-hero{justify-content:flex-start;align-items:center;text-align:left;padding:132px 24px 72px clamp(32px,6vw,104px);min-height:min(900px,100svh)}\n body.mai-home .s-hero-media{inset:0!important;top:0!important;left:0!important;right:0!important;bottom:0!important;border-radius:0!important;\n  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 84%,transparent 100%)!important;mask-image:linear-gradient(180deg,#000 0,#000 84%,transparent 100%)!important}\n body.mai-home .s-hero-media img{object-position:50% 62%!important}\n body.mai-home .s-hero-media::after{display:block!important;background:linear-gradient(180deg,rgba(20,24,23,.10) 0,rgba(20,24,23,0) 22%)!important}\n body.mai-home .study-hero-copy{max-width:600px!important;background:rgba(252,251,247,.76);-webkit-backdrop-filter:blur(20px) saturate(1.15);backdrop-filter:blur(20px) saturate(1.15);\n  border:1px solid rgba(255,255,255,.6);border-radius:var(--float-radius);box-shadow:0 30px 80px rgba(37,44,43,.14);padding:44px 48px 40px}\n body.mai-home .study-hero h1{font-size:clamp(42px,4.2vw,64px)!important;max-width:12ch}\n body.mai-home .study-hero-lead{font-size:clamp(19px,1.45vw,21px)!important}\n body.mai-home .study-scroll{left:50%!important;transform:translateX(-50%)!important;background:rgba(252,251,247,.7)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}\n}\n@media(max-width:600px){\n body.mai-home .study-hero{padding:0 0 8px!important;min-height:0!important}\n body.mai-home .s-hero-media{position:relative!important;inset:auto!important;order:0!important;margin:0!important;height:62svh;min-height:420px;aspect-ratio:auto!important;\n  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 78%,transparent 100%)!important;mask-image:linear-gradient(180deg,#000 0,#000 78%,transparent 100%)!important}\n body.mai-home .s-hero-media img{height:100%!important;object-position:80% 58%!important}\n body.mai-home .s-hero-media::after{display:block!important;background:linear-gradient(180deg,rgba(20,24,23,.12) 0,rgba(20,24,23,0) 26%)!important}\n body.mai-home .study-hero-copy{order:1;position:relative;z-index:2;margin:-110px 12px 0;background:rgba(252,251,247,.84);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);\n  border:1px solid rgba(255,255,255,.6);border-radius:var(--float-radius);box-shadow:0 20px 50px rgba(37,44,43,.12);padding:26px 22px 24px}\n body.mai-home .study-hero h1{font-size:36px!important}\n}\n\n/* ===== v15.3: headline on the wall, lounge plate ===== */\nbody.mai-study[data-scrolled=\"false\"] .v-header{background:rgba(243,238,230,.62)!important;-webkit-backdrop-filter:blur(16px) saturate(120%);backdrop-filter:blur(16px) saturate(120%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 1px 0 rgba(27,31,36,.04)!important}\n@media(min-width:601px){\n body.mai-home .study-hero{align-items:flex-start!important;justify-content:center!important;text-align:center!important;padding:148px 24px 0!important;min-height:clamp(720px,100svh,960px)!important}\n body.mai-home .study-hero-copy{max-width:1200px!important;text-align:center!important;background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:0!important;box-shadow:none!important;padding:0!important}\n body.mai-home .study-hero-copy>*{margin-left:auto!important;margin-right:auto!important;text-align:center!important}\n body.mai-home .study-hero-copy>.study-label{font:500 12px/1.4 var(--sans)!important;letter-spacing:.14em!important;color:rgba(37,44,43,.82)!important;margin-bottom:20px!important;max-width:none}\n body.mai-home .study-hero h1{font-size:clamp(44px,4.6vw,72px)!important;line-height:1.05!important;letter-spacing:-.015em!important;max-width:18ch!important}\n body.mai-home .study-hero-lead{font-size:20px!important;line-height:1.45!important;max-width:52ch!important;margin-top:24px!important;color:rgba(37,44,43,.88)!important;text-wrap:balance}\n body.mai-home .study-hero .study-hero-actions{justify-content:center!important;margin-top:28px!important;gap:16px 28px!important}\n body.mai-home .study-hero .study-link{border-bottom-color:transparent!important}\n body.mai-home .study-hero-fit{display:block!important;font-size:13px!important;color:rgba(37,44,43,.74)!important;margin-top:14px!important}\n body.mai-home .s-hero-media{inset:0!important;border-radius:0!important;\n  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 64px),transparent 100%)!important;mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 64px),transparent 100%)!important}\n body.mai-home .s-hero-media img{object-position:50% 100%!important}\n /* soft ivory light behind the text block, plus a light top veil under the bar */\n body.mai-home .s-hero-media::after{display:block!important;background:\n  radial-gradient(ellipse 52% 40% at 50% 27%,rgba(244,241,233,.55) 0,rgba(244,241,233,0) 72%),\n  linear-gradient(180deg,rgba(234,226,214,.6) 0,rgba(234,226,214,0) 46%)!important}\n body.mai-home .study-scroll{left:50%!important;transform:translateX(-50%)!important;width:32px!important;height:32px!important;font-size:15px!important;opacity:.6;bottom:28px!important;background:rgba(252,251,247,.7)!important}\n}\n/* one-line headline once there is room for it */\n@media(min-width:901px){body.mai-home .study-hero h1{white-space:nowrap;max-width:none!important}}\n/* narrower desktops: tighter stack so the copy clears the group; crop the half figure at the right edge */\n@media(min-width:601px) and (max-width:1279px){\n body.mai-home .study-hero{padding-top:132px!important}\n body.mai-home .study-hero-lead{font-size:19px!important;margin-top:20px!important}\n body.mai-home .study-hero .study-hero-actions{margin-top:24px!important}\n body.mai-home .study-hero-fit{margin-top:12px!important}\n body.mai-home .s-hero-media img{object-position:34% 100%!important}\n}\n@media(min-width:601px) and (max-width:900px){body.mai-home .s-hero-media img{object-position:50% 100%!important}}\n@media(max-width:600px){\n body.mai-home .s-hero-media{height:360px!important;min-height:0!important}\n body.mai-home .s-hero-media img{object-position:50% 100%!important}\n body.mai-home .study-hero-copy{margin-top:-64px!important}\n}\n"},"scripts":{"pathways/examples.js":"window.VEN_EXAMPLES={\"roles\":[{\"key\":\"ceo\",\"file\":\"role-ceo.html\",\"label\":\"Founders & CEOs\",\"short\":\"Founders & CEOs\",\"title\":\"The board sees the milestone. You see the tradeoffs.\",\"lead\":\"Growth milestones depend on choices about capital, people and delivery. Compare experience with leaders who have made those tradeoffs at a similar company stage.\",\"directoryContext\":\"Which commitments to fund, staff or stop before the next milestone.\",\"challengeQuestions\":[\"Which commitments matter most to the next milestone?\",\"Where would clearer ownership remove a constraint?\",\"What should we stop if the growth plan changes?\"],\"insight\":{\"title\":\"The milestone depends on the sequence.\",\"body\":\"Hiring, product commitments and capital decisions affect one another. Review the assumptions together before committing to each in isolation.\"},\"benefits\":[{\"title\":\"Test the operating plan\",\"body\":\"Compare how other leaders sequenced capital, people and delivery under time constraints.\"},{\"title\":\"Make room for leadership\",\"body\":\"Examine where a key hire or clearer ownership could support the plan.\"}],\"workedExample\":{\"label\":\"Example · Founders & CEOs\",\"challenge\":\"Keep the growth plan, or change the sequence?\",\"choices\":[\"Keep the sequence\",\"Adjust it\"],\"partner\":\"Founders and CEOs who have balanced growth targets, leadership capacity and capital at a comparable stage.\",\"next\":\"Set the conditions that would keep the plan intact or change the order of commitments.\",\"nextTitle\":\"Test the sequence\"},\"optionalProof\":[],\"supportCta\":\"See the Founders & CEOs page\"},{\"key\":\"sales\",\"file\":\"role-sales.html\",\"label\":\"Sales & revenue\",\"short\":\"Sales & revenue\",\"title\":\"Build revenue the company can plan around.\",\"lead\":\"Growth targets rise while capacity, buyer behavior and deal cycles change. Useful experience can help you decide where the sales process needs attention.\",\"directoryContext\":\"Sales capacity, conversion and a forecast you can explain.\",\"challengeQuestions\":[\"Add sellers, or improve conversion first?\",\"Which forecast assumptions need stronger deal evidence?\",\"Is the enterprise deal worth the delivery commitment?\"],\"insight\":{\"title\":\"Adding sellers does not automatically add sales.\",\"body\":\"Look at where qualified deals wait, how sellers spend time and what moves a buyer forward before choosing where to add capacity.\"},\"benefits\":[{\"title\":\"Choose where to add capacity\",\"body\":\"Compare conversion, sales cycles and staffing choices with leaders at a similar stage.\"},{\"title\":\"Explain the forecast\",\"body\":\"Examine deal evidence and ownership behind the commitments the company is planning around.\"}],\"workedExample\":{\"label\":\"Example · Sales & revenue\",\"challenge\":\"Add sellers, or improve conversion first?\",\"choices\":[\"Add capacity\",\"Improve conversion\"],\"partner\":\"Sales leaders who have diagnosed conversion, capacity and sales-cycle constraints at a comparable stage.\",\"next\":\"Trace where qualified deals stall, then decide whether staffing or the process needs to change.\",\"nextTitle\":\"Find the constraint\"},\"optionalProof\":[],\"supportCta\":\"See the Sales & revenue page\"},{\"key\":\"marketing\",\"file\":\"role-marketing.html\",\"label\":\"Marketing\",\"short\":\"Marketing\",\"title\":\"Connect growth spend to qualified demand.\",\"lead\":\"A busy channel can hide a weak pipeline. Compare experience with targeting, messaging and sales handoffs before committing more budget.\",\"directoryContext\":\"Positioning, channel investment and demand that reaches sales.\",\"challengeQuestions\":[\"Does this channel deserve more budget?\",\"Where does demand lose quality before reaching sales?\",\"Does the message fit the buyer we need now?\"],\"insight\":{\"title\":\"The channel and the handoff both matter.\",\"body\":\"Follow a qualified buyer through the journey. Targeting, qualification or sales ownership may need attention alongside the campaign.\"},\"benefits\":[{\"title\":\"Know what earns more spend\",\"body\":\"Compare channel traction with pipeline quality before changing the investment.\"},{\"title\":\"Connect demand to the buying decision\",\"body\":\"Explore positioning and handoffs with operators who have worked through similar changes.\"}],\"workedExample\":{\"label\":\"Example · Marketing\",\"challenge\":\"Does the promising channel deserve more budget?\",\"choices\":[\"Increase spend\",\"Validate first\"],\"partner\":\"Marketing operators who have judged channel traction against qualified pipeline.\",\"next\":\"Agree what pipeline evidence and handoff checks would support more spend.\",\"nextTitle\":\"Define the evidence\"},\"optionalProof\":[],\"supportCta\":\"See the Marketing page\"},{\"key\":\"finance\",\"file\":\"role-finance.html\",\"label\":\"Finance\",\"short\":\"Finance\",\"title\":\"Protect runway without losing the milestone.\",\"lead\":\"Revenue, hiring and delivery commitments compete for capital. You need a plan that accounts for slower revenue, longer sales cycles or a change in financing.\",\"directoryContext\":\"Runway, hiring and spend, and what the plan costs to reach.\",\"challengeQuestions\":[\"Which spending protects the next milestone?\",\"Where can we extend runway without stalling delivery?\",\"Which growth assumption makes the budget fragile?\"],\"insight\":{\"title\":\"Link each budget commitment to the milestone.\",\"body\":\"Equal cuts can affect delivery unequally. Examine each commitment against the milestone it supports and the cash it requires.\"},\"benefits\":[{\"title\":\"See the operating effect of a cash choice\",\"body\":\"Compare how finance leaders balanced runway with the commitments needed to deliver.\"},{\"title\":\"Make the assumptions visible\",\"body\":\"Examine scenarios behind hiring and spending so leaders can see what would change the plan.\"}],\"workedExample\":{\"label\":\"Example · Finance\",\"challenge\":\"Which commitments do we protect if the plan changes?\",\"choices\":[\"Keep the allocation\",\"Change it\"],\"partner\":\"Finance leaders who have balanced runway with investment in an operating milestone.\",\"next\":\"Compare cash and delivery effects before confirming or changing the allocation.\",\"nextTitle\":\"Compare the operating effect\"},\"optionalProof\":[],\"supportCta\":\"See the Finance page\"},{\"key\":\"product\",\"file\":\"role-product.html\",\"label\":\"Product & technology\",\"short\":\"Product & technology\",\"title\":\"Balance customer commitments with a reliable product.\",\"lead\":\"What you agree to build changes the roadmap and delivery risk. Compare experience before promising work that may displace another priority.\",\"directoryContext\":\"Customer commitments, product reliability and the roadmap.\",\"challengeQuestions\":[\"Ship the customer feature, or protect reliability first?\",\"Which requests belong on the roadmap?\",\"Build this capability, or buy it?\"],\"insight\":{\"title\":\"A customer commitment has a second cost.\",\"body\":\"Maintenance, support and deferred work belong in the decision alongside the feature’s value.\"},\"benefits\":[{\"title\":\"Weigh the work beyond the launch\",\"body\":\"Compare customer value with delivery, support and the work already planned.\"},{\"title\":\"Make the commitment clear across functions\",\"body\":\"Draw on experience explaining product and technical risks to commercial and finance leaders.\"}],\"workedExample\":{\"label\":\"Example · Product & technology\",\"challenge\":\"Ship the customer feature, or protect reliability first?\",\"choices\":[\"Ship the feature\",\"Protect reliability\"],\"partner\":\"Product and technology leaders who have weighed customer commitments against platform constraints.\",\"next\":\"Compare delivery, support and reliability costs before making the customer commitment.\",\"nextTitle\":\"Examine the commitment\"},\"optionalProof\":[],\"supportCta\":\"See the Product & technology page\"},{\"key\":\"operations\",\"file\":\"role-operations.html\",\"label\":\"Operations\",\"short\":\"Operations\",\"title\":\"Make delivery reliable as volume grows.\",\"lead\":\"Increasing volume exposes gaps in ownership, capacity and how work moves between teams. Relevant operating experience can help you decide what needs to change.\",\"directoryContext\":\"Who owns what, and whether delivery holds as volume grows.\",\"challengeQuestions\":[\"Is the bottleneck capacity, ownership or a handoff?\",\"Change the tools, or improve the process first?\",\"Which decisions should move closer to the work?\"],\"insight\":{\"title\":\"A new tool can preserve an old bottleneck.\",\"body\":\"Trace where work waits and who can move it forward before choosing a system or process change.\"},\"benefits\":[{\"title\":\"Understand the delay before adding capacity\",\"body\":\"Compare process and staffing choices with operators who have managed growing volume.\"},{\"title\":\"Put ownership where the work happens\",\"body\":\"Explore how others clarified decisions when informal coordination stopped being enough.\"}],\"workedExample\":{\"label\":\"Example · Operations\",\"challenge\":\"More customer commitments. Who owns delivery?\",\"choices\":[\"Keep the process\",\"Change it\"],\"partner\":\"Operators who have coordinated ownership and capacity across growing teams.\",\"next\":\"Clarify what the company can commit to, what to sequence and who owns delivery.\",\"nextTitle\":\"Clarify the commitment\"},\"optionalProof\":[],\"supportCta\":\"See the Operations page\"},{\"key\":\"people\",\"file\":\"role-people.html\",\"label\":\"People leadership\",\"short\":\"People\",\"title\":\"Build the capabilities the next stage needs.\",\"lead\":\"Growth changes roles, leadership needs and expectations. People decisions need to support the plan and the team already doing the work.\",\"directoryContext\":\"Which leaders to hire, how ownership shifts and who you keep.\",\"challengeQuestions\":[\"Make a hire, or change how the work is owned?\",\"Which leadership capability does the next stage need?\",\"How do we retain strong people as responsibilities change?\"],\"insight\":{\"title\":\"An overloaded role can look like a hiring gap.\",\"body\":\"Separate a missing capability from work that has accumulated in the wrong place before deciding how to fill the gap.\"},\"benefits\":[{\"title\":\"Define the capability before the position\",\"body\":\"Compare role design and hiring choices with people leaders at a similar stage.\"},{\"title\":\"Help the existing team through change\",\"body\":\"Draw on experience with expectations, compensation and retention as responsibilities evolve.\"}],\"workedExample\":{\"label\":\"Example · People leadership\",\"challenge\":\"Make a hire, or change how the work is owned?\",\"choices\":[\"Make the hire\",\"Change ownership\"],\"partner\":\"People leaders who have navigated hiring and changing responsibilities through growth.\",\"next\":\"Clarify the capability gap and existing workload before choosing a hire or a change in ownership.\",\"nextTitle\":\"Clarify the capability\"},\"optionalProof\":[],\"supportCta\":\"See the People leadership page\"},{\"key\":\"other\",\"file\":\"role-other.html\",\"label\":\"Another leadership role\",\"short\":\"Another role\",\"title\":\"Bring outside experience to work across teams.\",\"lead\":\"Customer success, strategy, a specialist function or several responsibilities at once. Start with the work you own, even when the title does not fit one function.\",\"directoryContext\":\"Customer success, strategy, specialist functions and combined responsibilities.\",\"challengeQuestions\":[\"How much bespoke work can we commit to a customer?\",\"Which cross-functional constraint threatens the milestone?\",\"Do we need outside expertise or a different handoff?\"],\"insight\":{\"title\":\"One customer’s exception can become everyone’s process.\",\"body\":\"Consider delivery cost and customer expectations together when deciding whether a commitment can be repeated.\"},\"benefits\":[{\"title\":\"Find experience for the responsibility\",\"body\":\"Your Partner starts with your work and seeks relevant operating experience.\"},{\"title\":\"Connect the functions in the question\",\"body\":\"Examine customer, delivery and company priorities before making a commitment.\"}],\"workedExample\":{\"label\":\"Example · Customer success\",\"challenge\":\"How much bespoke work can we commit to this customer?\",\"choices\":[\"Bespoke work\",\"Standard scope\"],\"partner\":\"Customer success and operations leaders who have balanced bespoke work with repeatable delivery.\",\"next\":\"Make delivery cost and customer expectations explicit before deciding what to offer.\",\"nextTitle\":\"Scope the commitment\"},\"optionalProof\":[],\"supportCta\":\"See support for your role\"}],\"equation\":[{\"key\":\"sales\",\"label\":\"Sales capacity\",\"challenge\":\"Add sellers, or improve conversion first?\",\"partner\":\"Sales leaders who have separated a capacity problem from a conversion problem.\",\"choice\":\"Decide whether the next dollar goes to sellers or to conversion.\",\"next\":\"Decide whether the next dollar goes to sellers or to conversion.\",\"nextOptions\":[{\"title\":\"Confirm the hiring plan\",\"body\":\"Write the hiring brief with the capacity gap named.\"},{\"title\":\"Adjust the investment\",\"body\":\"Fix conversion before committing more headcount.\"}],\"carryForward\":\"The next hiring and budget decisions start from what you found.\"},{\"key\":\"marketing\",\"label\":\"Marketing spend\",\"challenge\":\"Does this channel deserve a larger budget?\",\"partner\":\"Marketing operators who have compared channel activity with qualified pipeline.\",\"choice\":\"Decide what evidence would justify more spend.\",\"next\":\"Decide what evidence would justify more spend.\",\"nextOptions\":[{\"title\":\"Confirm the investment\",\"body\":\"If the pipeline evidence holds up, keep the current growth budget.\"},{\"title\":\"Adjust the approach\",\"body\":\"Test the weak point before a larger budget commitment.\"}],\"carryForward\":\"The next spend decision starts from that evidence.\"},{\"key\":\"people\",\"label\":\"Role design\",\"challenge\":\"Make a hire, or change how the work is owned?\",\"partner\":\"People leaders who have separated a capability gap from an overloaded role.\",\"choice\":\"Decide whether the gap needs a hire or different ownership.\",\"next\":\"Decide whether the gap needs a hire or different ownership.\",\"nextOptions\":[{\"title\":\"Confirm the hire\",\"body\":\"Write the role and hiring brief around the capability gap.\"},{\"title\":\"Adjust the responsibilities\",\"body\":\"Move ownership or expectations where the current team can cover the work.\"}],\"carryForward\":\"Hiring and ownership decisions shape the next workload.\"}]};","pathways/editorial.js":"(() => {\n  'use strict';\n  document.documentElement.classList.add('js');\n  const q = (s, root = document) => root.querySelector(s);\n  const all = (s, root = document) => [...root.querySelectorAll(s)];\n  const params = new URLSearchParams(window.__VEN_PAGE_QUERY__ || window.__VEN_PAGE_QUERY__);\n\n  const toggle = q('.v-menu-toggle');\n  const nav = q('#v-primary-nav');\n  const closeMenu = (focus = false) => {\n    if (!toggle || !nav) return;\n    toggle.setAttribute('aria-expanded', 'false');\n    nav.classList.remove('is-open');\n    const mark = q('span', toggle);\n    if (mark) mark.textContent = '＋';\n    if (focus) toggle.focus();\n  };\n  if (toggle && nav) {\n    toggle.addEventListener('click', () => {\n      const open = toggle.getAttribute('aria-expanded') !== 'true';\n      toggle.setAttribute('aria-expanded', String(open));\n      nav.classList.toggle('is-open', open);\n      const mark = q('span', toggle);\n      if (mark) mark.textContent = open ? '−' : '＋';\n    });\n    document.addEventListener('keydown', e => {\n      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') closeMenu(true);\n    });\n    document.addEventListener('click', e => {\n      if (!nav.contains(e.target) && !toggle.contains(e.target)) closeMenu();\n    });\n    nav.addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });\n    matchMedia('(min-width:1121px)').addEventListener('change', e => { if (e.matches) closeMenu(); });\n  }\n\n  const data = window.VEN_EXAMPLES || {roles: [], equation: []};\n  const roleSelect = q('#role-example-select');\n  if (roleSelect) {\n    roleSelect.disabled = false;\n    const showRole = (announce = false) => {\n      const role = data.roles.find(r => r.key === roleSelect.value);\n      if (!role) return;\n      q('[data-role-challenge]').textContent = role.workedExample.challenge;\n      q('[data-role-perspective]').textContent = role.workedExample.partner;\n      q('[data-role-next]').textContent = role.workedExample.next;\n      q('.v-example-challenge .v-note').textContent = 'Example · ' + role.label;\n      const link = q('.v-role-detail-link');\n      const rolePath = 'role-' + role.key + '.html';\n      const routePrefix = (window.__VEN_FULL_ROUTE__ || '').replace(/[^/]*$/, '');\n      link.href = window.__VEN_ROOT_URL__ && routePrefix\n        ? window.__VEN_ROOT_URL__ + '#/' + routePrefix + rolePath\n        : rolePath;\n      link.textContent = role.supportCta + ' →';\n      if (announce) q('[data-role-status]').textContent = role.label + ' example shown.';\n    };\n    if (data.roles.some(r => r.key === params.get('role'))) roleSelect.value = params.get('role');\n    showRole();\n    roleSelect.addEventListener('change', () => showRole(true));\n  }\n  const equationSelect = q('#equation-example-select');\n  const showEquation = (announce = false) => {\n    if (!equationSelect) return;\n    const x = data.equation.find(item => item.key === equationSelect.value);\n    if (!x) return;\n    for (const [attr, key] of [['challenge','challenge'],['partner','partner'],['carry','carryForward']]) {\n      const element = q('[data-equation-' + attr + ']');\n      if (element) element.textContent = x[key];\n    }\n    const choice = q('[data-equation-next]');\n    if (choice) choice.textContent = x.choice || x.next;\n    const options = q('[data-equation-options]');\n    if (options) {\n      options.replaceChildren();\n      for (const option of x.nextOptions || []) {\n        const article = document.createElement('article');\n        const title = document.createElement('h4');\n        const body = document.createElement('p');\n        title.textContent = option.title;\n        body.textContent = option.body;\n        article.append(title, body);\n        options.append(article);\n      }\n    }\n    const status = q('[data-equation-status]');\n    if (status && announce) status.textContent = x.label + ' decision example shown.';\n  };\n  if (equationSelect) {\n    equationSelect.disabled = false;\n    showEquation();\n    equationSelect.addEventListener('change', () => showEquation(true));\n  }\n\n  const form = q('[data-inquiry-form]');\n  if (form) {\n    const partner = form.id === 'partner-form';\n    const review = q(partner ? '#partner-review' : '#request-review');\n    const summary = q(partner ? '#partner-summary' : '#request-summary');\n    const focusLabel = q('[data-partner-focus-label]');\n    const updateType = () => {\n      if (focusLabel) focusLabel.textContent = form.elements.type.value === 'vc' ? 'Where could your portfolio leaders use perspective?' : 'Who do you serve best?';\n    };\n    if (partner && ['advisor', 'vc'].includes(params.get('type'))) {\n      form.elements.type.value = params.get('type');\n    } else if (!partner) {\n      if (form.elements.intent && ['individual', 'team'].includes(params.get('intent'))) form.elements.intent.value = params.get('intent');\n      const role = data.roles.find(r => r.key === params.get('role'));\n      if (role) form.elements.role.value = role.label;\n    }\n    form.addEventListener('change', updateType);\n    updateType();\n    const names = {intent:'Exploring for',type:'Partnership',name:'Name',email:'Email',company:'Company or firm',role:'Role',stage:'Latest round',priority:'Challenge',funding:'Raised $1M+ in venture funding',website:'Company website',referrer:'Referred by',updates:'Email updates',focus:'Relevant audience and decisions',interest:'What to explore'};\n    const values = {individual:'Myself',team:'My colleagues',advisor:'Advisor',vc:'Venture firm'};\n    form.addEventListener('submit', e => {\n      e.preventDefault();\n      if (!form.reportValidity()) return;\n      summary.replaceChildren();\n      for (const [key, raw] of new FormData(form)) {\n        const value = String(raw).trim();\n        if (!value) continue;\n        const dt = document.createElement('dt');\n        const dd = document.createElement('dd');\n        dt.textContent = names[key] || key;\n        dd.textContent = (key === 'intent' || key === 'type') ? values[value] || value : value;\n        summary.append(dt, dd);\n      }\n      form.hidden = true;\n      review.hidden = false;\n      q('#review-title').focus();\n    });\n    q('[data-edit-request]').addEventListener('click', () => {\n      review.hidden = true;\n      form.hidden = false;\n      q('#name').focus();\n    });\n    q('[data-clear-request]').addEventListener('click', () => {\n      const clearedIntent = !partner && form.elements.intent ? form.elements.intent.value : null;\n      form.reset();\n      if (clearedIntent) form.elements.intent.value = clearedIntent;\n      updateType();\n      summary.replaceChildren();\n      review.hidden = true;\n      form.hidden = false;\n      q('#name').focus();\n    });\n    form.hidden = false;\n  }\n\n  const copy = q('#copy-sponsor');\n  if (copy) copy.disabled = false;\n  if (copy) copy.addEventListener('click', async () => {\n    const note = q('#sponsor-note');\n    try {\n      if (!navigator.clipboard) throw new Error('clipboard unavailable');\n      await navigator.clipboard.writeText(note.innerText);\n      q('#copy-status').textContent = 'Conversation starter copied.';\n    } catch (_) {\n      const range = document.createRange();\n      range.selectNodeContents(note);\n      const selection = window.getSelection();\n      selection.removeAllRanges();\n      selection.addRange(range);\n      q('#copy-status').textContent = 'Text selected. Use your usual copy command to copy it.';\n    }\n  });\n  const print = q('#print-overview');\n  if (print) print.disabled = false;\n  if (print) print.addEventListener('click', () => window.print());\n\n  for (const filter of all('[data-topic-filter]')) {\n   filter.disabled = false;\n   filter.addEventListener('click', () => {\n    all('[data-topic-filter]').forEach(button => button.setAttribute('aria-pressed', String(button === filter)));\n    const topic = filter.dataset.topicFilter;\n    let count = 0;\n    for (const event of all('#event-list .v-event')) {\n      event.hidden = topic !== 'all' && event.dataset.topic !== topic;\n      if (!event.hidden) count++;\n    }\n    q('#event-filter-status').textContent = count + (count === 1 ? ' session shown.' : ' sessions shown.');\n   });\n  }\n})();\n","pathways/v12-engagement.js":"(() => {\n  'use strict';\n  const params = new URLSearchParams(window.__VEN_PAGE_QUERY__ || window.__VEN_PAGE_QUERY__);\n  document.querySelectorAll('[data-engagement-gallery]').forEach(gallery => {\n    const tabs = [...gallery.querySelectorAll('[role=\"tab\"]')];\n    const activate = (tab, moveFocus=false) => {\n      tabs.forEach(item => {\n        const chosen = item === tab;\n        item.setAttribute('aria-selected', String(chosen));\n        item.tabIndex = chosen ? 0 : -1;\n        document.getElementById(item.getAttribute('aria-controls')).hidden = !chosen;\n      });\n      if (moveFocus) tab.focus();\n    };\n    tabs.forEach((tab, index) => {\n      tab.addEventListener('click', () => activate(tab));\n      tab.addEventListener('keydown', e => {\n        let next;\n        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = (index + 1) % tabs.length;\n        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;\n        if (e.key === 'Home') next = 0;\n        if (e.key === 'End') next = tabs.length - 1;\n        if (next !== undefined) { e.preventDefault(); activate(tabs[next], true); }\n      });\n    });\n    const requested = tabs.find(tab => tab.dataset.mode === params.get('format'));\n    if (requested) activate(requested);\n  });\n})();\n","care/advisor-carousel.js":"(() => {\n  'use strict';\n  if (typeof window.__VEN_ADVISOR_CLEANUP__ === 'function') window.__VEN_ADVISOR_CLEANUP__();\n  const root = document.querySelector('[data-advisor-carousel]');\n  if (!root) return;\n  const track = root.querySelector('[data-advisor-track]');\n  const cards = [...track.querySelectorAll('.c-person')];\n  const previous = root.querySelector('[data-advisor-previous]');\n  const next = root.querySelector('[data-advisor-next]');\n  const counter = root.querySelector('[data-advisor-count]');\n  const abort = new AbortController();\n  const options = {signal: abort.signal};\n  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');\n  let frame = 0;\n  function layout() {\n    const rect = track.getBoundingClientRect();\n    const visible = cards.map((card,index) => ({rect:card.getBoundingClientRect(),index})).filter(item => item.rect.left >= rect.left - 3 && item.rect.right \u003c= rect.right + 3);\n    const first = visible[0]?.index ?? cards.findIndex(card => card.getBoundingClientRect().right > rect.left + 8);\n    const last = visible.at(-1)?.index ?? Math.max(first,0);\n    return {first:Math.max(first,0),last:Math.max(last,0),count:Math.max(visible.length,1)};\n  }\n  function update() {\n    const view=layout();\n    previous.disabled = track.scrollLeft \u003c 3;\n    ne     if(current.anchor){
      const el=document.getElementById(decodeURIComponent(current.anchor.slice(1)));
      if(el){el.scrollIntoView();if(el.matches('main,h1,h2,[tabindex]')){if(!el.hasAttribute('tabindex'))el.tabIndex=-1;el.focus({preventScroll:true});}}
    }else{
      window.scrollTo(0,0);
      if(moveFocus){const h1=document.querySelector('h1');if(h1){h1.tabIndex=-1;h1.focus({preventScroll:true});}}
    }
  }
  async function render(){
    const current=state(), key=current.route+current.query, id=++renderId;
    if(key===activeKey){focusAndScroll(current,false);return;}
    const moveFocus=!!activeKey;
    if (typeof window.__VEN_ADVISOR_CLEANUP__ === "function") window.__VEN_ADVISOR_CLEANUP__();
    activeKey=key;
    const page=bundle.pages[current.route];
    let html=page.html.replace(/\[\[VEN_STYLE:([^\]]+)\]\]/g,(_,name)=>bundle.styles[name]);
    const parsed=new DOMParser().parseFromString(fillAssets(html),'text/html');
    document.title=parsed.title||page.title;
    document.head.querySelectorAll('style[data-ven-page]').forEach(el=>el.remove());
    parsed.head.querySelectorAll('style').forEach(style=>{const copy=document.createElement('style');copy.dataset.venPage='';copy.textContent=style.textContent;document.head.append(copy);});
    const description=document.querySelector('meta[name=description]');
    description.content=parsed.querySelector('meta[name=description]')?.content||'Venture Executive Network';
    document.body.className=parsed.body.className;
    document.body.innerHTML=parsed.body.innerHTML;
    window.__VEN_ROOT_URL__=rootURL;
    window.__VEN_PAGE_ROUTE__=current.route.split('/').pop();
    window.__VEN_FULL_ROUTE__=current.route;
    window.__VEN_PAGE_QUERY__=current.query;
    for(const name of page.scripts){const script=document.createElement('script');script.dataset.source=name;script.textContent=fillAssets(bundle.scripts[name]);document.body.append(script);}
    routeLinks(current);
    await document.fonts.ready;
    if(id!==renderId)return;
    if(current.anchor){document.querySelectorAll('img').forEach(img=>img.loading='eager');await Promise.all([...document.images].map(img=>img.decode().catch(()=>{})));}
    if(id!==renderId)return;
    requestAnimationFrame(()=>focusAndScroll(current,moveFocus));
  }
  window.__VEN_HAS_PAGE__=target=>!!bundle.pages[new URL(target,'https://ven.local/').pathname.slice(1)];
  window.__VEN_NAVIGATE__=target=>{location.hash='/'+target;};
  window.__VEN_REDIRECT__=target=>{location.replace(rootURL+'#/'+target);};
  document.addEventListener('click',event=>{
    const a=event.target.closest('a[href]');
    if(!a||event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
    if(a.href.startsWith(rootURL+'#/')){
      event.preventDefault();const target=a.href.slice((rootURL+'#/').length);
      if(location.hash==='#/'+target)focusAndScroll(state(),false);else window.__VEN_NAVIGATE__(target);
    }
  });
  window.addEventListener('hashchange',render);
  render();
})();
</script></body></html>
